<!DOCTYPE html>

<html lang="ja">

<head>

<meta charset="UTF-8">

<title>超音波 Dual-Triplet (ゼロ無音・ノイズレス高速版)</title>

<style>

body{font-family:sans-serif;max-width:980px;margin:20px auto;padding:0 15px;line-height:1.5;background:#0d0f12;color:#e6edf3}

.card{background:#161b22;border:1px solid #30363d;border-radius:8px;padding:15px;margin-bottom:20px}

button{padding:8px 16px;margin:4px 2px;cursor:pointer;font-weight:bold;border-radius:6px;border:1px solid #30363d;background:#21262d;color:#c9d1d9}

button:hover{background:#30363d}

button.primary{background:#8505d5;color:#fff;border-color:#9c1fe8}

button.primary:hover{background:#9c1fe8}

button.danger{background:#da3633;color:#fff;border-color:#f85149}

.settings-grid{display:grid;grid-template-columns:1fr 1fr;gap:15px;margin:10px 0}

.slider-group{background:#0d1117;padding:10px;border-radius:6px;border:1px solid #30363d}

.slider-group label{display:block;font-size:0.85em;font-weight:bold;margin-bottom:5px;color:#8b949e}

.slider-group input[type="range"]{width:100%}

.status{font-weight:bold;margin-top:10px;color:#58a6ff}

.badge{display:inline-block;background:#21262d;border:1px solid #30363d;padding:6px 10px;border-radius:4px;margin:4px;font-size:.85em}

.log-box{font-family:monospace;background:#05070a;color:#7ee787;border-radius:6px;padding:12px;margin-top:10px;white-space:pre-wrap;font-size:0.85em;max-height:220px;overflow-y:auto;border:1px solid #30363d}

canvas{width:100%;height:260px;background:#05070a;border:1px solid #30363d;border-radius:6px;display:block}

.id-input{font-size:1.15em;padding:6px;width:200px;font-family:monospace;font-weight:bold;background:#0d1117;border:1px solid #30363d;color:#58a6ff;border-radius:6px}

</style>

</head>

<body>



<div class="card">

  <h2>物理層・プロトコル設定 (シームレス連続伝送)</h2>

  <div class="settings-grid">

    <div class="slider-group">

      <label>送信ゲイン: <span id="label-gain">0.12</span></label>

      <input type="range" id="input-gain" min="0.01" max="0.3" step="0.01" value="0.12">

    </div>

    <div class="slider-group">

      <label>スロット時間 (無音なし): <span id="label-slot">90</span> ms</label>

      <input type="range" id="input-slot" min="60" max="180" step="5" value="90">

    </div>

    <div class="slider-group">

      <label>ピーク検出 最小dB閾値: <span id="label-min-db">-90</span> dB</label>

      <input type="range" id="input-min-db" min="-105" max="-50" step="1" value="-90">

    </div>

    <div class="slider-group">

      <label>トリガー検出 閾値 (19.8kHz): <span id="label-trig-db">-80</span> dB</label>

      <input type="range" id="input-trig-db" min="-95" max="-40" step="1" value="-80">

    </div>

  </div>

</div>



<div class="card">

  <h2>送信側 (Transmitter)</h2>

  <div>

    <label>送信ID (0 〜 113,635,599): </label>

    <input type="number" id="tx-id-input" class="id-input" min="0" max="113635599" value="12345678">

    <button id="btn-tx-send" class="primary">シームレス送信</button>

    <button id="btn-tx-abort" class="danger">中止</button>

  </div>

  <div class="status" id="tx-status">停止中</div>

  <div class="log-box" id="tx-log">[送信ログ待機中]</div>

</div>



<div class="card">

  <h2>受信側 (Receiver)</h2>

  <button id="btn-rx-toggle">マイク受信を開始</button>

  <div class="status" id="rx-status">停止中</div>

  <div id="rx-badges" style="margin-top:10px;"></div>

  <div class="log-box" id="rx-log">[受信ログ待機中]</div>

</div>



<div class="card">

  <h2>リアルタイムFFT (4096pt)</h2>

  <canvas id="spectrumCanvas" width="900" height="260"></canvas>

</div>



<script>

"use strict";



const NUM_CHANNELS = 41;

const BASE_FREQ = 17500;

const STEP_FREQ = 52;

const TRIGGER_FREQ = 19800;

const GUARD_FREQ = 19600;

const COMBINATIONS = 10660; // 41C3

const MAX_TOTAL_ID = (COMBINATIONS * COMBINATIONS) - 1;

const FREQS = Array.from({length: NUM_CHANNELS}, (_, i) => BASE_FREQ + i * STEP_FREQ);



// FFTサイズを4096に最適化 (時間窓長約85ms, ビン幅約11.7Hz)

const FFT_SIZE = 4096;



const TRIPLETS = [];

const TRIPLET_MAP = new Map();

for(let i = 0; i < NUM_CHANNELS; i++){

  for(let j = i + 1; j < NUM_CHANNELS; j++){

    for(let k = j + 1; k < NUM_CHANNELS; k++){

      const id = TRIPLETS.length;

      const trip = [i, j, k];

      TRIPLETS.push(trip);

      TRIPLET_MAP.set(`${i},${j},${k}`, id);

    }

  }

}



function calcCheckDigit(id1, id2){

  return (id1 * 31 + id2 * 17) % COMBINATIONS;

}



const inputGain = document.getElementById("input-gain");

const inputSlot = document.getElementById("input-slot");

const inputMinDb = document.getElementById("input-min-db");

const inputTrigDb = document.getElementById("input-trig-db");



inputGain.addEventListener("input", () => document.getElementById("label-gain").innerText = parseFloat(inputGain.value).toFixed(2));

inputSlot.addEventListener("input", () => document.getElementById("label-slot").innerText = inputSlot.value);

inputMinDb.addEventListener("input", () => document.getElementById("label-min-db").innerText = inputMinDb.value);

inputTrigDb.addEventListener("input", () => document.getElementById("label-trig-db").innerText = inputTrigDb.value);



let txAudioCtx = null;

let activeOscs = [];

const txStatus = document.getElementById("tx-status");

const txLog = document.getElementById("tx-log");

const txIdInput = document.getElementById("tx-id-input");



function abortTx(){

  activeOscs.forEach(o => { try{ o.stop(); o.disconnect(); }catch(e){} });

  activeOscs = [];

  txStatus.innerText = "停止中";

}

document.getElementById("btn-tx-abort").addEventListener("click", abortTx);



// シームレス連続送信 (無音時間を完全ゼロ化 & 台形エンベロープでクリック排除)

function executeTransmission(totalId){

  abortTx();

  if(!txAudioCtx) txAudioCtx = new (window.AudioContext || window.webkitAudioContext)();

  if(txAudioCtx.state === "suspended") txAudioCtx.resume();



  const id1 = Math.floor(totalId / COMBINATIONS);

  const id2 = totalId % COMBINATIONS;

  const cdId = calcCheckDigit(id1, id2);



  const t1 = TRIPLETS[id1];

  const t2 = TRIPLETS[id2];

  const cd = TRIPLETS[cdId];



  const slotMs = parseInt(inputSlot.value, 10);

  const slotSec = slotMs / 1000.0;

  const trigSec = 0.12; // トリガーは120ms

  const targetGain = parseFloat(inputGain.value);

  const ramp = 0.012; // 12msの線形ランプでパチパチ音を完全消滅



  const now = txAudioCtx.currentTime + 0.04;



  // 3系統のオシレーターを常時接続し、周波数とゲインを連続変調

  const oscs = [txAudioCtx.createOscillator(), txAudioCtx.createOscillator(), txAudioCtx.createOscillator()];

  const gains = [txAudioCtx.createGain(), txAudioCtx.createGain(), txAudioCtx.createGain()];



  for(let i = 0; i < 3; i++){

    oscs[i].type = "sine";

    oscs[i].connect(gains[i]);

    gains[i].connect(txAudioCtx.destination);

    activeOscs.push(oscs[i]);

  }



  // --- 1. トリガー (19.8kHz 単音) ---

  oscs[0].frequency.setValueAtTime(TRIGGER_FREQ, now);

  gains[0].gain.setValueAtTime(0, now);

  gains[0].gain.linearRampToValueAtTime(targetGain, now + ramp);

  gains[0].gain.setValueAtTime(targetGain, now + trigSec - ramp);

  gains[0].gain.linearRampToValueAtTime(0, now + trigSec);



  gains[1].gain.setValueAtTime(0, now);

  gains[2].gain.setValueAtTime(0, now);



  // --- 2. データスロット (T1 -> T2 -> CD を隙間なく連続配置) ---

  const sequence = [t1, t2, cd];

  let tCursor = now + trigSec;



  for(let s = 0; s < sequence.length; s++){

    const trip = sequence[s];

    const sStart = tCursor;

    const sEnd = tCursor + slotSec;



    for(let i = 0; i < 3; i++){

      const freq = FREQS[trip[i]];

      oscs[i].frequency.setValueAtTime(freq, sStart);



      gains[i].gain.setValueAtTime(0, sStart);

      gains[i].gain.linearRampToValueAtTime(targetGain / 3, sStart + ramp);

      gains[i].gain.setValueAtTime(targetGain / 3, sEnd - ramp);

      gains[i].gain.linearRampToValueAtTime(0, sEnd);

    }

    tCursor += slotSec;

  }



  const totalTime = tCursor - now;

  for(let i = 0; i < 3; i++){

    oscs[i].start(now);

    oscs[i].stop(tCursor + 0.05);

  }



  txStatus.innerText = `送信中 (総時間: ${(totalTime * 1000).toFixed(0)} ms)`;

  txLog.innerText = `[送信] Full ID: ${totalId}\n  T1: [${t1.join(",")}] ID:${id1}\n  T2: [${t2.join(",")}] ID:${id2}\n  CD: [${cd.join(",")}] ID:${cdId}\n  総時間: ${(totalTime * 1000).toFixed(0)} ms (無音ゼロ)`;



  setTimeout(() => { txStatus.innerText = "送信完了"; }, totalTime * 1000 + 50);

}



document.getElementById("btn-tx-send").addEventListener("click", () => {

  executeTransmission(parseInt(txIdInput.value, 10));

});



/* 受信モジュール (エネルギー積算型) */

let rxAudioCtx = null, analyser = null, rxStream = null;

let isListening = false, animFrameId = null;



const btnRxToggle = document.getElementById("btn-rx-toggle");

const rxStatus = document.getElementById("rx-status");

const rxLog = document.getElementById("rx-log");

const rxBadges = document.getElementById("rx-badges");



let rxState = "IDLE";

let triggerStartTime = 0;

let slotEnergy = []; // [slotIndex][channel]



btnRxToggle.addEventListener("click", async () => {

  if(isListening) stopListening();

  else await startListening();

});



async function startListening(){

  try{

    rxStream = await navigator.mediaDevices.getUserMedia({

      audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false, channelCount: 1 }

    });

    rxAudioCtx = new (window.AudioContext || window.webkitAudioContext)();

    analyser = rxAudioCtx.createAnalyser();

    analyser.fftSize = FFT_SIZE;

    analyser.smoothingTimeConstant = 0.0; // 積算を独自で行うため0に設定



    const source = rxAudioCtx.createMediaStreamSource(rxStream);

    source.connect(analyser);



    isListening = true;

    rxState = "IDLE";

    btnRxToggle.innerText = "マイク受信を停止";

    rxStatus.innerText = "トリガー待機中...";

    processRx();

  }catch(e){

    alert("マイクエラー: " + e.message);

  }

}



function stopListening(){

  isListening = false;

  if(animFrameId) cancelAnimationFrame(animFrameId);

  if(rxStream) rxStream.getTracks().forEach(t => t.stop());

  if(rxAudioCtx) rxAudioCtx.close();

  rxStatus.innerText = "停止中";

  btnRxToggle.innerText = "マイク受信を開始";

}



function getPeakDb(dataArray, freq, binWidth){

  const bin = Math.round(freq / binWidth);

  return Math.max(dataArray[bin-1], dataArray[bin], dataArray[bin+1]);

}



function processRx(){

  if(!isListening) return;



  const bufferLength = analyser.frequencyBinCount;

  const dataArray = new Float32Array(bufferLength);

  analyser.getFloatFrequencyData(dataArray);



  const binWidth = rxAudioCtx.sampleRate / analyser.fftSize;

  const now = performance.now();



  const slotMs = parseInt(inputSlot.value, 10);

  const trigSecMs = 120;

  const trigThreshold = parseFloat(inputTrigDb.value);

  const minDbThreshold = parseFloat(inputMinDb.value);



  const trigDb = getPeakDb(dataArray, TRIGGER_FREQ, binWidth);

  const guardDb = getPeakDb(dataArray, GUARD_FREQ, binWidth);



  if(rxState === "IDLE"){

    // トリガー検出: 単音かつガード周波数より12dB以上高い

    if(trigDb > trigThreshold && (trigDb - guardDb) > 12){

      triggerStartTime = now;

      rxState = "READ_DATA";

      // 3スロット分の積算バッファを初期化

      slotEnergy = [new Float32Array(NUM_CHANNELS), new Float32Array(NUM_CHANNELS), new Float32Array(NUM_CHANNELS)];

      rxStatus.innerText = "トリガー捕捉 -> データ積算中...";

    }

  } else if(rxState === "READ_DATA"){

    const elapsed = now - (triggerStartTime + trigSecMs);

    const slotIdx = Math.floor(elapsed / slotMs);



    if(slotIdx >= 0 && slotIdx < 3){

      // 過渡応答を外した中央70%で各チャンネルのパワーを積算

      const phase = elapsed - (slotIdx * slotMs);

      if(phase > slotMs * 0.15 && phase < slotMs * 0.85){

        for(let ch = 0; ch < NUM_CHANNELS; ch++){

          const db = getPeakDb(dataArray, FREQS[ch], binWidth);

          if(db > minDbThreshold){

            slotEnergy[slotIdx][ch] += Math.pow(10, db / 20);

          }

        }

      }

    } else if(slotIdx >= 3){

      // 3スロット受信完了 -> 解析

      decodePacket();

      rxState = "IDLE";

    }

  }



  drawSpectrum(dataArray, binWidth);

  animFrameId = requestAnimationFrame(processRx);

}



function decodePacket(){

  const resolvedSlots = [];



  for(let s = 0; s < 3; s++){

    const scores = Array.from(slotEnergy[s]).map((p, idx) => ({ idx, p }));

    scores.sort((a, b) => b.p - a.p);



    if(scores[2].p > 0.0001 && scores[0].p > scores[3].p * 1.4){

      const top3 = [scores[0].idx, scores[1].idx, scores[2].idx].sort((a, b) => a - b);

      const tripId = TRIPLET_MAP.get(`${top3[0]},${top3[1]},${top3[2]}`);

      resolvedSlots.push(tripId !== undefined ? tripId : null);

    } else {

      resolvedSlots.push(null);

    }

  }



  const [t1, t2, cd] = resolvedSlots;

  if(t1 !== null && t2 !== null && cd !== null){

    const expectedCd = calcCheckDigit(t1, t2);

    if(cd === expectedCd){

      const fullId = t1 * COMBINATIONS + t2;

      rxStatus.innerText = `受信成功: ID ${fullId}`;

      rxLog.innerText = `[成功] Full ID: ${fullId}\n  T1: ${t1}, T2: ${t2}, CD: ${cd} (照合PASS)`;

      rxBadges.innerHTML = `<div class="badge" style="background:#238636;color:#fff;">ID: <b>${fullId}</b> (完全一致)</div>`;

    } else {

      rxStatus.innerText = "チェックデジット不一致";

      rxLog.innerText = `[エラー] CD不一致: 受信 ${cd} != 期待 ${expectedCd}`;

      rxBadges.innerHTML = `<div class="badge" style="background:#da3633;color:#fff;">パリティエラー</div>`;

    }

  } else {

    rxStatus.innerText = "デコード失敗 (信号欠損)";

    rxLog.innerText = `[失敗] スロット認識結果: [${resolvedSlots.join(", ")}]`;

    rxBadges.innerHTML = `<div class="badge" style="background:#8b949e;color:#fff;">デコード失敗</div>`;

  }

}



const canvas = document.getElementById("spectrumCanvas");

const canvasCtx = canvas.getContext("2d");



function drawSpectrum(dataArray, binWidth){

  const w = canvas.width, h = canvas.height;

  canvasCtx.fillStyle = "#05070a";

  canvasCtx.fillRect(0, 0, w, h);



  const minF = 17300, maxF = 20000;

  const fToX = f => (f - minF) / (maxF - minF) * w;

  const dbToY = db => h - 20 - ((Math.max(-105, Math.min(-40, db)) + 105) / 65) * (h - 20);



  // チャンネルライン

  FREQS.forEach((f, idx) => {

    canvasCtx.strokeStyle = (idx % 5 === 0) ? "#30363d" : "#161b22";

    canvasCtx.beginPath();

    canvasCtx.moveTo(fToX(f), 0);

    canvasCtx.lineTo(fToX(f), h - 15);

    canvasCtx.stroke();

  });



  // 波形

  const startBin = Math.floor(minF / binWidth);

  const endBin = Math.ceil(maxF / binWidth);

  canvasCtx.strokeStyle = "#8505d5";

  canvasCtx.lineWidth = 1.5;

  canvasCtx.beginPath();

  for(let b = startBin; b <= endBin; b++){

    const x = fToX(b * binWidth);

    const y = dbToY(dataArray[b]);

    if(b === startBin) canvasCtx.moveTo(x, y); else canvasCtx.lineTo(x, y);

  }

  canvasCtx.stroke();

}

</script>

</body>

</html>
