const TRIGGER_FREQ=19500;
const PAIR_COUNT=DATA_COUNT*(DATA_COUNT-1)/2;
const ID_COUNT=PAIR_COUNT*PAIR_COUNT;
const MAX_ID=ID_COUNT-1;
const TRIGGER_DURATION=0.18;

const RAMP_TIME=0.008;

for(let i=0;i<DATA_COUNT;i++){
  for(let j=i+1;j<DATA_COUNT;j++){
    const index=PAIRS.length;
    PAIRS.push([i,j]);
    PAIR_INDEX.set(i+","+j,index);
  }
}

function idToPairs(id){
  if(!Number.isInteger(id))throw new Error("IDは整数で指定してください");
  if(id<0||id>MAX_ID)throw new Error("IDは0～"+MAX_ID+"です");
  const pair1Index=Math.floor(id/PAIR_COUNT);
  const pair2Index=id%PAIR_COUNT;
  const checksum=(pair1Index+pair2Index)%PAIR_COUNT;
  return{pair1Index,pair2Index,checksum,pair1:PAIRS[pair1Index],pair2:PAIRS[pair2Index],pair3:PAIRS[checksum]};
}

function pairsToId(pair1Index,pair2Index){
  return pair1Index*PAIR_COUNT+pair2Index;
}

function pairToFreqs(pair){
  return[FREQ_DATA[pair[0]],FREQ_DATA[pair[1]]];
}

let txCtx=null;
function initTx(){
  if(!txCtx)txCtx=new(window.AudioContext||window.webkitAudioContext)();
  if(txCtx.state==="suspended")txCtx.resume();
  return txCtx;
}
