<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ultrasonic ID Sender / Receiver (Triple-Tone 3-Slot Continuous)</title>
<style>
body{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;margin:20px;max-width:900px;background:#0b0d12;color:#fff}
h1{font-size:24px;margin-bottom:8px}
.box{background:#151923;border:1px solid #2a3040;border-radius:12px;padding:16px;margin:14px 0}
button{font-size:15px;font-weight:600;padding:10px 16px;margin:4px;cursor:pointer;border:0;border-radius:8px;background:#252b38;color:#fff}
button:hover{background:#303848}
input{font-size:18px;padding:8px 12px;width:360px;box-sizing:border-box;background:#0d1017;border:1px solid #2a3040;color:#77e3a2;border-radius:8px;font-family:monospace}
.value{font-size:28px;font-weight:bold;color:#77e3a2;word-break:break-all}
#status{white-space:pre-wrap;font-family:monospace;line-height:1.5;color:#c9d1e0;background:#080a0f;padding:12px;border-radius:8px;border:1px solid #1e2533;margin-top:8px}
.small{font-size:13px;line-height:1.6;color:#aeb6c6}
canvas{width:100%;height:180px;background:#090c11;border-radius:8px;border:1px solid #252b36;display:block;margin:10px 0}
#peakMonitor{font-family:monospace;background:#0d1017;padding:12px;border-radius:8px;border:1px solid #252b36;margin:10px 0;font-size:13px;line-height:1.5;white-space:pre-wrap;color:#79c0ff}
</style>
</head>
<body>
<h1>音響ID送受信 (無音なし連続Triple-Tone方式: 16C3^3)</h1>
<div class="box">
<h2>通信仕様</h2>
<div class="small">
<div>データ周波数: 17,500～19,450 Hz (130 Hz間隔 / 16チャンネル)</div>
<div>トリガー周波数: 19,850 Hz (19.85 kHz)</div>
<div>シンボル数: 16C3 = 560 通り (各スロット3波同時送出)</div>
<div>スロット構成: トリガー + Slot1 + Slot2 + Slot3 + Checksum (各130ms)</div>
<div>ID総数: (16C3)^3 = 560^3 = <span id="idCountText">-</span></div>
</div>
</div>

<div class="box">
<h2>送信</h2>
<input id="sendId" type="number" min="0" value="0">
<br><br>
<button id="sendButton">ID送信</button>
<button id="sendRandom">ランダムID送信</button>
<div style="margin-top:10px;">送信ID: <span id="sentId" class="value">-</span></div>
<div id="sendInfo" class="small"></div>
</div>

<div class="box">
<h2>受信</h2>
<button id="startReceiver">マイク受信開始</button>
<button id="stopReceiver">停止</button>
<div style="margin-top:10px;">受信ID: <span id="receivedId" class="value">-</span></div>
<canvas id="specCanvas" width="800" height="180"></canvas>
<div id="peakMonitor">ピーク解析: 停止中</div>
<div id="status">停止中</div>
</div>

<script>
"use strict";

// CONFIGURATION
const BASE_FREQ = 17500;
const STEP_FREQ = 130;
const NUM_CHANNELS = 16;
const FREQS = Array.from({ length: NUM_CHANNELS }, (_, i) => BASE_FREQ + i * STEP_FREQ); // 17,500Hz 〜 19,450Hz
const TRIGGER_FREQ = 19850;

const TRIGGER_DURATION = 0.130;
const SLOT_DURATION = 0.130;
const RAMP_TIME = 0.005;
const TX_GAIN = 0.08;           // 3波合成のためクリッピング防止に各波ゲインを抑制

const FFT_SIZE = 4096;          // 48kHz時: 分解能約11.7Hz / 窓幅約85.3ms
const TRIGGER_MIN_DB = -95;
const TRIGGER_CONFIRM_FRAMES = 2;
const DATA_MIN_DB = -95;

// 16C3 = 560 通りのトリプレットテーブル生成
const TRIPLETS = [];
const TRIPLET_INDEX = new Map();
for (let i = 0; i < NUM_CHANNELS; i++) {
  for (let j = i + 1; j < NUM_CHANNELS; j++) {
    for (let k = j + 1; k < NUM_CHANNELS; k++) {
      const idx = TRIPLETS.length;
      TRIPLETS.push([i, j, k]);
      TRIPLET_INDEX.set(`${i},${j},${k}`, idx);
    }
  }
}

const SYMBOL_COUNT = TRIPLETS.length; // 560
const ID_COUNT = SYMBOL_COUNT * SYMBOL_COUNT * SYMBOL_COUNT; // 560^3 = 175,616,000
const MAX_ID = ID_COUNT - 1;

document.getElementById("sendId").max = MAX_ID;
document.getElementById("idCountText").textContent = `${ID_COUNT.toLocaleString()} 通り (0 ～ ${MAX_ID.toLocaleString()})`;

function idToSlots(id) {
  if (!Number.isInteger(id)) throw new Error("IDは整数で指定してください");
  if (id < 0 || id > MAX_ID) throw new Error("IDは0～" + MAX_ID + "です");

  const s1 = Math.floor(id / (SYMBOL_COUNT * SYMBOL_COUNT));
  const rem = id % (SYMBOL_COUNT * SYMBOL_COUNT);
  const s2 = Math.floor(rem / SYMBOL_COUNT);
  const s3 = rem % SYMBOL_COUNT;
  const checksum = (s1 + s2 * 2 + s3 * 3) % SYMBOL_COUNT;

  return {
    s1, s2, s3, checksum,
    trip1: TRIPLETS[s1],
    trip2: TRIPLETS[s2],
    trip3: TRIPLETS[s3],
    tripCheck: TRIPLETS[checksum]
  };
}

function slotsToId(s1, s2, s3) {
  return s1 * SYMBOL_COUNT * SYMBOL_COUNT + s2 * SYMBOL_COUNT + s3;
}

// TRANSMITTER
let txCtx = null;
function initTx() {
  if (!txCtx) txCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (txCtx.state === "suspended") txCtx.resume();
  return txCtx;
}

async function sendId(id) {
  const ctx = initTx();
  const decoded = idToSlots(id);
  const slotTriplets = [decoded.trip1, decoded.trip2, decoded.trip3, decoded.tripCheck];

  const oscA = ctx.createOscillator();
  const oscB = ctx.createOscillator();
  const oscC = ctx.createOscillator();
  const gainA = ctx.createGain();
  const gainB = ctx.createGain();
  const gainC = ctx.createGain();

  oscA.type = "sine";
  oscB.type = "sine";
  oscC.type = "sine";

  oscA.connect(gainA).connect(ctx.destination);
  oscB.connect(gainB).connect(ctx.destination);
  oscC.connect(gainC).connect(ctx.destination);

  const now = ctx.currentTime + 0.05;

  // 1. TRIGGER (単音同期: 19.85 kHz)
  gainA.gain.setValueAtTime(0, now);
  gainB.gain.setValueAtTime(0, now);
  gainC.gain.setValueAtTime(0, now);

  oscA.frequency.setValueAtTime(TRIGGER_FREQ, now);
  oscB.frequency.setValueAtTime(TRIGGER_FREQ, now);
  oscC.frequency.setValueAtTime(TRIGGER_FREQ, now);

  gainA.gain.linearRampToValueAtTime(TX_GAIN * 1.8, now + RAMP_TIME);
  gainA.gain.setValueAtTime(TX_GAIN * 1.8, now + TRIGGER_DURATION);

  // 2. DATA 1 -> DATA 2 -> DATA 3 -> CHECKSUM (3波連続遷移)
  let t = now + TRIGGER_DURATION;
  for (let s = 0; s < slotTriplets.length; s++) {
    const trip = slotTriplets[s];
    const f1 = FREQS[trip[0]];
    const f2 = FREQS[trip[1]];
    const f3 = FREQS[trip[2]];

    oscA.frequency.setValueAtTime(f1, t);
    oscB.frequency.setValueAtTime(f2, t);
    oscC.frequency.setValueAtTime(f3, t);

    gainA.gain.setValueAtTime(TX_GAIN, t);
    gainB.gain.setValueAtTime(TX_GAIN, t);
    gainC.gain.setValueAtTime(TX_GAIN, t);

    t += SLOT_DURATION;
  }

  // 終了時ランプ
  gainA.gain.setValueAtTime(TX_GAIN, t - RAMP_TIME);
  gainB.gain.setValueAtTime(TX_GAIN, t - RAMP_TIME);
  gainC.gain.setValueAtTime(TX_GAIN, t - RAMP_TIME);

  gainA.gain.linearRampToValueAtTime(0, t);
  gainB.gain.linearRampToValueAtTime(0, t);
  gainC.gain.linearRampToValueAtTime(0, t);

  oscA.start(now);
  oscB.start(now);
  oscC.start(now);
  oscA.stop(t + 0.02);
  oscB.stop(t + 0.02);
  oscC.stop(t + 0.02);

  document.getElementById("sentId").textContent = id.toLocaleString();
  document.getElementById("sendInfo").textContent =
    `D1: [${FREQS[decoded.trip1[0]]}, ${FREQS[decoded.trip1[1]]}, ${FREQS[decoded.trip1[2]]} Hz], ` +
    `D2: [${FREQS[decoded.trip2[0]]}, ${FREQS[decoded.trip2[1]]}, ${FREQS[decoded.trip2[2]]} Hz], ` +
    `D3: [${FREQS[decoded.trip3[0]]}, ${FREQS[decoded.trip3[1]]}, ${FREQS[decoded.trip3[2]]} Hz], ` +
    `Check: [${FREQS[decoded.tripCheck[0]]}, ${FREQS[decoded.tripCheck[1]]}, ${FREQS[decoded.tripCheck[2]]} Hz]`;
}

// RECEIVER
let rxCtx = null;
let rxStream = null;
let rxSource = null;
let analyser = null;
let rxRunning = false;
let rxState = "WAIT_TRIGGER";
let triggerConfirmCount = 0;
let dataStartAt = 0;
let rxSlots = [];
let currentSlotIndex = -1;
let currentSlotVotes = [];
let spectrum = null;

const canvas = document.getElementById("specCanvas");
const canvasCtx = canvas.getContext("2d");
const peakMonitor = document.getElementById("peakMonitor");

function setStatus(text) {
  document.getElementById("status").textContent = text;
}

async function startReceiver() {
  if (rxRunning) return;
  try {
    rxStream = await navigator.mediaDevices.getUserMedia({
      audio: {
        echoCancellation: false,
        noiseSuppression: false,
        autoGainControl: false,
        channelCount: 1
      }
    });

    rxCtx = new (window.AudioContext || window.webkitAudioContext)();
    await rxCtx.resume();

    rxSource = rxCtx.createMediaStreamSource(rxStream);
    analyser = rxCtx.createAnalyser();
    analyser.fftSize = FFT_SIZE;
    analyser.smoothingTimeConstant = 0.0;

    rxSource.connect(analyser);
    spectrum = new Float32Array(analyser.frequencyBinCount);

    rxRunning = true;
    resetReceiverState();
    setStatus(`受信待機中...\nSampleRate: ${rxCtx.sampleRate} Hz | FFT: ${FFT_SIZE} | Bin: ${(rxCtx.sampleRate / FFT_SIZE).toFixed(2)} Hz`);
    requestAnimationFrame(receiverLoop);
  } catch (err) {
    setStatus("マイク開始失敗\n" + err.message);
  }
}

function stopReceiver() {
  rxRunning = false;
  if (rxStream) {
    rxStream.getTracks().forEach(t => t.stop());
    rxStream = null;
  }
  if (rxCtx) {
    rxCtx.close();
    rxCtx = null;
  }
  peakMonitor.textContent = "ピーク解析: 停止中";
  canvasCtx.clearRect(0, 0, canvas.width, canvas.height);
  setStatus("停止中");
}

function getLocalPeakAround(freq) {
  const bin = Math.round(freq * FFT_SIZE / rxCtx.sampleRate);
  let bestBin = bin;
  let bestDb = -Infinity;
  for (let d = -1; d <= 1; d++) {
    const cur = bin + d;
    if (cur >= 0 && cur < spectrum.length && spectrum[cur] > bestDb) {
      bestDb = spectrum[cur];
      bestBin = cur;
    }
  }
  return { freq: bestBin * rxCtx.sampleRate / FFT_SIZE, db: bestDb };
}

function detectTrigger() {
  const triggerPeak = getLocalPeakAround(TRIGGER_FREQ);
  let maxData = -Infinity;
  for (let i = 0; i < NUM_CHANNELS; i += 2) {
    const p = getLocalPeakAround(FREQS[i]);
    if (p.db > maxData) maxData = p.db;
  }
  if (triggerPeak.db < TRIGGER_MIN_DB) return false;
  if (triggerPeak.db < maxData + 6) return false;
  return true;
}

// 3波ピーク検出
function detectSlotTriplet() {
  const cands = [];
  for (let i = 0; i < NUM_CHANNELS; i++) {
    const p = getLocalPeakAround(FREQS[i]);
    if (p.db >= DATA_MIN_DB) {
      cands.push({ index: i, freq: FREQS[i], db: p.db });
    }
  }

  cands.sort((a, b) => b.db - a.db);
  if (cands.length < 3) return null;

  // 上位候補から隣接干渉のない3波を選択
  const selected = [];
  for (const cand of cands) {
    const conflict = selected.some(s => Math.abs(s.index - cand.index) < 1);
    if (!conflict) {
      selected.push(cand);
      if (selected.length === 3) break;
    }
  }
  if (selected.length < 3) return null;

  // 最強波と最弱波の差が20dBを超えている場合はノイズとみなす
  if (selected[0].db - selected[2].db > 20) return null;

  const idxs = selected.map(s => s.index).sort((a, b) => a - b);
  const tripletKey = `${idxs[0]},${idxs[1]},${idxs[2]}`;
  const tripletIndex = TRIPLET_INDEX.get(tripletKey);
  if (tripletIndex === undefined) return null;

  return {
    tripletIndex,
    f1: FREQS[idxs[0]],
    f2: FREQS[idxs[1]],
    f3: FREQS[idxs[2]]
  };
}

function drawSpectrum() {
  const w = canvas.width;
  const h = canvas.height;
  canvasCtx.fillStyle = "#090c11";
  canvasCtx.fillRect(0, 0, w, h);

  const minF = 17000;
  const maxF = 20200;
  const minDb = -100;
  const maxDb = -30;

  const fToX = f => (f - minF) / (maxF - minF) * w;
  const dbToY = db => h - (db - minDb) / (maxDb - minDb) * h;

  const startBin = Math.floor(minF * FFT_SIZE / rxCtx.sampleRate);
  const endBin = Math.ceil(maxF * FFT_SIZE / rxCtx.sampleRate);

  canvasCtx.strokeStyle = "#00e5ff";
  canvasCtx.lineWidth = 1.5;
  canvasCtx.beginPath();
  for (let b = startBin; b <= endBin; b++) {
    const freq = b * rxCtx.sampleRate / FFT_SIZE;
    const x = fToX(freq);
    const db = Math.max(minDb, Math.min(maxDb, spectrum[b]));
    const y = dbToY(db);
    if (b === startBin) canvasCtx.moveTo(x, y);
    else canvasCtx.lineTo(x, y);
  }
  canvasCtx.stroke();

  // トリガーライン (19.85 kHz)
  canvasCtx.strokeStyle = "#ffcc00";
  canvasCtx.beginPath();
  canvasCtx.moveTo(fToX(TRIGGER_FREQ), 0);
  canvasCtx.lineTo(fToX(TRIGGER_FREQ), h);
  canvasCtx.stroke();
}

function resetReceiverState() {
  rxState = "WAIT_TRIGGER";
  triggerConfirmCount = 0;
  dataStartAt = 0;
  rxSlots = [];
  currentSlotIndex = -1;
  currentSlotVotes = [];
}

function processReceivedSlots() {
  if (rxSlots.length !== 4 || rxSlots.includes(-1)) {
    setStatus(`スロット欠損のため復号不可\n検出結果: [${rxSlots.join(", ")}]\nトリガー待機に戻ります`);
    resetReceiverState();
    return;
  }

  const [s1, s2, s3, checksum] = rxSlots;
  const expectedChecksum = (s1 + s2 * 2 + s3 * 3) % SYMBOL_COUNT;

  if (checksum !== expectedChecksum) {
    setStatus(`チェックデジット不一致\nS1:${s1}, S2:${s2}, S3:${s3}\n受信Check:${checksum} (期待値:${expectedChecksum})\nトリガー待機に戻ります`);
  } else {
    const id = slotsToId(s1, s2, s3);
    document.getElementById("receivedId").textContent = id.toLocaleString();
    setStatus(`受信成功！\nS1:${s1}, S2:${s2}, S3:${s3}\nCheck:${checksum}\n復号ID: ${id.toLocaleString()}\nトリガー待機中...`);
  }
  resetReceiverState();
}

function receiverLoop() {
  if (!rxRunning) return;
  analyser.getFloatFrequencyData(spectrum);
  const now = performance.now() / 1000;

  drawSpectrum();

  if (rxState === "WAIT_TRIGGER") {
    if (detectTrigger()) {
      triggerConfirmCount++;
    } else {
      triggerConfirmCount = 0;
    }

    if (triggerConfirmCount >= TRIGGER_CONFIRM_FRAMES) {
      dataStartAt = now + (TRIGGER_DURATION - 0.035);
      rxState = "READ_DATA";
      triggerConfirmCount = 0;
      currentSlotIndex = -1;
      rxSlots = [];
      setStatus("トリガー同期検知！ データ受信中 (連続4スロット)...");
    }
  } else if (rxState === "READ_DATA") {
    const elapsed = now - dataStartAt;
    const slotIdx = Math.floor(elapsed / SLOT_DURATION);

    if (slotIdx !== currentSlotIndex && currentSlotIndex >= 0 && currentSlotIndex < 4) {
      let best = -1;
      if (currentSlotVotes.length > 0) {
        const counts = {};
        currentSlotVotes.forEach(v => counts[v] = (counts[v] || 0) + 1);
        let maxC = 0;
        for (const k in counts) {
          if (counts[k] > maxC) {
            maxC = counts[k];
            best = Number(k);
          }
        }
      }
      rxSlots.push(best);
      currentSlotVotes = [];
    }
    currentSlotIndex = slotIdx;

    if (slotIdx >= 0 && slotIdx < 4) {
      const phase = elapsed - slotIdx * SLOT_DURATION;
      if (phase >= SLOT_DURATION * 0.35 && phase <= SLOT_DURATION * 0.85) {
        const detected = detectSlotTriplet();
        if (detected) {
          currentSlotVotes.push(detected.tripletIndex);
          peakMonitor.textContent = `[Slot ${slotIdx + 1}/4 検出中] ${detected.f1} + ${detected.f2} + ${detected.f3} Hz (Index: ${detected.tripletIndex})`;
        }
      }
    } else if (slotIdx >= 4) {
      processReceivedSlots();
    }

    if (elapsed > SLOT_DURATION * 5.5) {
      setStatus("受信タイムアウト\nトリガー待機に戻ります");
      resetReceiverState();
    }
  }

  requestAnimationFrame(receiverLoop);
}

// EVENT HANDLERS
document.getElementById("sendButton").addEventListener("click", async () => {
  const id = Number(document.getElementById("sendId").value);
  if (!Number.isInteger(id) || id < 0 || id > MAX_ID) {
    alert("IDは0～" + MAX_ID + "の範囲で指定してください");
    return;
  }
  await sendId(id);
});

document.getElementById("sendRandom").addEventListener("click", async () => {
  const id = Math.floor(Math.random() * ID_COUNT);
  document.getElementById("sendId").value = id;
  await sendId(id);
});

document.getElementById("startReceiver").addEventListener("click", startReceiver);
document.getElementById("stopReceiver").addEventListener("click", stopReceiver);
</script>
</body>
</html>
