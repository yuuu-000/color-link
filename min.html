<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Acoustic ID Debugger (周波数完全ログ)</title>
<style>
body{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;margin:16px;max-width:960px;background:#06070a;color:#eee}
h1{font-size:20px;margin-bottom:8px;color:#fff}
.box{background:#11131a;border:1px solid #232733;border-radius:12px;padding:14px;margin:12px 0}
button{font-size:14px;font-weight:700;padding:8px 16px;margin:3px;cursor:pointer;border:0;border-radius:8px;background:#202532;color:#fff}
button:hover{background:#2d3446}
input{font-size:18px;padding:6px 10px;width:340px;background:#090a0f;border:1px solid #282f40;color:#00f0ff;border-radius:8px;font-family:monospace}
.value{font-size:26px;font-weight:900;color:#00f0ff;word-break:break-all}
#status{white-space:pre-wrap;font-family:monospace;line-height:1.4;color:#abb4c4;background:#050608;padding:10px;border-radius:8px;border:1px solid #1a1e28;margin-top:8px;font-size:12px}
canvas{width:100%;height:140px;background:#07090d;border-radius:8px;border:1px solid #1f2430;display:block;margin:8px 0}
#logTable{width:100%;border-collapse:collapse;font-family:monospace;font-size:12px;margin-top:8px}
#logTable th,#logTable td{border:1px solid #232733;padding:6px 8px;text-align:left}
#logTable th{background:#161922;color:#79c0ff}
.ok{color:#77e3a2;font-weight:bold}
.ng{color:#ff7b72;font-weight:bold}
.diff{color:#e3b341}
</style>
</head>
<body>
<h1>OTOSYN Debugger <span style="font-size:12px;background:#00b4d8;color:#000;padding:2px 6px;border-radius:4px">詳細周波数ログ出力</span></h1>

<div class="box">
  <input id="sendId" type="number" min="0" value="12345678">
  <button id="sendButton">ID送信</button>
  <button id="sendRandom">ランダム送信</button>
  <button id="startReceiver">マイク受信開始</button>
  <button id="stopReceiver">停止</button>
  <div style="margin-top:8px">送信ID: <span id="sentId" class="value">-</span> | 受信ID: <span id="receivedId" class="value">-</span></div>
  <canvas id="specCanvas" width="900" height="140"></canvas>
  <div id="status">停止中</div>
</div>

<div class="box">
  <h3 style="margin:0 0 6px 0;font-size:14px;color:#79c0ff">スロット別 送信 vs 受信 周波数対照ログ</h3>
  <table id="logTable">
    <thead>
      <tr>
        <th>スロット</th>
        <th>送信 周波数 (Hz)</th>
        <th>受信 認識周波数 (Hz)</th>
        <th>送信Triplet</th>
        <th>受信Triplet</th>
        <th>判定</th>
      </tr>
    </thead>
    <tbody id="logBody">
      <tr><td colspan="6" style="color:#666">データ未受信</td></tr>
    </tbody>
  </table>
</div>

<script>
"use strict";

const BASE_FREQ = 17400;
const STEP_FREQ = 160;
const NUM_CHANNELS = 16;
const FREQS = Array.from({ length: NUM_CHANNELS }, (_, i) => BASE_FREQ + i * STEP_FREQ);
const TRIGGER_FREQ = 19950;
const GUARD_FREQ = 19600;

const TRIGGER_DURATION = 0.140;
const SLOT_DURATION = 0.120; // 10ms拡大して安定化
const RAMP_TIME = 0.008;
const TX_GAIN = 0.08;
const FFT_SIZE = 2048;

const TRIPLETS = [];
const TRIPLET_MAP = new Map();
for (let i = 0; i < NUM_CHANNELS; i++) {
  for (let j = i + 1; j < NUM_CHANNELS; j++) {
    for (let k = j + 1; k < NUM_CHANNELS; k++) {
      const idx = TRIPLETS.length;
      TRIPLETS.push([i, j, k]);
      TRIPLET_MAP.set(`${i},${j},${k}`, idx);
    }
  }
}
const SYMBOL_COUNT = TRIPLETS.length; // 560
const TOTAL_IDS = SYMBOL_COUNT ** 3; // 175,616,000

const COEFF_1 = 1, COEFF_2 = 3, COEFF_3 = 9;
function modInverse(a, m) {
  let [m0, x0, x1] = [m, 0, 1];
  let val = (a % m + m) % m;
  while (val > 1) {
    const q = Math.floor(val / m0);
    [val, m0] = [m0, val % m0];
    [x0, x1] = [x1 - q * x0, x0];
  }
  return (x1 < 0) ? x1 + m : x1;
}
const INV_C1 = modInverse(COEFF_1, SYMBOL_COUNT);
const INV_C2 = modInverse(COEFF_2, SYMBOL_COUNT);
const INV_C3 = modInverse(COEFF_3, SYMBOL_COUNT);

function idToSlots(id) {
  const s1 = Math.floor(id / (SYMBOL_COUNT * SYMBOL_COUNT));
  const rem = id % (SYMBOL_COUNT * SYMBOL_COUNT);
  const s2 = Math.floor(rem / SYMBOL_COUNT);
  const s3 = rem % SYMBOL_COUNT;
  const check = (s1 * COEFF_1 + s2 * COEFF_2 + s3 * COEFF_3) % SYMBOL_COUNT;
  return { s1, s2, s3, check };
}

function slotsToId(s1, s2, s3) {
  return s1 * SYMBOL_COUNT * SYMBOL_COUNT + s2 * SYMBOL_COUNT + s3;
}

// 直近の送信データを保持するデバッグ用変数
let lastSentDetails = null;

let txCtx = null;
function initTx() {
  if (!txCtx) txCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (txCtx.state === "suspended") txCtx.resume();
  return txCtx;
}

async function sendId(id) {
  const ctx = initTx();
  const { s1, s2, s3, check } = idToSlots(id);
  const slotIndices = [s1, s2, s3, check];

  lastSentDetails = slotIndices.map((sym, idx) => ({
    name: idx === 3 ? "Check" : `Slot ${idx + 1}`,
    sym,
    trip: TRIPLETS[sym],
    freqs: TRIPLETS[sym].map(ch => FREQS[ch])
  }));

  const oscA = ctx.createOscillator();
  const oscB = ctx.createOscillator();
  const oscC = ctx.createOscillator();
  const gain = ctx.createGain();

  oscA.connect(gain); oscB.connect(gain); oscC.connect(gain);
  gain.connect(ctx.destination);

  const now = ctx.currentTime + 0.04;

  gain.gain.setValueAtTime(0, now);
  oscA.frequency.setValueAtTime(TRIGGER_FREQ, now);
  oscB.frequency.setValueAtTime(TRIGGER_FREQ, now);
  oscC.frequency.setValueAtTime(TRIGGER_FREQ, now);
  gain.gain.linearRampToValueAtTime(TX_GAIN * 1.5, now + RAMP_TIME);
  gain.gain.setValueAtTime(TX_GAIN * 1.5, now + TRIGGER_DURATION);

  let t = now + TRIGGER_DURATION;
  for (let s = 0; s < 4; s++) {
    const trip = TRIPLETS[slotIndices[s]];
    oscA.frequency.setValueAtTime(FREQS[trip[0]], t);
    oscB.frequency.setValueAtTime(FREQS[trip[1]], t);
    oscC.frequency.setValueAtTime(FREQS[trip[2]], t);
    gain.gain.setValueAtTime(TX_GAIN, t);
    t += SLOT_DURATION;
  }

  gain.gain.setValueAtTime(TX_GAIN, t - RAMP_TIME);
  gain.gain.linearRampToValueAtTime(0, t);

  oscA.start(now); oscB.start(now); oscC.start(now);
  oscA.stop(t + 0.05); oscB.stop(t + 0.05); oscC.stop(t + 0.05);

  document.getElementById("sentId").textContent = id.toLocaleString();
}

let rxCtx = null, rxStream = null, analyser = null, spectrum = null;
let rxRunning = false, rxState = "WAIT_TRIGGER", triggerHeardFrames = 0;
let dataStartTime = 0, slotEnergyBuffers = [];
const canvas = document.getElementById("specCanvas"), canvasCtx = canvas.getContext("2d");

function setStatus(t) { document.getElementById("status").textContent = t; }

async function startReceiver() {
  if (rxRunning) return;
  try {
    rxStream = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false }
    });
    rxCtx = new (window.AudioContext || window.webkitAudioContext)();
    const source = rxCtx.createMediaStreamSource(rxStream);
    analyser = rxCtx.createAnalyser();
    analyser.fftSize = FFT_SIZE;
    analyser.smoothingTimeConstant = 0.0;
    source.connect(analyser);
    spectrum = new Float32Array(analyser.frequencyBinCount);

    rxRunning = true;
    rxState = "WAIT_TRIGGER";
    triggerHeardFrames = 0;
    setStatus(`リスニング中... (サンプリングレート: ${rxCtx.sampleRate} Hz)`);
    requestAnimationFrame(receiverLoop);
  } catch (err) {
    setStatus("マイク初期化失敗: " + err.message);
  }
}

function stopReceiver() {
  rxRunning = false;
  if (rxStream) rxStream.getTracks().forEach(t => t.stop());
  if (rxCtx) rxCtx.close();
  setStatus("停止中");
}

function getMagAt(freq) {
  const nyquist = rxCtx.sampleRate / 2;
  const bin = Math.round((freq / nyquist) * analyser.frequencyBinCount);
  let maxVal = -Infinity;
  for (let d = -1; d <= 1; d++) {
    const cur = bin + d;
    if (cur >= 0 && cur < spectrum.length && spectrum[cur] > maxVal) {
      maxVal = spectrum[cur];
    }
  }
  return maxVal;
}

// 隣接サイドローブ除去付きの3波選択アルゴリズム
function extractTop3Channels(energyArray) {
  const list = Array.from(energyArray).map((p, ch) => ({ ch, freq: FREQS[ch], p }));
  list.sort((a, b) => b.p - a.p);

  const selected = [];
  for (const item of list) {
    if (item.p <= 0.00005) continue;
    // すでに選ばれたチャンネルの直隣（±1ch）はサイドローブ漏れとしてスキップ
    const isSideLobe = selected.some(s => Math.abs(s.ch - item.ch) <= 1);
    if (!isSideLobe) {
      selected.push(item);
      if (selected.length === 3) break;
    }
  }
  return selected;
}

function solveErasure(slots) {
  const [s1, s2, s3, c] = slots;
  const missing = [];
  if (s1 === -1) missing.push(1);
  if (s2 === -1) missing.push(2);
  if (s3 === -1) missing.push(3);
  if (c === -1) missing.push(4);

  if (missing.length === 0) {
    const expected = (s1 * COEFF_1 + s2 * COEFF_2 + s3 * COEFF_3) % SYMBOL_COUNT;
    return (expected === c) ? { s1, s2, s3, recovered: false } : null;
  }
  if (missing.length === 1) {
    const target = missing[0];
    if (target === 4) return { s1, s2, s3, recovered: true, slot: "Check" };
    if (target === 1) {
      let rhs = (c - s2 * COEFF_2 - s3 * COEFF_3) % SYMBOL_COUNT;
      return { s1: (((rhs + SYMBOL_COUNT) % SYMBOL_COUNT) * INV_C1) % SYMBOL_COUNT, s2, s3, recovered: true, slot: "S1" };
    }
    if (target === 2) {
      let rhs = (c - s1 * COEFF_1 - s3 * COEFF_3) % SYMBOL_COUNT;
      return { s1, s2: (((rhs + SYMBOL_COUNT) % SYMBOL_COUNT) * INV_C2) % SYMBOL_COUNT, s3, recovered: true, slot: "S2" };
    }
    if (target === 3) {
      let rhs = (c - s1 * COEFF_1 - s2 * COEFF_2) % SYMBOL_COUNT;
      return { s1, s2, s3: (((rhs + SYMBOL_COUNT) % SYMBOL_COUNT) * INV_C3) % SYMBOL_COUNT, recovered: true, slot: "S3" };
    }
  }
  return null;
}

function receiverLoop() {
  if (!rxRunning) return;
  analyser.getFloatFrequencyData(spectrum);
  const now = performance.now() / 1000;
  drawSpectrum();

  const trigDb = getMagAt(TRIGGER_FREQ);
  const guardDb = getMagAt(GUARD_FREQ);

  if (rxState === "WAIT_TRIGGER") {
    if (trigDb > -88 && (trigDb - guardDb) > 10) {
      triggerHeardFrames++;
      setStatus(`トリガー捕捉中... (${triggerHeardFrames}フレーム)`);
    } else if (triggerHeardFrames >= 2) {
      rxState = "READING";
      triggerHeardFrames = 0;
      dataStartTime = now;
      slotEnergyBuffers = Array.from({ length: 4 }, () => new Float32Array(NUM_CHANNELS));
      setStatus("トリガー立ち下がり同期！ 4スロット積算中...");
    } else {
      triggerHeardFrames = 0;
    }
  } else if (rxState === "READING") {
    const elapsed = now - dataStartTime;
    const slotIdx = Math.floor(elapsed / SLOT_DURATION);

    if (slotIdx >= 0 && slotIdx < 4) {
      const slotPhase = elapsed - slotIdx * SLOT_DURATION;
      // スロット中央20%〜85%を積分
      if (slotPhase > (SLOT_DURATION * 0.20) && slotPhase < (SLOT_DURATION * 0.85)) {
        for (let ch = 0; ch < NUM_CHANNELS; ch++) {
          const db = getMagAt(FREQS[ch]);
          if (db > -95) {
            slotEnergyBuffers[slotIdx][ch] += Math.pow(10, db / 20);
          }
        }
      }
    } else if (slotIdx >= 4) {
      // 復号 ＆ 詳細ログ出力
      const resolvedSlots = [];
      const rxLogDetails = [];

      for (let s = 0; s < 4; s++) {
        const top3 = extractTop3Channels(slotEnergyBuffers[s]);
        if (top3.length === 3) {
          top3.sort((a, b) => a.ch - b.ch);
          const key = `${top3[0].ch},${top3[1].ch},${top3[2].ch}`;
          const tripIdx = TRIPLET_MAP.get(key);
          resolvedSlots.push(tripIdx !== undefined ? tripIdx : -1);
          rxLogDetails.push({
            sym: tripIdx !== undefined ? tripIdx : -1,
            trip: [top3[0].ch, top3[1].ch, top3[2].ch],
            freqs: top3.map(t => t.freq)
          });
        } else {
          resolvedSlots.push(-1);
          rxLogDetails.push({ sym: -1, trip: [], freqs: [] });
        }
      }

      renderComparisonLog(lastSentDetails, rxLogDetails, resolvedSlots);

      const result = solveErasure(resolvedSlots);
      if (result) {
        const finalId = slotsToId(result.s1, result.s2, result.s3);
        document.getElementById("receivedId").textContent = finalId.toLocaleString();
        const tag = result.recovered ? ` [消失スロット ${result.slot} を自動復元]` : " [完全一致]";
        setStatus(`受信成功: ID ${finalId.toLocaleString()}${tag}`);
      } else {
        setStatus(`復号失敗: スロット欠損過多または不整合 [${resolvedSlots.join(", ")}]`);
      }

      rxState = "WAIT_TRIGGER";
    }
  }

  requestAnimationFrame(receiverLoop);
}

function renderComparisonLog(txDetails, rxDetails, resolvedSlots) {
  const tbody = document.getElementById("logBody");
  tbody.innerHTML = "";

  for (let s = 0; s < 4; s++) {
    const tr = document.createElement("tr");
    const tx = txDetails ? txDetails[s] : null;
    const rx = rxDetails[s];

    const slotName = s === 3 ? "Check" : `Slot ${s + 1}`;
    const txFreqStr = tx ? tx.freqs.join(", ") : "-";
    const rxFreqStr = rx.freqs.length ? rx.freqs.join(", ") : "<span class='ng'>検出なし (-1)</span>";
    const txTripStr = tx ? `[${tx.trip.join(",")}] (#${tx.sym})` : "-";
    const rxTripStr = rx.trip.length ? `[${rx.trip.join(",")}] (#${rx.sym})` : "-";

    const isMatch = tx && rx.sym === tx.sym;
    const isRecovered = !isMatch && resolvedSlots[s] === -1;
    let statusBadge = "<span class='ng'>NG (不一致)</span>";
    if (isMatch) statusBadge = "<span class='ok'>MATCH (完全一致)</span>";
    else if (isRecovered) statusBadge = "<span class='diff'>ERASURE (欠損/復元対象)</span>";

    tr.innerHTML = `
      <td><b>${slotName}</b></td>
      <td>${txFreqStr}</td>
      <td>${rxFreqStr}</td>
      <td>${txTripStr}</td>
      <td>${rxTripStr}</td>
      <td>${statusBadge}</td>
    `;
    tbody.appendChild(tr);
  }
}

function drawSpectrum() {
  const w = canvas.width, h = canvas.height;
  canvasCtx.fillStyle = "#07090d";
  canvasCtx.fillRect(0, 0, w, h);

  const minF = 17200, maxF = 20200;
  const fToX = f => (f - minF) / (maxF - minF) * w;
  const startBin = Math.floor(minF * FFT_SIZE / rxCtx.sampleRate);
  const endBin = Math.ceil(maxF * FFT_SIZE / rxCtx.sampleRate);

  canvasCtx.strokeStyle = "#00b4d8";
  canvasCtx.lineWidth = 1.5;
  canvasCtx.beginPath();
  for (let b = startBin; b <= endBin; b++) {
    const f = b * rxCtx.sampleRate / FFT_SIZE;
    const x = fToX(f);
    const y = h - ((spectrum[b] + 105) / 65) * h;
    if (b === startBin) canvasCtx.moveTo(x, y); else canvasCtx.lineTo(x, y);
  }
  canvasCtx.stroke();

  // データ周波数ライン
  canvasCtx.strokeStyle = "#1f3b4d";
  canvasCtx.setLineDash([2, 4]);
  for (let i = 0; i < NUM_CHANNELS; i++) {
    const x = fToX(FREQS[i]);
    canvasCtx.beginPath();
    canvasCtx.moveTo(x, 0); canvasCtx.lineTo(x, h);
    canvasCtx.stroke();
  }

  // トリガーライン
  canvasCtx.setLineDash([]);
  canvasCtx.strokeStyle = "#ffb703";
  canvasCtx.lineWidth = 2;
  canvasCtx.beginPath();
  canvasCtx.moveTo(fToX(TRIGGER_FREQ), 0);
  canvasCtx.lineTo(fToX(TRIGGER_FREQ), h);
  canvasCtx.stroke();
}

document.getElementById("sendButton").onclick = () => {
  const id = Number(document.getElementById("sendId").value);
  if (id >= 0 && id < TOTAL_IDS) sendId(id);
};
document.getElementById("sendRandom").onclick = () => {
  const id = Math.floor(Math.random() * TOTAL_IDS);
  document.getElementById("sendId").value = id;
  sendId(id);
};
document.getElementById("startReceiver").onclick = startReceiver;
document.getElementById("stopReceiver").onclick = stopReceiver;
</script>
</body>
</html>
