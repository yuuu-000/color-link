<!doctype html>
<html lang="ja">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Ultrasonic Color Demo with Live Presets</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0b0d12;
      color: #fff;
    }

    body {
      display: flex;
      justify-content: center;
    }

    .wrap {
      width: min(860px, 100%);
      padding: 20px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 24px;
    }

    .sub {
      color: #aeb6c6;
      margin: 0 0 18px;
      line-height: 1.5;
    }

    .mode {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }

    button {
      border: 0;
      border-radius: 10px;
      padding: 11px 15px;
      background: #252b38;
      color: #fff;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
    }

    button.active {
      background: #fff;
      color: #111;
    }

    button.live-btn {
      background: linear-gradient(135deg, #ff3366, #ff9933);
      color: #fff;
    }

    button.live-gray-btn {
      background: linear-gradient(135deg, #444444, #aaaaaa);
      color: #fff;
    }

    button.live-strobe-btn {
      background: linear-gradient(135deg, #ff0055, #9900ff);
      color: #fff;
    }

    button.live-pulse-btn {
      background: linear-gradient(135deg, #00ffcc, #0066ff);
      color: #fff;
    }

    button.live-rave-btn {
      background: linear-gradient(135deg, #ffff00, #ff0000);
      color: #111;
    }

    button:disabled {
      opacity: .45;
      cursor: not-allowed;
    }

    .panel {
      background: #151923;
      border: 1px solid #2a3040;
      border-radius: 16px;
      padding: 18px;
      margin-bottom: 14px;
    }

    label {
      display: block;
      color: #aeb6c6;
      font-size: 13px;
      margin-bottom: 7px;
    }

    .palette {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(36px, 1fr));
      gap: 6px;
      margin-bottom: 12px;
    }

    .color-chip {
      height: 36px;
      border-radius: 8px;
      border: 1px solid #303746;
      cursor: pointer;
      transition: transform 0.1s ease, border-color 0.1s ease;
    }

    .color-chip:hover {
      transform: scale(1.08);
      border-color: #fff;
    }

    input[type=number] {
      width: 100%;
      background: #0d1017;
      border: 1px solid #2a3040;
      color: #fff;
      padding: 10px;
      border-radius: 8px;
      font-size: 14px;
      font-family: ui-monospace, monospace;
    }

    input[type=range] {
      width: 100%;
      accent-color: #77e3a2;
      cursor: pointer;
      margin: 8px 0;
    }

    input[type=color] {
      width: 100%;
      height: 80px;
      border: 0;
      padding: 0;
      background: none;
      cursor: pointer;
    }

    .row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
      margin-bottom: 12px;
    }

    .status {
      font: 600 13px ui-monospace, monospace;
      padding: 7px 9px;
      border-radius: 8px;
      background: #0d1017;
      color: #c9d1e0;
    }

    .big {
      font: 800 32px ui-monospace, monospace;
      color: #77e3a2;
      margin: 10px 0;
    }

    .color-box {
      height: 180px;
      border-radius: 14px;
      border: 1px solid #303746;
      margin: 10px 0 16px;
      display: flex;
      align-items: flex-end;
      padding: 12px;
      transition: background 0.05s ease;
    }

    .color-box span {
      background: rgba(0, 0, 0, .55);
      padding: 6px 9px;
      border-radius: 7px;
      font: 700 14px ui-monospace, monospace;
    }

    .config {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 12px;
      margin-bottom: 14px;
    }

    .debug {
      background: #080a0f;
      border: 1px solid #1e2533;
      border-radius: 8px;
      padding: 10px;
      font: 12px ui-monospace, monospace;
      color: #79c0ff;
      white-space: pre-wrap;
      line-height: 1.55;
    }

    .value {
      font: 700 15px ui-monospace, monospace;
      color: #77e3a2;
      padding: 10px 0;
    }

    canvas {
      width: 100%;
      height: 180px;
      background: #090c11;
      border-radius: 10px;
      border: 1px solid #252b36;
      margin-top: 10px;
      display: block;
    }

    .hint {
      color: #8b949e;
      font-size: 12px;
      line-height: 1.5;
    }

    .progress-bar {
      width: 100%;
      height: 6px;
      background: #0d1017;
      border-radius: 3px;
      overflow: hidden;
      margin-bottom: 12px;
      display: none;
    }

    .progress-fill {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #ff3366, #ff9933, #77e3a2, #7fc8ff);
      transition: width 0.1s linear;
    }
  </style>
</head>

<body>
  <div class="wrap">

    <h1>Ultrasonic Color Demo</h1>
    <p class="sub">
      18〜21kHzの超音波をカラー情報として使用。<br>
      送信側の色を周波数へ変換し、受信側ではマイクから周波数を検出して色へ戻します。
    </p>

    <div class="mode">
      <button id="txMode" class="active">カラー送信</button>
      <button id="rxMode">カラー受信</button>
    </div>

    <!-- ================= TX ================= -->

    <section id="txPanel" class="panel">

      <label>送信カラー（クイックパレット）</label>
      <div class="palette" id="colorPalette">
        <div class="color-chip" style="background: #000000;" data-color="#000000" title="黒"></div>
        <div class="color-chip" style="background: #444444;" data-color="#444444" title="ダークグレー"></div>
        <div class="color-chip" style="background: #888888;" data-color="#888888" title="グレー"></div>
        <div class="color-chip" style="background: #CCCCCC;" data-color="#CCCCCC" title="ライトグレー"></div>
        <div class="color-chip" style="background: #FFFFFF;" data-color="#FFFFFF" title="白"></div>
        <div class="color-chip" style="background: #FF0000;" data-color="#FF0000" title="赤"></div>
        <div class="color-chip" style="background: #FF7F00;" data-color="#FF7F00" title="オレンジ"></div>
        <div class="color-chip" style="background: #FFFF00;" data-color="#FFFF00" title="黄"></div>
        <div class="color-chip" style="background: #00FF00;" data-color="#00FF00" title="緑"></div>
        <div class="color-chip" style="background: #00FFFF;" data-color="#00FFFF" title="シアン"></div>
        <div class="color-chip" style="background: #0000FF;" data-color="#0000FF" title="青"></div>
        <div class="color-chip" style="background: #8B00FF;" data-color="#8B00FF" title="紫"></div>
        <div class="color-chip" style="background: #FF00FF;" data-color="#FF00FF" title="マゼンタ"></div>
      </div>

      <label>カスタムカラー選択</label>
      <input id="txColor" type="color" value="#FF0000">

      <div class="color-box" id="txColorBox">
        <span id="txColorText">#FF0000</span>
      </div>

      <div class="progress-bar" id="liveProgressBar">
        <div class="progress-fill" id="liveProgressFill"></div>
      </div>

      <div class="config">
        <div>
          <label>送信周波数</label>
          <input type="range" id="txFreqRange" min="18000" max="21000" step="1" value="18000">
          <input type="number" id="txFreqNum" min="18000" max="21000" step="1" value="18000" style="margin-top: 8px;">
          <div class="value" id="txFreqText">18000 Hz</div>
        </div>

        <div>
          <label>ゲイン</label>
          <input type="number" id="txGain" value="0.05" min="0" max="0.5" step="0.005">
          <div class="hint" style="margin-top: 8px;">
            18.00〜18.50kHz = 黒〜白<br>
            18.50〜18.80kHz = 白ガード（ズレ防止）<br>
            18.80〜21kHz = 色相
          </div>
        </div>
      </div>

      <div class="row">
        <button id="txStart">超音波送信開始</button>
        <button id="liveColorStart" class="live-btn">⚡ スムーズレインボー</button>
        <button id="liveStrobeStart" class="live-strobe-btn">🔥 黒混じり爆裂チカチカ</button>
        <button id="livePulseStart" class="live-pulse-btn">✨ 黒フラッシュパルス</button>
        <button id="liveRaveStart" class="live-rave-btn">🚨 黒混じり激アツレイブ</button>
        <button id="liveGrayStart" class="live-gray-btn">📺 白黒リズミカル点滅</button>
        <button id="txStop" disabled>停止</button>
        <span id="txStatus" class="status">停止中</span>
      </div>

      <div id="txDebug" class="debug">Ready.</div>

    </section>

    <!-- ================= RX ================= -->

    <section id="rxPanel" class="panel" style="display: none;">

      <label>受信カラー</label>

      <div class="color-box" id="rxColorBox" style="background: #151923;">
        <span id="rxColorText">NO SIGNAL</span>
      </div>

      <label>受信周波数</label>

      <div class="big" id="peakDisplay">
        NO SIGNAL
      </div>

      <div class="config">
        <div>
          <label>送信側周波数（比較用）</label>
          <input type="number" id="rxExpectedFreq" min="18000" max="21000" step="1" placeholder="例: 19500">
        </div>

        <div>
          <label>受信周波数</label>
          <div class="value" id="rxDetectedFreq">---- Hz</div>
        </div>

        <div>
          <label>周波数差</label>
          <div class="value" id="rxDiff">---- Hz</div>
        </div>

        <div>
          <label>変換された色</label>
          <div class="value" id="rxDetectedColor">----</div>
        </div>
      </div>

      <div class="row">
        <button id="rxStart">マイク受信開始</button>
        <button id="rxStop" disabled>停止</button>
        <span id="rxStatus" class="status">停止中</span>
      </div>

      <canvas id="spectrum" width="1000" height="180"></canvas>

      <div id="rxLog" class="debug">
        Microphone inactive.
      </div>

    </section>

  </div>

  <script>
    (() => {
      "use strict";

      const MIN_FREQ = 18000;
      const MAX_FREQ = 21000;
      const GRAY_END_FREQ = 18500;       // 白の最大境界（18.50kHz）
      const COLOR_START_FREQ = 18800;    // 色（赤）の開始境界（18.80kHz）※間の300Hzを白ガードバンドとする
      const FFT_SIZE = 4096;
      const RX_THRESHOLD_DB = -110;

      let tx = {
        ctx: null,
        osc: null,
        gain: null,
        running: false,
        frequency: 18000,
        color: "#FF0000",
        liveAnim: null
      };

      let rx = {
        ctx: null,
        stream: null,
        source: null,
        analyser: null,
        bins: null,
        raf: null,
        running: false,
        lastColor: "#151923",
        lastFrequency: null,
        expectedFreq: null
      };

      const $ = id => document.getElementById(id);

      $("txMode").onclick = () => {
        $("txMode").classList.add("active");
        $("rxMode").classList.remove("active");
        $("txPanel").style.display = "";
        $("rxPanel").style.display = "none";
      };

      $("rxMode").onclick = () => {
        $("rxMode").classList.add("active");
        $("txMode").classList.remove("active");
        $("txPanel").style.display = "none";
        $("rxPanel").style.display = "";
      };

      document.querySelectorAll(".color-chip").forEach(chip => {
        chip.onclick = () => {
          const hex = chip.getAttribute("data-color");
          $("txColor").value = hex;
          updateTxColor(hex);
        };
      });

      function hexToRgb(hex) {
        const n = parseInt(hex.slice(1), 16);
        return { r: (n >> 16) & 255, g: (n >> 8) & 255, b: n & 255 };
      }

      function rgbToHex(r, g, b) {
        return "#" + [r, g, b].map(v =>
          Math.round(Math.max(0, Math.min(255, v)))
            .toString(16)
            .padStart(2, "0")
        ).join("").toUpperCase();
      }

      function rgbToHsl(r, g, b) {
        r /= 255; g /= 255; b /= 255;
        const max = Math.max(r, g, b), min = Math.min(r, g, b);
        let h = 0, s = 0, l = (max + min) / 2;
        if (max !== min) {
          const d = max - min;
          s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
          switch (max) {
            case r: h = (g - b) / d + (g < b ? 6 : 0); break;
            case g: h = (b - r) / d + 2; break;
            case b: h = (r - g) / d + 4; break;
          }
          h /= 6;
        }
        return { h: h * 360, s, l };
      }

      function colorToFrequency(hex) {
        const { r, g, b } = hexToRgb(hex);
        const max = Math.max(r, g, b), min = Math.min(r, g, b);
        if (max - min <= 12) {
          const gray = (r + g + b) / 3;
          return MIN_FREQ + (gray / 255) * (GRAY_END_FREQ - MIN_FREQ);
        }
        const hsl = rgbToHsl(r, g, b);
        return COLOR_START_FREQ + (hsl.h / 360) * (MAX_FREQ - COLOR_START_FREQ);
      }

      function frequencyToColor(freq) {
        const f = Math.max(MIN_FREQ, Math.min(MAX_FREQ, freq));
        // 1. モノクロ領域（黒〜白）
        if (f <= GRAY_END_FREQ) {
          const t = (f - MIN_FREQ) / (GRAY_END_FREQ - MIN_FREQ);
          const v = Math.round(t * 255);
          return rgbToHex(v, v, v);
        }
        // 2. 白ガードバンド（上方にズレても白を維持して赤に化けるのを防ぐ）
        if (f < COLOR_START_FREQ) {
          return "#FFFFFF";
        }
        // 3. カラー領域
        const t = (f - COLOR_START_FREQ) / (MAX_FREQ - COLOR_START_FREQ);
        return hslToHex(t * 360, 100, 50);
      }

      function hslToHex(h, s, l) {
        s /= 100; l /= 100;
        const c = (1 - Math.abs(2 * l - 1)) * s;
        const x = c * (1 - Math.abs((h / 60) % 2 - 1));
        const m = l - c / 2;
        let r = 0, g = 0, b = 0;
        if (h < 60) { r = c; g = x; }
        else if (h < 120) { r = x; g = c; }
        else if (h < 180) { g = c; b = x; }
        else if (h < 240) { g = x; b = c; }
        else if (h < 300) { r = x; b = c; }
        else { r = c; b = x; }
        return rgbToHex((r + m) * 255, (g + m) * 255, (b + m) * 255);
      }

      function updateTxColor(hex) {
        tx.color = hex.toUpperCase();
        tx.frequency = colorToFrequency(tx.color);

        $("txFreqRange").value = tx.frequency;
        $("txFreqNum").value = tx.frequency.toFixed(1);
        $("txFreqText").textContent = `${tx.frequency.toFixed(1)} Hz`;
        $("txColorText").textContent = tx.color;
        $("txColorBox").style.background = tx.color;

        if (tx.running) {
          tx.osc.frequency.setTargetAtTime(tx.frequency, tx.ctx.currentTime, 0.02);
          $("txStatus").textContent = `送信中: ${tx.frequency.toFixed(1)} Hz`;
        }
        updateTxDebug();
      }

      function updateTxFrequency(value) {
        let f = parseFloat(value);
        if (!Number.isFinite(f)) f = MIN_FREQ;
        f = Math.max(MIN_FREQ, Math.min(MAX_FREQ, f));
        tx.frequency = f;
        tx.color = frequencyToColor(f);

        $("txFreqRange").value = f;
        $("txFreqNum").value = f.toFixed(1);
        $("txFreqText").textContent = `${f.toFixed(1)} Hz`;
        $("txColor").value = tx.color;
        $("txColorText").textContent = tx.color;
        $("txColorBox").style.background = tx.color;

        if (tx.running) {
          tx.osc.frequency.setTargetAtTime(f, tx.ctx.currentTime, 0.01);
          $("txStatus").textContent = `送信中: ${f.toFixed(1)} Hz`;
        }
        updateTxDebug();
      }

      function updateTxDebug() {
        $("txDebug").textContent =
          `[TRANSMITTER DEBUG]\nColor : ${tx.color}\nFrequency : ${tx.frequency.toFixed(3)} Hz\nRunning : ${tx.running}\nSampleRate : ${tx.ctx ? tx.ctx.sampleRate : "----"} Hz\nGain : ${$("txGain").value}`;
      }

      $("txColor").oninput = e => updateTxColor(e.target.value);
      $("txFreqRange").oninput = e => updateTxFrequency(e.target.value);
      $("txFreqNum").oninput = e => updateTxFrequency(e.target.value);

      async function initAudioContext() {
        if (!tx.ctx) {
          tx.ctx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (tx.ctx.state === "suspended") {
          await tx.ctx.resume();
        }
        if (!tx.running) {
          let gainVal = parseFloat($("txGain").value);
          if (!Number.isFinite(gainVal)) gainVal = .05;
          gainVal = Math.max(0, Math.min(.5, gainVal));

          tx.osc = tx.ctx.createOscillator();
          tx.gain = tx.ctx.createGain();
          tx.osc.type = "sine";
          tx.osc.frequency.setValueAtTime(tx.frequency, tx.ctx.currentTime);
          tx.gain.gain.setValueAtTime(gainVal, tx.ctx.currentTime);
          tx.osc.connect(tx.gain).connect(tx.ctx.destination);
          tx.osc.start();
          tx.running = true;

          $("txStart").disabled = true;
          $("liveColorStart").disabled = true;
          $("liveStrobeStart").disabled = true;
          $("livePulseStart").disabled = true;
          $("liveRaveStart").disabled = true;
          $("liveGrayStart").disabled = true;
          $("txStop").disabled = false;
        }
      }

      $("txStart").onclick = async () => {
        try {
          await initAudioContext();
          $("txStatus").textContent = `送信中: ${tx.frequency.toFixed(1)} Hz`;
          updateTxDebug();
        } catch (e) {
          $("txDebug").textContent = `[ERROR]\n${e.message}`;
        }
      };

      async function startLivePreset(durationMs, generatorFn) {
        if (tx.running) return;
        try {
          await initAudioContext();
          $("liveProgressBar").style.display = "block";

          let startTime = performance.now();

          const liveLoop = (now) => {
            let elapsed = now - startTime;
            let progress = Math.min(100, (elapsed / durationMs) * 100);
            $("liveProgressFill").style.width = `${progress}%`;

            if (elapsed >= durationMs) {
              stopTxEverything();
              return;
            }

            let t = elapsed / 1000;
            let freq = generatorFn(t, elapsed);

            updateTxFrequency(freq);
            $("txStatus").textContent = `⚡ ライブ演出中 (${((durationMs - elapsed) / 1000).toFixed(1)}s)`;
            tx.liveAnim = requestAnimationFrame(liveLoop);
          };

          tx.liveAnim = requestAnimationFrame(liveLoop);
        } catch (e) {
          $("txDebug").textContent = `[ERROR]\n${e.message}`;
          stopTxEverything();
        }
      }

      $("liveColorStart").onclick = () => {
        startLivePreset(45000, (t) => {
          let hue = (t * 15) % 360;
          let hslHex = hslToHex(hue, 100, 50);
          const { r, g, b } = hexToRgb(hslHex);
          const hsl = rgbToHsl(r, g, b);
          return COLOR_START_FREQ + (hsl.h / 360) * (MAX_FREQ - COLOR_START_FREQ);
        });
      };

      $("liveStrobeStart").onclick = () => {
        startLivePreset(35000, (t) => {
          let step = Math.floor(t * 2.5);
          if (step % 2 === 0) {
            return MIN_FREQ;
          }
          let hues = [0, 120, 240, 60, 300, 180];
          let hue = hues[Math.floor(t * 1.5) % hues.length];
          let hslHex = hslToHex(hue, 100, 50);
          const { r, g, b } = hexToRgb(hslHex);
          const hsl = rgbToHsl(r, g, b);
          return COLOR_START_FREQ + (hsl.h / 360) * (MAX_FREQ - COLOR_START_FREQ);
        });
      };

      $("livePulseStart").onclick = () => {
        startLivePreset(35000, (t) => {
          let alt = Math.sin(t * Math.PI * 1.2) > 0;
          if (alt) {
            let hue = (t * 40) % 360;
            let hslHex = hslToHex(hue, 100, 50);
            const { r, g, b } = hexToRgb(hslHex);
            const hsl = rgbToHsl(r, g, b);
            return COLOR_START_FREQ + (hsl.h / 360) * (MAX_FREQ - COLOR_START_FREQ);
          } else {
            return MIN_FREQ;
          }
        });
      };

      $("liveRaveStart").onclick = () => {
        startLivePreset(35000, (t) => {
          let beat = Math.sin(t * Math.PI * 1.5);
          if (beat > 0.3) {
            let freq = MAX_FREQ - (t * 40) % 1500;
            return Math.max(COLOR_START_FREQ, Math.min(MAX_FREQ, freq));
          } else {
            return MIN_FREQ;
          }
        });
      };

      $("liveGrayStart").onclick = () => {
        startLivePreset(30000, (t) => {
          let wave = (Math.sin(t * Math.PI * 2) + 1) / 2;
          let strobe = Math.floor(t * 3) % 2;
          let targetV = MIN_FREQ + wave * (GRAY_END_FREQ - MIN_FREQ);
          return strobe ? targetV : MIN_FREQ;
        });
      };

      async function stopTxEverything() {
        if (tx.liveAnim) cancelAnimationFrame(tx.liveAnim);
        try {
          if (tx.osc) tx.osc.stop();
          if (tx.ctx) await tx.ctx.close();
        } catch {}

        tx.running = false;
        tx.osc = null;
        tx.gain = null;
        tx.ctx = null;

        $("txStart").disabled = false;
        $("liveColorStart").disabled = false;
        $("liveStrobeStart").disabled = false;
        $("livePulseStart").disabled = false;
        $("liveRaveStart").disabled = false;
        $("liveGrayStart").disabled = false;
        $("txStop").disabled = true;
        $("txStatus").textContent = "停止中";
        $("liveProgressBar").style.display = "none";
        $("liveProgressFill").style.width = "0%";

        updateTxDebug();
      }

      $("txStop").onclick = stopTxEverything;

      $("rxExpectedFreq").oninput = () => {
        const v = parseFloat($("rxExpectedFreq").value);
        rx.expectedFreq = Number.isFinite(v) ? v : null;
      };

      function findUltrasonicPeak() {
        const sr = rx.ctx.sampleRate;
        const nyquist = sr / 2;
        const minBin = Math.max(0, Math.floor(MIN_FREQ / nyquist * rx.bins.length));
        const maxBin = Math.min(rx.bins.length - 1, Math.ceil(MAX_FREQ / nyquist * rx.bins.length));

        let maxDb = -Infinity;
        let maxBinIndex = minBin;

        for (let i = minBin; i <= maxBin; i++) {
          const db = rx.bins[i];
          if (db > maxDb) {
            maxDb = db;
            maxBinIndex = i;
          }
        }
        const peakHz = maxBinIndex * nyquist / rx.bins.length;
        return { peakHz, maxDb, minBin, maxBin };
      }

      $("rxStart").onclick = async () => {
        if (rx.running) return;
        try {
          rx.stream = await navigator.mediaDevices.getUserMedia({
            audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false, channelCount: 1 },
            video: false
          });
          rx.ctx = new (window.AudioContext || window.webkitAudioContext)();
          if (rx.ctx.state === "suspended") await rx.ctx.resume();

          rx.source = rx.ctx.createMediaStreamSource(rx.stream);
          rx.analyser = rx.ctx.createAnalyser();
          rx.analyser.fftSize = FFT_SIZE;
          rx.analyser.smoothingTimeConstant = 0.05;
          rx.source.connect(rx.analyser);
          rx.bins = new Float32Array(rx.analyser.frequencyBinCount);
          rx.running = true;

          $("rxStart").disabled = true;
          $("rxStop").disabled = false;
          $("rxStatus").textContent = `受信中 (${rx.ctx.sampleRate}Hz)`;

          const canvas = $("spectrum");
          const g = canvas.getContext("2d");

          const loop = () => {
            if (!rx.running) return;

            if (canvas.width !== canvas.clientWidth || canvas.height !== canvas.clientHeight) {
              canvas.width = canvas.clientWidth;
              canvas.height = canvas.clientHeight;
            }

            rx.analyser.getFloatFrequencyData(rx.bins);
            const sr = rx.ctx.sampleRate;
            const nyquist = sr / 2;
            const d = findUltrasonicPeak();
            const confirmed = d.maxDb >= RX_THRESHOLD_DB;

            if (confirmed) {
              const color = frequencyToColor(d.peakHz);
              rx.lastColor = color;
              rx.lastFrequency = d.peakHz;

              $("rxColorBox").style.background = color;
              $("rxColorText").textContent = color;
              $("rxDetectedColor").textContent = color;
              $("rxDetectedFreq").textContent = `${d.peakHz.toFixed(1)} Hz`;
              $("rxStatus").textContent = `SIGNAL ACTIVE`;
            } else {
              $("rxColorBox").style.background = rx.lastColor;
              $("rxColorText").textContent = rx.lastFrequency !== null ? rx.lastColor : "NO SIGNAL";
              $("rxDetectedColor").textContent = rx.lastFrequency !== null ? rx.lastColor : "----";
              $("rxDetectedFreq").textContent = rx.lastFrequency !== null ? `${rx.lastFrequency.toFixed(1)} Hz` : "---- Hz";
              $("rxStatus").textContent = "待機中";
            }

            $("peakDisplay").textContent = `${d.peakHz.toFixed(1)} Hz (${d.maxDb.toFixed(1)} dB)`;

            if (rx.expectedFreq !== null && confirmed) {
              const diff = d.peakHz - rx.expectedFreq;
              $("rxDiff").textContent = `${diff >= 0 ? "+" : ""}${diff.toFixed(1)} Hz`;
            } else {
              $("rxDiff").textContent = "---- Hz";
            }

            const w = canvas.width, h = canvas.height;
            g.clearRect(0, 0, w, h);
            g.fillStyle = "#090c11";
            g.fillRect(0, 0, w, h);

            g.beginPath();
            for (let i = 0; i < rx.bins.length; i++) {
              const x = i / rx.bins.length * w;
              const db = rx.bins[i];
              const y = h - Math.max(0, Math.min(1, (db + 100) / 80)) * h;
              if (i === 0) g.moveTo(x, y);
              else g.lineTo(x, y);
            }
            g.strokeStyle = "#7fc8ff";
            g.lineWidth = 1.5;
            g.stroke();

            const x1 = MIN_FREQ / nyquist * w;
            const x2 = MAX_FREQ / nyquist * w;
            g.fillStyle = "rgba(119,227,162,.10)";
            g.fillRect(x1, 0, x2 - x1, h);

            if (confirmed) {
              const peakX = d.peakHz / nyquist * w;
              g.strokeStyle = "#ff7f8f";
              g.lineWidth = 2;
              g.beginPath();
              g.moveTo(peakX, 0);
              g.lineTo(peakX, h);
              g.stroke();
            }

            rx.raf = requestAnimationFrame(loop);
          };
          rx.raf = requestAnimationFrame(loop);
        } catch (e) {
          $("rxLog").textContent = `[ERROR]\n${e.message}`;
          $("rxStatus").textContent = "マイクエラー";
        }
      };

      $("rxStop").onclick = async () => {
        rx.running = false;
        if (rx.raf) cancelAnimationFrame(rx.raf);
        try {
          rx.source?.disconnect();
          rx.stream?.getTracks().forEach(t => t.stop());
          await rx.ctx?.close();
        } catch {}

        rx.ctx = null; rx.stream = null; rx.source = null; rx.analyser = null; rx.bins = null;
        $("rxStart").disabled = false;
        $("rxStop").disabled = true;
        $("rxStatus").textContent = "停止中";
        $("peakDisplay").textContent = "NO SIGNAL";
        $("rxDetectedFreq").textContent = "---- Hz";
        $("rxDiff").textContent = "---- Hz";
        $("rxDetectedColor").textContent = "----";
        $("rxColorText").textContent = "NO SIGNAL";
        $("rxColorBox").style.background = "#151923";
      };

      updateTxColor($("txColor").value);
    })();
  </script>
</body>
</html>
