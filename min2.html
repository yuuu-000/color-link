<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>43ch Dual-Triplet 送受信テスト</title>
  <style>
    body { font-family: monospace; background: #121212; color: #eee; padding: 15px; max-width: 800px; margin: 0 auto; }
    .box { background: #1e1e1e; border: 1px solid #333; border-radius: 6px; padding: 12px; margin-bottom: 12px; }
    button { background: #0066cc; color: #fff; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; font-weight: bold; }
    button:hover { background: #0052a3; }
    button.rx { background: #28a745; }
    button.rx.active { background: #dc3545; }
    input[type="number"] { background: #222; border: 1px solid #555; color: #fff; padding: 6px; width: 140px; }
    .status { margin-top: 8px; font-weight: bold; color: #66b3ff; }
    .result { margin-top: 10px; padding: 10px; border-radius: 6px; font-size: 1.1em; font-weight: bold; display: none; }
    .result.ok { background: #103018; border: 1px solid #28a745; color: #a3e4b7; display: block; }
    .result.fail { background: #401519; border: 1px solid #dc3545; color: #fca5a5; display: block; }
    #log { background: #080808; border: 1px solid #333; padding: 8px; font-size: 0.8em; height: 120px; overflow-y: auto; white-space: pre-wrap; color: #7ee787; margin-top: 8px; }
  </style>
</head>
<body>

  <!-- 送信部 -->
  <div class="box">
    <h3>送信側 (Transmitter)</h3>
    <label>送信ID (0 〜 113,635,599): </label>
    <input type="number" id="txId" value="12345678" min="0" max="113635599">
    <button id="btnSend">送信</button>
    <button id="btnRandom" style="background:#444;">ランダム送信</button>
    <label style="margin-left:10px;">
      <input type="checkbox" id="checkCd" checked> チェックデジット付与
    </label>
    <div class="status" id="txStatus">待機中</div>
  </div>

  <!-- 受信部 -->
  <div class="box">
    <h3>受信側 (Receiver)</h3>
    <button id="btnRx" class="rx">マイク受信 開始</button>
    <div class="status" id="rxStatus">停止中</div>
    <div class="result" id="rxResult"></div>
  </div>

  <div class="box">
    <h3>デバッグログ</h3>
    <div id="log">Ready...</div>
  </div>

  <script>
    "use strict";

    // --- 物理層パラメータ (iPhone 17実測チューニング値) ---
    const NUM_CH = 43;
    const BASE_FREQ = 17500;
    const STEP_FREQ = 56;
    const TRIGGER_FREQ = 20200;
    const GUARD_FREQ = 20000;
    const FFT_SIZE = 2048;

    // スロット幅: 70ms、実測サンプリング窓
    const SLOT_MS = 70;
    const WIN_T1 = [93, 173];
    const WIN_T2 = [213, 313];
    const WIN_CD = [333, 433]; // CDあり時用

    const FREQS = Array.from({ length: NUM_CH }, (_, i) => BASE_FREQ + i * STEP_FREQ);

    // 43ch 非隣接Triplet (41C3 = 10,660通り)
    const TRIPLETS = [];
    const TRIPLET_MAP = new Map();
    for (let i = 0; i < NUM_CH; i++) {
      for (let j = i + 2; j < NUM_CH; j++) {
        for (let k = j + 2; k < NUM_CH; k++) {
          const id = TRIPLETS.length;
          TRIPLETS.push([i, j, k]);
          TRIPLET_MAP.set(`${i},${j},${k}`, id);
        }
      }
    }
    const COMBINATIONS = TRIPLETS.length; // 10660
    const MAX_ID = (COMBINATIONS * COMBINATIONS) - 1;

    function calcCheckDigit(id1, id2) {
      return (id1 * 31 + id2 * 17) % COMBINATIONS;
    }

    const logEl = document.getElementById("log");
    function appendLog(msg) {
      logEl.textContent = `[${new Date().toLocaleTimeString()}] ${msg}\n` + logEl.textContent;
    }

    // ==========================================
    // 送信ロジック
    // ==========================================
    let txCtx = null;

    function sendId(totalId) {
      if (isNaN(totalId) || totalId < 0 || totalId > MAX_ID) {
        alert("有効なID範囲: 0 〜 " + MAX_ID);
        return;
      }

      const useCD = document.getElementById("checkCd").checked;
      const id1 = Math.floor(totalId / COMBINATIONS);
      const id2 = totalId % COMBINATIONS;
      const trip1 = TRIPLETS[id1];
      const trip2 = TRIPLETS[id2];
      const tripCD = useCD ? TRIPLETS[calcCheckDigit(id1, id2)] : null;

      const sequence = [trip1, trip2];
      if (useCD) sequence.push(tripCD);

      if (!txCtx) txCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (txCtx.state === "suspended") txCtx.resume();

      const targetGain = 0.10;
      const slotSec = SLOT_MS / 1000.0;
      const trigSec = 0.09;
      const ramp = 0.005;
      const now = txCtx.currentTime + 0.04;

      const oscs = [txCtx.createOscillator(), txCtx.createOscillator(), txCtx.createOscillator()];
      const gains = [txCtx.createGain(), txCtx.createGain(), txCtx.createGain()];

      for (let i = 0; i < 3; i++) {
        oscs[i].connect(gains[i]);
        gains[i].connect(txCtx.destination);
      }

      let t = now;
      // Trigger
      oscs[0].frequency.setValueAtTime(TRIGGER_FREQ, t);
      gains[0].gain.setValueAtTime(0, t);
      gains[0].gain.linearRampToValueAtTime(targetGain, t + ramp);
      gains[0].gain.setValueAtTime(targetGain, t + trigSec - ramp);
      gains[0].gain.linearRampToValueAtTime(0, t + trigSec);
      gains[1].gain.setValueAtTime(0, t);
      gains[2].gain.setValueAtTime(0, t);
      t += trigSec;

      // Data Slots
      for (let s = 0; s < sequence.length; s++) {
        const trip = sequence[s];
        for (let i = 0; i < 3; i++) {
          oscs[i].frequency.setValueAtTime(FREQS[trip[i]], t);
          gains[i].gain.setValueAtTime(0, t);
          gains[i].gain.linearRampToValueAtTime(targetGain / 3, t + ramp);
          gains[i].gain.setValueAtTime(targetGain / 3, t + slotSec - ramp);
          gains[i].gain.linearRampToValueAtTime(0, t + slotSec);
        }
        t += slotSec;
      }

      for (let i = 0; i < 3; i++) {
        oscs[i].start(now);
        oscs[i].stop(t + 0.05);
      }

      const durMs = Math.round((t - now) * 1000);
      document.getElementById("txStatus").textContent = `送信中: ID ${totalId} (${durMs}ms)`;
      appendLog(`送信: ID ${totalId} (T1:[${trip1}], T2:[${trip2}]${useCD ? ', CD:[${tripCD}]' : ''})`);

      setTimeout(() => {
        document.getElementById("txStatus").textContent = "送信完了";
      }, durMs + 50);
    }

    document.getElementById("btnSend").onclick = () => sendId(parseInt(document.getElementById("txId").value, 10));
    document.getElementById("btnRandom").onclick = () => {
      const rid = Math.floor(Math.random() * (MAX_ID + 1));
      document.getElementById("txId").value = rid;
      sendId(rid);
    };

    // ==========================================
    // 受信ロジック (実測窓フィッティング)
    // ==========================================
    let rxCtx = null, analyser = null, rxStream = null;
    let isListening = false;
    let rxState = "IDLE";
    let triggerTime = 0, trigConfirm = 0, trigFloor = -100;
    let slotPeakHold = [];

    const btnRx = document.getElementById("btnRx");
    const rxStatus = document.getElementById("rxStatus");
    const rxResult = document.getElementById("rxResult");

    btnRx.onclick = async () => {
      if (isListening) {
        if (rxStream) rxStream.getTracks().forEach(t => t.stop());
        if (rxCtx) rxCtx.close();
        isListening = false;
        btnRx.textContent = "マイク受信 開始";
        btnRx.classList.remove("active");
        rxStatus.textContent = "停止中";
        return;
      }

      try {
        rxStream = await navigator.mediaDevices.getUserMedia({
          audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false, channelCount: 1 }
        });
        rxCtx = new (window.AudioContext || window.webkitAudioContext)();
        analyser = rxCtx.createAnalyser();
        analyser.fftSize = FFT_SIZE;
        analyser.smoothingTimeConstant = 0.0;
        rxCtx.createMediaStreamSource(rxStream).connect(analyser);

        isListening = true;
        btnRx.textContent = "マイク受信 停止";
        btnRx.classList.add("active");
        rxStatus.textContent = "トリガー待機中...";
        requestAnimationFrame(rxLoop);
      } catch (e) {
        alert("マイク起動失敗: " + e.message);
      }
    };

    function getStrictPeak(dataArray, freq, binWidth) {
      const bin = Math.round(freq / binWidth);
      return Math.max(dataArray[bin - 1] || -999, dataArray[bin], dataArray[bin + 1] || -999);
    }

    function rxLoop() {
      if (!isListening) return;

      const dataArray = new Float32Array(analyser.frequencyBinCount);
      analyser.getFloatFrequencyData(dataArray);
      const binWidth = rxCtx.sampleRate / analyser.fftSize;
      const now = performance.now();

      const trigDb = getStrictPeak(dataArray, TRIGGER_FREQ, binWidth);
      const guardDb = getStrictPeak(dataArray, GUARD_FREQ, binWidth);
      const useCD = document.getElementById("checkCd").checked;
      const expectedSlots = useCD ? 3 : 2;

      if (rxState === "IDLE") {
        trigFloor = trigFloor * 0.98 + trigDb * 0.02;
        if (trigDb > Math.max(-95, trigFloor + 12) && (trigDb - guardDb) > 8) {
          trigConfirm++;
        } else {
          trigConfirm = 0;
        }

        if (trigConfirm >= 2) {
          trigConfirm = 0;
          rxState = "READING";
          triggerTime = now;
          slotPeakHold = [
            new Float32Array(NUM_CH).fill(-999),
            new Float32Array(NUM_CH).fill(-999),
            new Float32Array(NUM_CH).fill(-999)
          ];
          rxStatus.textContent = `トリガー検知 (${trigDb.toFixed(1)}dB) → スロット解析中`;
        }
      } else if (rxState === "READING") {
        const elapsed = now - triggerTime;

        // 実測サンプリング窓によるピークホールド
        const windows = [WIN_T1, WIN_T2, WIN_CD];
        for (let s = 0; s < expectedSlots; s++) {
          if (elapsed >= windows[s][0] && elapsed <= windows[s][1]) {
            for (let ch = 0; ch < NUM_CH; ch++) {
              const db = getStrictPeak(dataArray, FREQS[ch], binWidth);
              if (db > slotPeakHold[s][ch]) slotPeakHold[s][ch] = db;
            }
          }
        }

        const endTime = useCD ? WIN_CD[1] + 20 : WIN_T2[1] + 20;
        if (elapsed > endTime) {
          decodeResult(useCD);
          rxState = "IDLE";
          rxStatus.textContent = "トリガー待機中...";
        }
      }

      requestAnimationFrame(rxLoop);
    }

    function decodeResult(useCD) {
      const expectedSlots = useCD ? 3 : 2;
      const resolved = [];

      for (let s = 0; s < expectedSlots; s++) {
        const scores = Array.from(slotPeakHold[s]).map((peakDb, idx) => ({ idx, peakDb }));
        scores.sort((a, b) => b.peakDb - a.peakDb);

        // 非隣接条件 (差分 >= 2) の上位3波を抽出
        const top3 = [];
        for (let i = 0; i < scores.length && top3.length < 3; i++) {
          const cand = scores[i].idx;
          if (top3.every(c => Math.abs(c - cand) >= 2)) {
            top3.push(cand);
          }
        }

        if (top3.length === 3) {
          top3.sort((a, b) => a - b);
          const tripId = TRIPLET_MAP.get(`${top3[0]},${top3[1]},${top3[2]}`);
          resolved.push({ id: tripId !== undefined ? tripId : null, chs: top3 });
        } else {
          resolved.push({ id: null, chs: [] });
        }
      }

      const t1 = resolved[0];
      const t2 = resolved[1];
      const cd = useCD ? resolved[2] : null;

      if (t1.id !== null && t2.id !== null) {
        const fullId = t1.id * COMBINATIONS + t2.id;
        let valid = true;

        if (useCD) {
          const expectCd = calcCheckDigit(t1.id, t2.id);
          valid = (cd.id === expectCd);
        }

        if (valid) {
          rxResult.className = "result ok";
          rxResult.textContent = `✅ 受信成功: ID ${fullId} (T1:[${t1.chs}] T2:[${t2.chs}]${useCD ? ' CD:PASS' : ''})`;
          appendLog(`受信成功: ID ${fullId}`);
        } else {
          rxResult.className = "result fail";
          rxResult.textContent = `❌ CD照合エラー (仮ID ${fullId})`;
          appendLog(`CD不一致: 期待値=${calcCheckDigit(t1.id, t2.id)}, 受信=${cd.id}`);
        }
      } else {
        rxResult.className = "result fail";
        rxResult.textContent = `❌ デコード失敗 (ピーク未成立)`;
        appendLog(`デコード失敗: T1=${t1.id}, T2=${t2.id}`);
      }
    }
  </script>
</body>
</html>
