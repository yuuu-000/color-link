<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>43ch Dual-Triplet タイミング・プロファイラ</title>
  <style>
    :root { --bg: #0d1117; --panel: #161b22; --border: #30363d; --text: #c9d1d9; --accent: #58a6ff; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: ui-monospace, monospace; padding: 16px; max-width: 1200px; margin: 0 auto; }
    .card { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 14px; margin-bottom: 14px; }
    h2 { font-size: 1rem; color: var(--accent); margin-bottom: 8px; }
    .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 8px; }
    button { background: #238636; color: #fff; border: 1px solid rgba(240,246,252,0.1); border-radius: 6px; padding: 8px 16px; font-weight: bold; cursor: pointer; }
    button:hover { background: #2ea043; }
    button.sec { background: #21262d; border-color: var(--border); }
    button.sec:hover { background: #30363d; }
    input[type="number"], select { background: #0d1117; border: 1px solid var(--border); color: #fff; padding: 6px 10px; border-radius: 6px; }
    canvas { width: 100%; height: 500px; background: #000; border: 1px solid var(--border); border-radius: 6px; display: block; }
    #log { font-size: 0.78rem; max-height: 160px; overflow-y: auto; white-space: pre-wrap; color: #7ee787; background: #050505; padding: 8px; border-radius: 6px; border: 1px solid var(--border); }
    .legend { display: flex; gap: 12px; font-size: 0.75rem; color: #8b949e; margin-top: 6px; }
  </style>
</head>
<body>

  <div class="card">
    <h2>1. 送信テスト設定 (43ch 非隣接 Dual-Triplet)</h2>
    <div class="row">
      <label>スロット幅: <input type="number" id="txSlotMs" value="100" style="width:70px;"> ms</label>
      <label>送信ゲイン: <input type="number" id="txGain" value="0.10" step="0.01" style="width:70px;"></label>
      <label>T1 CH: 
        <input type="number" id="t1_a" value="2" min="0" max="42" style="width:50px;">
        <input type="number" id="t1_b" value="10" min="0" max="42" style="width:50px;">
        <input type="number" id="t1_c" value="20" min="0" max="42" style="width:50px;">
      </label>
      <label>T2 CH: 
        <input type="number" id="t2_a" value="5" min="0" max="42" style="width:50px;">
        <input type="number" id="t2_b" value="15" min="0" max="42" style="width:50px;">
        <input type="number" id="t2_c" value="30" min="0" max="42" style="width:50px;">
      </label>
      <button id="btnTx">単発テスト送信</button>
    </div>
  </div>

  <div class="card">
    <h2>2. 受信 & タイムライン・マトリクス (トリガー検知を0msとして記録)</h2>
    <div class="row">
      <button id="btnRx" class="sec">マイク監視を開始</button>
      <button id="btnClear" class="sec">ヒートマップ消去</button>
      <span id="rxStatus" style="color:#e3b341;">停止中</span>
    </div>
    <canvas id="matrixCanvas" width="1000" height="500"></canvas>
    <div class="legend">
      <span>縦軸: CH 0〜42 (17,500Hz 〜 19,852Hz) + 最上段 Trig(20.2k)</span>
      <span>横軸: トリガー検知からの経過時間 (0 〜 600ms)</span>
      <span style="color:#58a6ff;">■ 水色枠: 送信側の理論スロット区間</span>
    </div>
  </div>

  <div class="card">
    <h2>3. 検出ログ</h2>
    <div id="log">待機中...</div>
  </div>

  <script>
    const NUM_CH = 43;
    const BASE_FREQ = 17500;
    const STEP_FREQ = 56;
    const TRIGGER_FREQ = 20200;
    const GUARD_FREQ = 20000;
    const FFT_SIZE = 2048;

    const FREQS = Array.from({ length: NUM_CH }, (_, i) => BASE_FREQ + i * STEP_FREQ);

    // --- 送信モジュール ---
    let txCtx = null;
    document.getElementById("btnTx").onclick = () => {
      if (!txCtx) txCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (txCtx.state === "suspended") txCtx.resume();

      const slotMs = parseInt(document.getElementById("txSlotMs").value, 10);
      const slotSec = slotMs / 1000.0;
      const gainVal = parseFloat(document.getElementById("txGain").value);
      const trigSec = 0.09;
      const ramp = 0.005;

      const t1 = [
        parseInt(document.getElementById("t1_a").value, 10),
        parseInt(document.getElementById("t1_b").value, 10),
        parseInt(document.getElementById("t1_c").value, 10)
      ];
      const t2 = [
        parseInt(document.getElementById("t2_a").value, 10),
        parseInt(document.getElementById("t2_b").value, 10),
        parseInt(document.getElementById("t2_c").value, 10)
      ];

      const now = txCtx.currentTime + 0.05;
      const oscs = [txCtx.createOscillator(), txCtx.createOscillator(), txCtx.createOscillator()];
      const gains = [txCtx.createGain(), txCtx.createGain(), txCtx.createGain()];

      for (let i = 0; i < 3; i++) {
        oscs[i].connect(gains[i]);
        gains[i].connect(txCtx.destination);
      }

      let t = now;
      // 1. Trigger
      oscs[0].frequency.setValueAtTime(TRIGGER_FREQ, t);
      gains[0].gain.setValueAtTime(0, t);
      gains[0].gain.linearRampToValueAtTime(gainVal, t + ramp);
      gains[0].gain.setValueAtTime(gainVal, t + trigSec - ramp);
      gains[0].gain.linearRampToValueAtTime(0, t + trigSec);
      gains[1].gain.setValueAtTime(0, t);
      gains[2].gain.setValueAtTime(0, t);

      t += trigSec;

      // 2. Slot 1 (T1)
      for (let i = 0; i < 3; i++) {
        oscs[i].frequency.setValueAtTime(FREQS[t1[i]], t);
        gains[i].gain.setValueAtTime(0, t);
        gains[i].gain.linearRampToValueAtTime(gainVal / 3, t + ramp);
        gains[i].gain.setValueAtTime(gainVal / 3, t + slotSec - ramp);
        gains[i].gain.linearRampToValueAtTime(0, t + slotSec);
      }
      t += slotSec;

      // 3. Slot 2 (T2)
      for (let i = 0; i < 3; i++) {
        oscs[i].frequency.setValueAtTime(FREQS[t2[i]], t);
        gains[i].gain.setValueAtTime(0, t);
        gains[i].gain.linearRampToValueAtTime(gainVal / 3, t + ramp);
        gains[i].gain.setValueAtTime(gainVal / 3, t + slotSec - ramp);
        gains[i].gain.linearRampToValueAtTime(0, t + slotSec);
      }
      t += slotSec;

      for (let i = 0; i < 3; i++) {
        oscs[i].start(now);
        oscs[i].stop(t + 0.05);
      }
      appendLog(`送信実行: Trig(90ms) -> T1([${t1}]) -> T2([${t2}])`);
    };

    // --- 受信・マトリクスプロファイラ ---
    let rxCtx = null, analyser = null, rxStream = null;
    let isListening = false;
    let recording = false;
    let triggerTime = 0;
    let trigConfirmCount = 0;
    let trigFloor = -100;

    const RECORD_WINDOW_MS = 600; // 記録ウィンドウ (0〜600ms)
    let timelineMatrix = [];      // { elapsedMs, powers: Float32Array(44) }

    const logEl = document.getElementById("log");
    function appendLog(str) {
      logEl.textContent = `[${new Date().toLocaleTimeString()}] ${str}\n` + logEl.textContent;
    }

    document.getElementById("btnRx").onclick = async () => {
      if (isListening) {
        if (rxStream) rxStream.getTracks().forEach(t => t.stop());
        if (rxCtx) rxCtx.close();
        isListening = false;
        document.getElementById("btnRx").textContent = "マイク監視を開始";
        document.getElementById("rxStatus").textContent = "停止中";
        return;
      }

      try {
        rxStream = await navigator.mediaDevices.getUserMedia({
          audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false }
        });
        rxCtx = new (window.AudioContext || window.webkitAudioContext)();
        analyser = rxCtx.createAnalyser();
        analyser.fftSize = FFT_SIZE;
        analyser.smoothingTimeConstant = 0.0;
        rxCtx.createMediaStreamSource(rxStream).connect(analyser);

        isListening = true;
        document.getElementById("btnRx").textContent = "マイク監視を停止";
        document.getElementById("rxStatus").textContent = "トリガー待機中...";
        requestAnimationFrame(profileLoop);
      } catch (err) {
        alert("マイクエラー: " + err.message);
      }
    };

    document.getElementById("btnClear").onclick = () => {
      timelineMatrix = [];
      drawMatrix();
    };

    // 厳密なピーク取得: 左右1ビンのみ探索し、隣接チャンネルの巻き込みを防止
    function getCleanPeak(dataArray, freq, binWidth) {
      const bin = Math.round(freq / binWidth);
      return Math.max(dataArray[bin - 1] || -999, dataArray[bin], dataArray[bin + 1] || -999);
    }

    function profileLoop() {
      if (!isListening) return;

      const dataArray = new Float32Array(analyser.frequencyBinCount);
      analyser.getFloatFrequencyData(dataArray);
      const binWidth = rxCtx.sampleRate / analyser.fftSize;
      const now = performance.now();

      const trigDb = getCleanPeak(dataArray, TRIGGER_FREQ, binWidth);
      const guardDb = getCleanPeak(dataArray, GUARD_FREQ, binWidth);

      if (!recording) {
        trigFloor = trigFloor * 0.98 + trigDb * 0.02;
        if (trigDb > Math.max(-95, trigFloor + 12) && (trigDb - guardDb) > 8) {
          trigConfirmCount++;
        } else {
          trigConfirmCount = 0;
        }

        if (trigConfirmCount >= 2) {
          trigConfirmCount = 0;
          recording = true;
          triggerTime = now;
          timelineMatrix = [];
          document.getElementById("rxStatus").textContent = `記録中... (0 / ${RECORD_WINDOW_MS} ms)`;
          appendLog(`トリガー検知! タイムラインプロファイル記録開始 (${trigDb.toFixed(1)} dB)`);
        }
      } else {
        const elapsed = now - triggerTime;
        if (elapsed <= RECORD_WINDOW_MS) {
          document.getElementById("rxStatus").textContent = `記録中... (${elapsed.toFixed(0)} / ${RECORD_WINDOW_MS} ms)`;
          
          // 43ch + Trig の44要素を記録
          const powers = new Float32Array(NUM_CH + 1);
          for (let i = 0; i < NUM_CH; i++) {
            powers[i] = getCleanPeak(dataArray, FREQS[i], binWidth);
          }
          powers[NUM_CH] = trigDb; // 最上段にトリガー

          timelineMatrix.push({ elapsed, powers });
        } else {
          recording = false;
          document.getElementById("rxStatus").textContent = "トリガー待機中 (記録完了)";
          appendLog(`記録完了 (${timelineMatrix.length} サンプル捕捉)。ヒートマップ描画。`);
          drawMatrix();
        }
      }

      requestAnimationFrame(profileLoop);
    }

    // --- ヒートマップ Canvas 描画 ---
    const canvas = document.getElementById("matrixCanvas");
    const ctx = canvas.getContext("2d");

    function drawMatrix() {
      const w = canvas.width;
      const h = canvas.height;
      ctx.fillStyle = "#050505";
      ctx.fillRect(0, 0, w, h);

      const rowH = h / (NUM_CH + 1);
      const slotMs = parseInt(document.getElementById("txSlotMs").value, 10);

      // グリッド線 (100ms 刻み)
      ctx.strokeStyle = "#222";
      for (let ms = 0; ms <= RECORD_WINDOW_MS; ms += 50) {
        const x = (ms / RECORD_WINDOW_MS) * w;
        ctx.beginPath();
        ctx.moveTo(x, 0); ctx.lineTo(x, h);
        ctx.stroke();
        if (ms % 100 === 0) {
          ctx.fillStyle = "#555";
          ctx.font = "9px monospace";
          ctx.fillText(`${ms}ms`, x + 2, h - 4);
        }
      }

      // 理論上の送信スロット枠（青枠）
      ctx.strokeStyle = "rgba(88, 166, 255, 0.4)";
      ctx.lineWidth = 1.5;
      const trigEndX = (90 / RECORD_WINDOW_MS) * w;
      const s1EndX = ((90 + slotMs) / RECORD_WINDOW_MS) * w;
      const s2EndX = ((90 + slotMs * 2) / RECORD_WINDOW_MS) * w;
      ctx.strokeRect(0, 0, trigEndX, h);
      ctx.strokeRect(trigEndX, 0, s1EndX - trigEndX, h);
      ctx.strokeRect(s1EndX, 0, s2EndX - s1EndX, h);

      // 行ラベル (CH番号)
      ctx.fillStyle = "#666";
      ctx.font = "8px monospace";
      for (let ch = 0; ch < NUM_CH; ch++) {
        const y = h - (ch + 1) * rowH;
        if (ch % 5 === 0) ctx.fillText(`C${ch}`, 2, y + rowH - 2);
      }
      ctx.fillText("TRG", 2, rowH - 2);

      if (timelineMatrix.length === 0) return;

      // セルのヒートマップ描画 (dB値に応じて 黒 -> 青 -> 緑 -> 黄 -> 赤)
      const sampleW = Math.max(2, w / timelineMatrix.length);

      timelineMatrix.forEach(entry => {
        const x = (entry.elapsed / RECORD_WINDOW_MS) * w;
        for (let row = 0; row <= NUM_CH; row++) {
          const db = entry.powers[row];
          const y = h - (row + 1) * rowH;

          // -100dB(フロア) 〜 -40dB(強入力) を 0.0〜1.0 に正規化
          const norm = Math.min(1.0, Math.max(0.0, (db + 100) / 60));
          if (norm > 0.15) {
            const hue = (1.0 - norm) * 240; // 青(240) -> 緑(120) -> 赤(0)
            ctx.fillStyle = `hsl(${hue}, 100%, ${norm * 50}%)`;
            ctx.fillRect(x, y, sampleW + 1, rowH - 1);
          }
        }
      });
    }
    drawMatrix();
  </script>
</body>
</html>
