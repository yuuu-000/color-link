<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>OTOSYN 1-Click Auto Calibrator</title>
  <style>
    :root {
      --bg: #090d16; --panel: #131b26; --border: #26354a;
      --text: #e2e8f0; --accent: #38bdf8; --green: #22c55e; --red: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg); color: var(--text);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      padding: 14px; max-width: 800px; margin: 0 auto; font-size: 0.85rem;
    }
    .card { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 14px; margin-bottom: 12px; }
    h2 { font-size: 0.95rem; color: var(--accent); margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
    .btn-main {
      width: 100%; background: #0284c7; color: #fff; border: none;
      border-radius: 6px; padding: 14px; font-weight: bold; cursor: pointer;
      font-size: 1rem; font-family: inherit; transition: background 0.2s;
    }
    .btn-main:hover { background: #0369a1; }
    .btn-main.running { background: #b91c1c; animation: pulse 1s infinite; cursor: wait; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 8px; margin-top: 10px; }
    .metric { background: #0b111a; border: 1px solid var(--border); border-radius: 6px; padding: 8px 10px; }
    .metric-val { font-size: 1.15rem; font-weight: bold; margin-top: 3px; color: #fff; }
    .metric-val.green { color: var(--green); }
    textarea {
      width: 100%; height: 110px; background: #05080e; border: 1px solid var(--border);
      border-radius: 6px; color: #4ade80; font-family: inherit; font-size: 0.72rem; padding: 8px; margin-top: 8px; resize: vertical;
    }
    button.copy {
      background: #1e293b; border: 1px solid var(--border); color: #fff;
      padding: 6px 12px; border-radius: 4px; font-family: inherit; font-size: 0.8rem; cursor: pointer; float: right;
    }
    button.copy:hover { background: #334155; }
    .progress-bar { width: 100%; height: 6px; background: #0b111a; border-radius: 3px; overflow: hidden; margin-top: 10px; }
    .progress-fill { height: 100%; width: 0%; background: var(--accent); transition: width 0.1s linear; }
  </style>
</head>
<body>

  <div class="card">
    <h2>
      <span>全自動 1-Click マイク診断 & パーソナライザー</span>
      <span id="badge" style="font-size:0.75rem; color:#94a3b8;">未実施</span>
    </h2>
    <div style="font-size:0.75rem; color:#94a3b8; margin-bottom:12px;">
      ボタンを押すと【マイク起動 → 暗騒音測定(1秒) → スイープ音発音・受音(高域減衰測定) → パルス応答(遅延測定) → JSON生成】が全自動で流れます。
    </div>
    <button id="btnStart" class="btn-main">ワンクリックで全テストを開始</button>
    <div class="progress-bar"><div id="pFill" class="progress-fill"></div></div>
    <div id="statusText" style="margin-top:6px; font-size:0.8rem; color:var(--accent);">待機中</div>
  </div>

  <div class="card">
    <h2>診断結果レポート</h2>
    <div class="grid">
      <div class="metric">
        <div style="font-size:0.7rem; color:#94a3b8;">環境暗騒音フロア</div>
        <div class="metric-val" id="mFloor">--</div>
      </div>
      <div class="metric">
        <div style="font-size:0.7rem; color:#94a3b8;">19k帯 感度減衰スロープ</div>
        <div class="metric-val green" id="mSlope">--</div>
      </div>
      <div class="metric">
        <div style="font-size:0.7rem; color:#94a3b8;">判定遅延オフセット</div>
        <div class="metric-val green" id="mOffset">--</div>
      </div>
      <div class="metric">
        <div style="font-size:0.7rem; color:#94a3b8;">端末受音ランク</div>
        <div class="metric-val" id="mRank">--</div>
      </div>
    </div>
  </div>

  <div class="card">
    <h2>
      <span>パーソナライズ Minify JSON</span>
      <button class="copy" id="btnCopy">JSONコピー</button>
    </h2>
    <textarea id="jsonOut" readonly placeholder="テスト完了後、ここに最適化されたMinify JSONが自動出力されます。"></textarea>
  </div>

  <script>
    "use strict";

    const NUM_CH = 43;
    const BASE_FREQ = 17500;
    const STEP_FREQ = 56;
    const TRIGGER_FREQ = 20200;
    const GUARD_FREQ = 20000;
    const FFT_SIZE = 2048;
    const FREQS = Array.from({ length: NUM_CH }, (_, i) => BASE_FREQ + i * STEP_FREQ);

    let audioCtx = null, analyser = null, micStream = null;
    const btnStart = document.getElementById("btnStart");
    const pFill = document.getElementById("pFill");
    const statusText = document.getElementById("statusText");
    const jsonOut = document.getElementById("jsonOut");

    function getStrictPeak(dataArray, freq, binWidth) {
      const bin = Math.round(freq / binWidth);
      return Math.max(dataArray[bin - 1] || -999, dataArray[bin], dataArray[bin + 1] || -999);
    }

    btnStart.onclick = async () => {
      btnStart.disabled = true;
      btnStart.className = "btn-main running";
      btnStart.textContent = "全自動テスト実行中...";

      try {
        // 1. Audio & マイク初期化
        statusText.textContent = "マイク初期化中...";
        pFill.style.width = "10%";
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === "suspended") await audioCtx.resume();

        micStream = await navigator.mediaDevices.getUserMedia({
          audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false, channelCount: 1 }
        });
        analyser = audioCtx.createAnalyser();
        analyser.fftSize = FFT_SIZE;
        analyser.smoothingTimeConstant = 0.0;
        audioCtx.createMediaStreamSource(micStream).connect(analyser);

        const binWidth = audioCtx.sampleRate / FFT_SIZE;

        // 2. 静寂測定 (暗騒音学習: 1000ms)
        statusText.textContent = "1/3: 暗騒音・環境ノイズ学習中 (1秒)...";
        pFill.style.width = "30%";
        const noiseFloors = await measureSilence(1000, binWidth);

        // 3. 高域スイープ発音 & 受音 (減衰測定: 1200ms)
        statusText.textContent = "2/3: スイープ発音中・高域減衰測定中...";
        pFill.style.width = "60%";
        const slopeDbKHz = await runSweepTest(1200, binWidth);

        // 4. パルス発音 & 到達遅延測定 (700ms)
        statusText.textContent = "3/3: パルス過渡応答・レイテンシ測定中...";
        pFill.style.width = "90%";
        const latencyOffsetMs = await runPulseTest(700, binWidth);

        // 5. 診断完了 & プロファイル生成
        pFill.style.width = "100%";
        statusText.textContent = "全診断完了!";
        btnStart.className = "btn-main";
        btnStart.disabled = false;
        btnStart.textContent = "ワンクリックで再テスト";
        document.getElementById("badge").textContent = "完了 (済)";
        document.getElementById("badge").style.color = "var(--green)";

        // 総合ランク判定
        const avgNoise = parseFloat((noiseFloors.reduce((a, b) => a + b, 0) / NUM_CH).toFixed(1));
        let rank = "A";
        if (slopeDbKHz > 5.0 || avgNoise > -85) rank = "C";
        else if (slopeDbKHz > 2.5 || avgNoise > -95) rank = "B";

        document.getElementById("mFloor").textContent = `${avgNoise} dB`;
        document.getElementById("mSlope").textContent = `-${slopeDbKHz.toFixed(1)} dB/kHz`;
        document.getElementById("mOffset").textContent = `${latencyOffsetMs >= 0 ? '+' : ''}${latencyOffsetMs} ms`;
        const mRank = document.getElementById("mRank");
        mRank.textContent = rank;
        mRank.className = `metric-val ${rank === 'A' ? 'green' : (rank === 'B' ? 'warn' : 'red')}`;

        // Minify JSON 生成 (tunedParams 内蔵)
        const minProfile = {
          d: { ua: navigator.userAgent, sr: audioCtx.sampleRate, bin: parseFloat(binWidth.toFixed(2)) },
          m: { floor: avgNoise, slope: slopeDbKHz, offset: latencyOffsetMs, rank: rank },
          tuned: {
            slotMs: 100,
            w1: [Math.round(70 + latencyOffsetMs), Math.round(160 + latencyOffsetMs)],
            w2: [Math.round(170 + latencyOffsetMs), Math.round(260 + latencyOffsetMs)],
            wCD: [Math.round(270 + latencyOffsetMs), Math.round(360 + latencyOffsetMs)],
            minDb: Math.round(-100 + (slopeDbKHz > 3 ? 4 : 0))
          },
          floorMap: noiseFloors
        };

        const jsonStr = JSON.stringify(minProfile);
        jsonOut.value = jsonStr;
        localStorage.setItem("otosyn_profile_auto", jsonStr);

      } catch (e) {
        alert("診断エラー: " + e.message);
        btnStart.className = "btn-main";
        btnStart.disabled = false;
        btnStart.textContent = "ワンクリックで全テストを開始";
        statusText.textContent = "エラー終了";
      }
    };

    // --- 測定サブルーチン 1: 暗騒音 ---
    function measureSilence(ms, binWidth) {
      return new Promise(resolve => {
        const start = performance.now();
        const accum = Array.from({ length: NUM_CH }, () => []);

        function loop() {
          const data = new Float32Array(analyser.frequencyBinCount);
          analyser.getFloatFrequencyData(data);
          for (let i = 0; i < NUM_CH; i++) accum[i].push(getStrictPeak(data, FREQS[i], binWidth));

          if (performance.now() - start < ms) {
            requestAnimationFrame(loop);
          } else {
            const mean = arr => arr.reduce((a, b) => a + b, 0) / (arr.length || 1);
            resolve(accum.map(s => parseFloat(mean(s).toFixed(1))));
          }
        }
        loop();
      });
    }

    // --- 測定サブルーチン 2: スイープ高域減衰 ---
    function runSweepTest(ms, binWidth) {
      return new Promise(resolve => {
        // 発音
        const now = audioCtx.currentTime + 0.03;
        const dur = (ms - 200) / 1000.0;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain); gain.connect(audioCtx.destination);

        osc.frequency.setValueAtTime(17300, now);
        osc.frequency.linearRampToValueAtTime(20500, now + dur);
        gain.gain.setValueAtTime(0, now);
        gain.gain.linearRampToValueAtTime(0.06, now + 0.02);
        gain.gain.setValueAtTime(0.06, now + dur - 0.02);
        gain.gain.linearRampToValueAtTime(0, now + dur);
        osc.start(now); osc.stop(now + dur + 0.05);

        // 受音記録
        const start = performance.now();
        const maxCh = new Float32Array(NUM_CH).fill(-999);

        function loop() {
          const data = new Float32Array(analyser.frequencyBinCount);
          analyser.getFloatFrequencyData(data);
          for (let i = 0; i < NUM_CH; i++) {
            const db = getStrictPeak(data, FREQS[i], binWidth);
            if (db > maxCh[i]) maxCh[i] = db;
          }

          if (performance.now() - start < ms) {
            requestAnimationFrame(loop);
          } else {
            const lowAvg = (maxCh[0] + maxCh[1] + maxCh[2]) / 3;
            const highAvg = (maxCh[40] + maxCh[41] + maxCh[42]) / 3;
            const deltaKHz = (19852 - 17500) / 1000;
            const slope = Math.max(0, (lowAvg - highAvg) / deltaKHz);
            resolve(parseFloat(slope.toFixed(2)));
          }
        }
        loop();
      });
    }

    // --- 測定サブルーチン 3: パルス応答レイテンシ ---
    function runPulseTest(ms, binWidth) {
      return new Promise(resolve => {
        // パルス発音 (Trig 20.2k 90ms + T1[4,14,24] 100ms)
        const now = audioCtx.currentTime + 0.03;
        const oscs = [audioCtx.createOscillator(), audioCtx.createOscillator(), audioCtx.createOscillator()];
        const gains = [audioCtx.createGain(), audioCtx.createGain(), audioCtx.createGain()];

        for (let i = 0; i < 3; i++) {
          oscs[i].connect(gains[i]);
          gains[i].connect(audioCtx.destination);
        }

        oscs[0].frequency.setValueAtTime(TRIGGER_FREQ, now);
        gains[0].gain.setValueAtTime(0, now);
        gains[0].gain.linearRampToValueAtTime(0.06, now + 0.005);
        gains[0].gain.setValueAtTime(0.06, now + 0.085);
        gains[0].gain.linearRampToValueAtTime(0, now + 0.09);

        const t1Ch = [4, 14, 24];
        for (let i = 0; i < 3; i++) {
          oscs[i].frequency.setValueAtTime(FREQS[t1Ch[i]], now + 0.09);
          gains[i].gain.setValueAtTime(0, now + 0.09);
          gains[i].gain.linearRampToValueAtTime(0.02, now + 0.095);
          gains[i].gain.setValueAtTime(0.02, now + 0.185);
          gains[i].gain.linearRampToValueAtTime(0, now + 0.19);
          oscs[i].start(now);
          oscs[i].stop(now + 0.22);
        }

        // 受音 & ピーク追跡
        let trigTime = 0, trigConfirmed = false, trigCnt = 0;
        const start = performance.now();
        const records = [];

        function loop() {
          const data = new Float32Array(analyser.frequencyBinCount);
          analyser.getFloatFrequencyData(data);
          const tNow = performance.now();

          const trigDb = getStrictPeak(data, TRIGGER_FREQ, binWidth);
          const guardDb = getStrictPeak(data, GUARD_FREQ, binWidth);

          if (!trigConfirmed) {
            if ((trigDb - guardDb) > 12 && trigDb > -90) trigCnt++;
            else trigCnt = 0;

            if (trigCnt >= 2) {
              trigConfirmed = true;
              trigTime = tNow;
            }
          } else {
            const elapsed = tNow - trigTime;
            const powerT1 = getStrictPeak(data, FREQS[4], binWidth) + getStrictPeak(data, FREQS[14], binWidth) + getStrictPeak(data, FREQS[24], binWidth);
            records.push({ elapsed, powerT1 });
          }

          if (tNow - start < ms) {
            requestAnimationFrame(loop);
          } else {
            if (records.length > 0) {
              records.sort((a, b) => b.powerT1 - a.powerT1);
              // 理論極大 (90ms + 50ms = 140ms) からのオフセット
              const offset = Math.round(records[0].elapsed - 140);
              resolve(offset);
            } else {
              resolve(0);
            }
          }
        }
        loop();
      });
    }

    // コピー
    document.getElementById("btnCopy").onclick = () => {
      if (!jsonOut.value) return;
      navigator.clipboard.writeText(jsonOut.value).then(() => {
        const b = document.getElementById("btnCopy");
        b.textContent = "コピー完了!";
        setTimeout(() => b.textContent = "JSONコピー", 1500);
      });
    };
  </script>
</body>
</html>
