<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>CUE-X | 100M ID Ultrasonic Protocol</title>
  <style>
    :root {
      --bg: #050507;
      --panel: #121216;
      --panel-border: #23232b;
      --accent: #00f0ff;
      --accent-hover: #33f3ff;
      --accent-glow: rgba(0, 240, 255, 0.25);
      --text-main: #f1f5f9;
      --text-sub: #94a3b8;
      --radius: 12px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body, html { height: 100%; font-family: 'Inter', system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text-main); overflow: hidden; }

    .app-container { display: flex; flex-direction: column; height: 100dvh; }

    /* Header */
    header { background: rgba(5, 5, 7, 0.9); backdrop-filter: blur(16px); border-bottom: 1px solid var(--panel-border); padding: 14px 24px; display: flex; justify-content: space-between; align-items: center; z-index: 100; }
    .brand { font-size: 18px; font-weight: 800; letter-spacing: 2px; display: flex; align-items: center; gap: 8px; }
    .brand span { color: var(--accent); text-shadow: 0 0 12px var(--accent-glow); }
    .badge { background: rgba(0, 240, 255, 0.08); color: var(--accent); border: 1px solid rgba(0, 240, 255, 0.3); padding: 5px 10px; border-radius: 20px; font-size: 10px; font-weight: 700; letter-spacing: 1px; }

    /* Layout */
    .split-layout { display: flex; flex: 1; flex-direction: column; overflow: hidden; }
    @media (min-width: 900px) { .split-layout { flex-direction: row; } }

    /* TX Panel (送信機) */
    .tx-area { flex: 1.3; padding: 20px; overflow-y: auto; border-right: 1px solid var(--panel-border); background: var(--panel); scrollbar-width: thin; scrollbar-color: var(--panel-border) transparent; }
    .tx-area h2 { font-size: 12px; color: var(--text-sub); text-transform: uppercase; letter-spacing: 2px; margin-bottom: 16px; font-weight: 700; display: flex; justify-content: space-between; align-items: center; }

    .preset-group { margin-bottom: 24px; }
    .preset-group-title { font-size: 11px; color: var(--accent); margin-bottom: 12px; font-weight: 800; letter-spacing: 1.5px; display: flex; align-items: center; gap: 8px; }
    .preset-group-title::after { content: ""; flex: 1; height: 1px; background: var(--panel-border); }

    .btn-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }

    .tx-btn { background: #1a1a22; border: 1px solid var(--panel-border); color: var(--text-main); padding: 14px 12px; border-radius: var(--radius); cursor: pointer; transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); display: flex; flex-direction: column; align-items: flex-start; text-align: left; position: relative; overflow: hidden; }
    .tx-btn:hover { border-color: var(--accent); background: #22222f; box-shadow: 0 4px 20px var(--accent-glow); transform: translateY(-2px); }
    .tx-btn:active { transform: translateY(0); filter: brightness(0.9); }

    .tx-btn .id-label { font-family: ui-monospace, SFMono-Regular, monospace; font-size: 9px; color: var(--text-sub); margin-bottom: 6px; font-weight: 700; z-index: 2; background: rgba(0,0,0,0.4); padding: 2px 6px; border-radius: 4px; }
    .tx-btn .name-label { font-size: 13px; font-weight: 700; line-height: 1.35; z-index: 2; color: #ffffff; text-shadow: 0 1px 2px rgba(0,0,0,0.8); }

    /* RX Panel (受信機) */
    .rx-area { flex: 1; display: flex; flex-direction: column; background: #000; position: relative; }

    .rx-hud { position: absolute; top: 0; left: 0; right: 0; padding: 16px; z-index: 10; display: flex; flex-direction: column; gap: 10px; pointer-events: none; }
    .rx-card { background: rgba(12, 12, 16, 0.88); backdrop-filter: blur(16px); border: 1px solid rgba(255,255,255,0.12); border-radius: 16px; padding: 16px; pointer-events: auto; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }

    .rx-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; gap: 8px; flex-wrap: wrap; }
    .btn-group { display: flex; gap: 8px; }

    #rxStartBtn, #rxFullscreenBtn { padding: 10px 18px; border-radius: 24px; font-weight: 800; font-size: 11px; cursor: pointer; transition: all 0.2s; letter-spacing: 0.5px; border: none; }
    #rxStartBtn { background: var(--accent); color: #000; box-shadow: 0 0 15px var(--accent-glow); }
    #rxStartBtn:hover { background: var(--accent-hover); box-shadow: 0 0 25px var(--accent-glow); }

    #rxFullscreenBtn { background: #272730; color: #f1f5f9; border: 1px solid rgba(255,255,255,0.1); }
    #rxFullscreenBtn:hover { background: #353542; color: #fff; border-color: rgba(255,255,255,0.3); }

    .rx-status { font-family: ui-monospace, monospace; font-size: 11px; color: var(--text-sub); display: flex; flex-direction: column; gap: 4px; text-align: right;}
    .rx-status span { color: #fff; font-weight: bold; }

    .slot-monitor { display: flex; gap: 8px; margin-top: 10px; }
    .slot { flex: 1; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); border-radius: 8px; padding: 8px 0; text-align: center; font-family: ui-monospace, monospace; font-size: 11px; font-weight: bold; color: var(--text-sub); transition: 0.2s; }
    .slot.active { background: rgba(0, 240, 255, 0.2); color: #fff; border-color: var(--accent); box-shadow: 0 0 10px var(--accent-glow); }

    /* 演出ターゲット描画エリア */
    #rxCanvas { flex: 1; display: flex; align-items: center; justify-content: center; flex-direction: column; transition: background-color 0.15s ease; position: relative; overflow: hidden; z-index: 1; }
    .target-title { font-size: clamp(28px, 6vw, 48px); font-weight: 900; color: #fff; text-shadow: 0 4px 24px rgba(0,0,0,0.9); z-index: 2; text-align: center; line-height: 1.15; padding: 0 20px; }
    .target-id { font-family: ui-monospace, monospace; font-size: 14px; color: rgba(255,255,255,0.8); margin-top: 12px; letter-spacing: 2px; z-index: 2; background: rgba(0,0,0,0.5); padding: 4px 12px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.15); }

    /* リアルタイム受信グラフ（17kHz〜20.5kHz専用スペクトラム） */
    #spectrumCanvas { position: absolute; bottom: 0; left: 0; width: 100%; height: 110px; z-index: 3; pointer-events: none; opacity: 0.85; }

    /* TX送信中のプログレスバー */
    #txProgress { position: fixed; top: 0; left: 0; height: 3px; background: var(--accent); width: 0%; z-index: 1000; box-shadow: 0 0 10px var(--accent); transition: width 0.1s linear; }
  </style>
</head>
<body>
  <div id="txProgress"></div>
  <div class="app-container">
    <header>
      <div class="brand">CUE-X <span>PRO</span></div>
      <div class="badge">MAX ID: 100,544,625</div>
    </header>

    <div class="split-layout">
      <div class="tx-area">
        <h2><span>Transmitter Console</span><span>UI v2.5</span></h2>
        <div id="txPresets"></div>
      </div>

      <div class="rx-area" id="rxAreaContainer">
        <div class="rx-hud">
          <div class="rx-card">
            <div class="rx-header">
              <div class="btn-group">
                <button id="rxStartBtn">MIC CONNECT</button>
                <button id="rxFullscreenBtn">FULLSCREEN</button>
              </div>
              <div class="rx-status">
                <div>STATE: <span id="rxState" style="color: var(--text-sub);">OFFLINE</span></div>
                <div>T-PEAK: <span id="rxPeak">--</span> dB</div>
              </div>
            </div>
            <div style="font-size: 10px; color: var(--text-sub); margin-bottom: 4px; font-weight: 700; letter-spacing: 0.5px;">DECODE MONITOR (465³ PROTOCOL)</div>
            <div class="slot-monitor">
              <div class="slot" id="slot1">S1: ---</div>
              <div class="slot" id="slot2">S2: ---</div>
              <div class="slot" id="slot3">S3: ---</div>
            </div>
          </div>
        </div>

        <div id="rxCanvas">
          <div class="target-title" id="rxTitle">STANDBY</div>
          <div class="target-id" id="rxSub">Waiting for signal...</div>
          <canvas id="spectrumCanvas"></canvas>
        </div>
      </div>
    </div>
  </div>

  <script>
    // =========================================================================
    // 1. 次世代1億ID プロトコル定義 (31-Freq Dual-Tone x 3 Slots)
    // =========================================================================
    const FREQ_TRIGGER = 20500;
    const FREQ_DATA = [];
    for(let i = 0; i < 31; i++) {
      FREQ_DATA.push(17300 + (i * 100));
    }

    const PAIRS = [];
    for(let i = 0; i < 31; i++) {
      for(let j = i + 1; j < 31; j++) {
        PAIRS.push([i, j]);
      }
    }

    const TIME_START = 0.15;
    const TIME_SLOT  = 0.12;
    const THRESHOLD  = -90;

    // =========================================================================
    // 2. 高度な演出プリセット (CUE_DATA)
    // =========================================================================
    const CUE_DATA = {
      "0": { cat: "SOLID", name: "BLACKOUT", color: "#050505", ms: 0 },
      "1": { cat: "SOLID", name: "MIDNIGHT NAVY", color: "#0B132B", ms: 0 },
      "2": { cat: "SOLID", name: "DEEP CRIMSON", color: "#780000", ms: 0 },
      "3": { cat: "SOLID", name: "PURE RED", color: "#FF0033", ms: 0 },
      "4": { cat: "SOLID", name: "VIVID CORAL", color: "#FF5964", ms: 0 },
      "5": { cat: "SOLID", name: "BURNT ORANGE", color: "#E05306", ms: 0 },
      "6": { cat: "SOLID", name: "CYBER ORANGE", color: "#FF6600", ms: 0 },
      "7": { cat: "SOLID", name: "SUNBURST YELLOW", color: "#FFB703", ms: 0 },
      "8": { cat: "SOLID", name: "ELECTRIC YELLOW", color: "#CCFF00", ms: 0 },
      "9": { cat: "SOLID", name: "LIME SPARK", color: "#38B000", ms: 0 },
      "10": { cat: "SOLID", name: "LASER LIME", color: "#39FF14", ms: 0 },
      "11": { cat: "SOLID", name: "TOXIC GREEN", color: "#00FF66", ms: 0 },
      "12": { cat: "SOLID", name: "EMERALD GLOW", color: "#028090", ms: 0 },
      "13": { cat: "SOLID", name: "MINT BREEZE", color: "#00F5D4", ms: 0 },
      "14": { cat: "SOLID", name: "ICE BLUE", color: "#A5FFF6", ms: 0 },
      "15": { cat: "SOLID", name: "NEON CYAN", color: "#00F0FF", ms: 0 },
      "16": { cat: "SOLID", name: "SKY BLUE", color: "#0077B6", ms: 0 },
      "17": { cat: "SOLID", name: "ROYAL BLUE", color: "#1D3557", ms: 0 },
      "18": { cat: "SOLID", name: "ELECTRIC BLUE", color: "#0055FF", ms: 0 },
      "19": { cat: "SOLID", name: "DEEP INDIGO", color: "#3A0CA3", ms: 0 },
      "20": { cat: "SOLID", name: "ULTRA VIOLET", color: "#7209B7", ms: 0 },
      "21": { cat: "SOLID", name: "VIVID PURPLE", color: "#B5179E", ms: 0 },
      "22": { cat: "SOLID", name: "HOT MAGENTA", color: "#F72585", ms: 0 },
      "23": { cat: "SOLID", name: "PLASMA PINK", color: "#FF1493", ms: 0 },
      "24": { cat: "SOLID", name: "ROSE BLUSH", color: "#FF70A6", ms: 0 },
      "25": { cat: "SOLID", name: "PLATINUM WHITE", color: "#F8FAFC", ms: 0 },

      "1000": { cat: "FADE", name: "SUNSET (Orange 3s)", color: "#FF5500", ms: 3000 },
      "1001": { cat: "FADE", name: "DEEP OCEAN (Blue 5s)", color: "#001144", ms: 5000 },
      "1002": { cat: "FADE", name: "AURORA BOREALIS (Green 4s)", color: "#00FF66", ms: 4000 },
      "1003": { cat: "FADE", name: "NEON MIDNIGHT (Purple 2s)", color: "#9400D3", ms: 2000 },
      "1004": { cat: "FADE", name: "SOLAR FLARE (Gold 1.5s)", color: "#FFD700", ms: 1500 },
      "1005": { cat: "FADE", name: "BLOOD MOON (Crimson 3.5s)", color: "#DC143C", ms: 3500 },
      "1006": { cat: "FADE", name: "NEON PULSE SWEEP (2s)", color: "#FF00FF", ms: 2000 },
      "1007": { cat: "FADE", name: "ACID WASH (Green/Cyan 2.5s)", color: "#00FFCC", ms: 2500 },
      "1008": { cat: "FADE", name: "VELVET DUSK (Violet 4s)", color: "#8A2BE2", ms: 4000 },
      "1009": { cat: "FADE", name: "FIREWALK (Orange/Red 3s)", color: "#FF4500", ms: 3000 },

      "50000": { cat: "FLASH", name: "CRAZY STROBE (20Hz)", color: "#FFFFFF", ms: 0, strobe: 20 },
      "50001": { cat: "FLASH", name: "WARNING (Red/Blk)", color: "#FF0000", ms: 0, strobe: 8 },
      "50002": { cat: "FLASH", name: "HYPER BLITZ (30Hz)", color: "#E0FFFF", ms: 0, strobe: 30 },
      "50003": { cat: "FLASH", name: "ACID PULSE (12Hz Green)", color: "#39FF14", ms: 0, strobe: 12 },
      "50004": { cat: "FLASH", name: "GLITCH STROBE (Random 15Hz)", color: "#FF00FF", ms: 0, strobe: 15 },
      "50005": { cat: "FLASH", name: "SUB-BASS BLINK (4Hz)", color: "#0055FF", ms: 0, strobe: 4 },
      "50006": { cat: "FLASH", name: "BLINDING WHITE (50Hz)", color: "#FFFFFF", ms: 0, strobe: 50 },
      "50007": { cat: "FLASH", name: "CYBER PULSE (10Hz Cyan)", color: "#00FFFF", ms: 0, strobe: 10 },
      "50008": { cat: "FLASH", name: "HELLFIRE STROBE (18Hz Orange)", color: "#FF4500", ms: 0, strobe: 18 },
      "50009": { cat: "FLASH", name: "ULTRA HZ RAVE (40Hz)", color: "#FFFFFF", ms: 0, strobe: 40 },

      "70000": { cat: "LASER", name: "CYBER LASER BEAM", color: "#00FFFF", ms: 100, strobe: 10 },
      "70001": { cat: "LASER", name: "PLASMA CUTTER", color: "#FF0055", ms: 80, strobe: 20 },
      "70002": { cat: "LASER", name: "QUANTUM GRID", color: "#39FF14", ms: 150 },
      "70003": { cat: "LASER", name: "SINGULARITY BEAM", color: "#8A2BE2", ms: 200, strobe: 15 },
      "70004": { cat: "LASER", name: "ION BEAM SWEEP", color: "#00BFFF", ms: 300 },

      "1000000": { cat: "HAPTIC", name: "HEAVY DROP (Flash+Vib)", color: "#FFFFFF", ms: 50, vibrate: [300, 100, 300] },
      "1000001": { cat: "HAPTIC", name: "SUB-BASS RUMBLE", color: "#0055FF", ms: 100, vibrate: [600, 200, 400] },
      "1000002": { cat: "HAPTIC", name: "MACHINE GUN SHOT", color: "#FF0000", ms: 20, vibrate: [50, 50, 50, 50, 50] },
      "1000003": { cat: "HAPTIC", name: "ELECTRIC SHOCK", color: "#00FFFF", ms: 80, vibrate: [100, 50, 150, 50, 300] },
      "1000004": { cat: "HAPTIC", name: "HEARTBEAT DROP", color: "#FF007F", ms: 150, vibrate: [200, 100, 200, 300] },

      "100544624": { cat: "MAXIMUM", name: "ULTIMATE MAX ID", color: "#FF00FF", ms: 200, vibrate: [500] },
      "100544625": { cat: "MAXIMUM", name: "APOCALYPSE SYNC", color: "#FF4500", ms: 500, strobe: 40, vibrate: [400, 200, 800] },
      "100544626": { cat: "MAXIMUM", name: "CYBERPUNK OVERDRIVE", color: "#00FFFF", ms: 300, strobe: 25, vibrate: [300, 100, 300, 100, 500] },
      "100544627": { cat: "MAXIMUM", name: "SUPERNOVA CLIMAX", color: "#FFFFFF", ms: 400, strobe: 50, vibrate: [700, 300, 700] },
      "100544628": { cat: "MAXIMUM", name: "OMEGA DROP RAVE", color: "#39FF14", ms: 350, strobe: 30, vibrate: [500, 100, 500, 200, 900] }
    };

    // =========================================================================
    // 3. 送信エンジン (Transmitter)
    // =========================================================================
    let txCtx = null;
    function initTx() { if (!txCtx) txCtx = new (window.AudioContext || window.webkitAudioContext)(); }

    function sendTrigger(idStr) {
      initTx();
      const now = txCtx.currentTime;
      const id = parseInt(idStr, 10);

      const base1 = 465 * 465;
      const base2 = 465;

      const val1 = Math.floor(id / base1);
      const rem1 = id % base1;
      const val2 = Math.floor(rem1 / base2);
      const val3 = rem1 % base2;

      const p1 = PAIRS[val1];
      const p2 = PAIRS[val2];
      const p3 = PAIRS[val3];

      const oscA = txCtx.createOscillator();
      const oscB = txCtx.createOscillator();
      const gainA = txCtx.createGain();
      const gainB = txCtx.createGain();
      oscA.connect(gainA).connect(txCtx.destination);
      oscB.connect(gainB).connect(txCtx.destination);

      const MAX_GAIN = 0.25;

      const scheduleSlot = (pair, startTime, duration) => {
        if(!pair) return;
        oscA.frequency.setValueAtTime(FREQ_DATA[pair[0]], startTime);
        oscB.frequency.setValueAtTime(FREQ_DATA[pair[1]], startTime);
      };

      const applyEnvelope = (start, duration) => {
        gainA.gain.setValueAtTime(0, start);
        gainB.gain.setValueAtTime(0, start);
        gainA.gain.linearRampToValueAtTime(MAX_GAIN, start + 0.015);
        gainB.gain.linearRampToValueAtTime(MAX_GAIN, start + 0.015);
        gainA.gain.setValueAtTime(MAX_GAIN, start + duration - 0.015);
        gainB.gain.setValueAtTime(MAX_GAIN, start + duration - 0.015);
        gainA.gain.linearRampToValueAtTime(0, start + duration);
        gainB.gain.linearRampToValueAtTime(0, start + duration);
      };

      let t = now;
      oscA.frequency.setValueAtTime(FREQ_TRIGGER, t);
      gainA.gain.setValueAtTime(0, t);
      gainA.gain.linearRampToValueAtTime(MAX_GAIN, t + 0.02);
      gainA.gain.setValueAtTime(MAX_GAIN, t + TIME_START - 0.02);
      gainA.gain.linearRampToValueAtTime(0, t + TIME_START);
      gainB.gain.setValueAtTime(0, t);

      t += TIME_START;

      const slots = [p1, p2, p3];
      for(let i=0; i<3; i++) {
        scheduleSlot(slots[i], t, TIME_SLOT);
        applyEnvelope(t, TIME_SLOT);
        t += TIME_SLOT;
      }

      oscA.start(now); oscA.stop(t + 0.1);
      oscB.start(now); oscB.stop(t + 0.1);

      const bar = document.getElementById("txProgress");
      bar.style.transition = "none"; bar.style.width = "0%";
      setTimeout(() => {
        bar.style.transition = `width ${(t - now)}s linear`;
        bar.style.width = "100%";
        setTimeout(() => { bar.style.opacity = 0; setTimeout(()=> { bar.style.width = "0%"; bar.style.opacity = 1; }, 200); }, (t-now)*1000);
      }, 10);
    }

    // UIボタン生成
    const txContainer = document.getElementById("txPresets");
    const categories = {};
    Object.keys(CUE_DATA).forEach(id => {
      const cat = CUE_DATA[id].cat;
      if(!categories[cat]) categories[cat] = [];
      categories[cat].push(id);
    });

    for(const cat in categories) {
      const grp = document.createElement('div');
      grp.className = "preset-group";
      grp.innerHTML = `<div class="preset-group-title">${cat}</div>`;
      const grid = document.createElement('div');
      grid.className = "btn-grid";

      categories[cat].forEach(id => {
        const cue = CUE_DATA[id];
        const btn = document.createElement("button");
        btn.className = "tx-btn";

        if (cat === "SOLID") {
          btn.style.background = `linear-gradient(135deg, ${cue.color}33 0%, #16161c 70%)`;
          btn.style.borderLeft = `3px solid ${cue.color}`;
        }

        btn.innerHTML = `<div class="id-label">ID: ${id.replace(/\B(?=(\d{3})+(?!\d))/g, ",")}</div><div class="name-label">${cue.name}</div>`;
        btn.onclick = () => sendTrigger(id);
        grid.appendChild(btn);
      });
      grp.appendChild(grid);
      txContainer.appendChild(grp);
    }

    // =========================================================================
    // 4. 受信エンジン (Receiver) & 17kHz-20.5kHz リアルタイムスペクトラムグラフ
    // =========================================================================
    let rxCtx, analyser, dataArray;
    let rxState = "IDLE";
    let rxStartTime = 0;
    let decodedValues = [];
    let strobeInterval = null;

    const spectrumCanvas = document.getElementById("spectrumCanvas");
    const specCtx = spectrumCanvas.getContext("2d");

    function getMagnitude(freq, nyquist, bufferLength) {
      const bin = Math.round((freq / nyquist) * bufferLength);
      return Math.max(dataArray[bin-1]||-999, dataArray[bin], dataArray[bin+1]||-999);
    }

    const UI_STATE = (msg, color) => {
      const el = document.getElementById("rxState");
      el.innerText = msg; el.style.color = color;
    };

    const UI_SLOT = (idx, val, active=false) => {
      const el = document.getElementById(`slot${idx}`);
      if(val !== null) el.innerText = `S${idx}: ${val.toString().padStart(3,'0')}`;
      if(active) el.classList.add('active'); else el.classList.remove('active');
    };

    document.getElementById("rxStartBtn").onclick = async () => {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false } });
        rxCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (rxCtx.state === "suspended") await rxCtx.resume();
        const source = rxCtx.createMediaStreamSource(stream);
        analyser = rxCtx.createAnalyser();
        analyser.fftSize = 4096;
        analyser.smoothingTimeConstant = 0.2; // 少し滑らかに
        source.connect(analyser);
        dataArray = new Float32Array(analyser.frequencyBinCount);

        UI_STATE("LISTENING", "var(--accent)");
        document.getElementById("rxStartBtn").style.display = "none";
        requestAnimationFrame(rxLoop);
      } catch(e) { alert("マイクへのアクセスが拒否されました。"); }
    };

    document.getElementById("rxFullscreenBtn").onclick = () => {
      const elem = document.getElementById("rxAreaContainer");
      if (!document.fullscreenElement) {
        if (elem.requestFullscreen) elem.requestFullscreen();
        else if (elem.webkitRequestFullscreen) elem.webkitRequestFullscreen();
      } else {
        if (document.exitFullscreen) document.exitFullscreen();
        else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
      }
    };

    function drawSpectrum() {
      if (!analyser || !rxCtx) return;

      // キャンバスの解像度を画面サイズに合わせる
      if (spectrumCanvas.width !== spectrumCanvas.clientWidth || spectrumCanvas.height !== spectrumCanvas.clientHeight) {
        spectrumCanvas.width = spectrumCanvas.clientWidth;
        spectrumCanvas.height = spectrumCanvas.clientHeight;
      }

      const width = spectrumCanvas.width;
      const height = spectrumCanvas.height;
      specCtx.clearRect(0, 0, width, height);

      const nyquist = rxCtx.sampleRate / 2;
      const bufferLength = analyser.frequencyBinCount;

      // 描画範囲: 17,000Hz 〜 20,600Hz
      const minFreq = 17000;
      const maxFreq = 20600;

      const minBin = Math.floor((minFreq / nyquist) * bufferLength);
      const maxBin = Math.floor((maxFreq / nyquist) * bufferLength);
      const totalBins = maxBin - minBin;

      if (totalBins <= 0) return;

      const barWidth = width / totalBins;

      // グリッド線の描画 (背景にうっすらと)
      specCtx.strokeStyle = "rgba(255, 255, 255, 0.05)";
      specCtx.lineWidth = 1;
      [17300, 18300, 19300, 20300, FREQ_TRIGGER].forEach(f => {
        const x = ((f - minFreq) / (maxFreq - minFreq)) * width;
        specCtx.beginPath();
        specCtx.moveTo(x, 0);
        specCtx.lineTo(x, height);
        specCtx.stroke();
      });

      // スペクトラムバーの描画
      for (let i = 0; i < totalBins; i++) {
        const binIdx = minBin + i;
        const db = dataArray[binIdx]; // -dB値 (-100 〜 0 付近)

        // dB値を高さ（0.0 〜 1.0）に変換 (-100dBを底辺、-20dBを天井とする)
        let normHeight = (db + 100) / 70;
        normHeight = Math.max(0, Math.min(1, normHeight));

        const barHeight = normHeight * height;
        const x = i * barWidth;
        const y = height - barHeight;

        // カラーグラデーション（高音・トリガー付近ほどシアンからマゼンタ/レッドへ変化）
        const currentFreq = minFreq + (i / totalBins) * (maxFreq - minFreq);
        let grad = specCtx.createLinearGradient(0, height, 0, 0);

        if (Math.abs(currentFreq - FREQ_TRIGGER) < 100) {
          grad.addColorStop(0, "rgba(239, 68, 68, 0.2)");
          grad.addColorStop(1, "rgba(239, 68, 68, 0.9)"); // トリガー周波数は赤色系
        } else {
          grad.addColorStop(0, "rgba(0, 240, 255, 0.1)");
          grad.addColorStop(1, "rgba(0, 240, 255, 0.8)"); // 通常データはシアン系
        }

        specCtx.fillStyle = grad;
        specCtx.fillRect(x, y, Math.max(1, barWidth - 0.5), barHeight);
      }

      // 周波数ラベルの簡易描画
      specCtx.fillStyle = "rgba(255, 255, 255, 0.4)";
      specCtx.font = "9px ui-monospace, monospace";
      specCtx.fillText("17kHz", 4, height - 6);
      specCtx.fillText("18.5kHz", width * 0.42, height - 6);
      specCtx.fillText("20.5kHz(Trg)", width - 75, height - 6);
    }

    function rxLoop() {
      analyser.getFloatFrequencyData(dataArray);
      const nyquist = rxCtx.sampleRate / 2;
      const bufferLength = analyser.frequencyBinCount;
      const now = performance.now();

      const magTrigger = getMagnitude(FREQ_TRIGGER, nyquist, bufferLength);
      document.getElementById("rxPeak").innerText = magTrigger > -100 ? magTrigger.toFixed(0) : "--";

      // リアルタイムスペクトラム描画を実行
      drawSpectrum();

      if (rxState === "IDLE") {
        if (magTrigger > THRESHOLD) {
          rxState = "READING";
          rxStartTime = now;
          decodedValues = [];
          UI_STATE("DECODING...", "#ffeb3b");
          UI_SLOT(1, "---"); UI_SLOT(2, "---"); UI_SLOT(3, "---");
        }
      }
      else if (rxState === "READING") {
        const elapsed = (now - rxStartTime) / 1000;

        if (elapsed > TIME_START && elapsed < TIME_START + (TIME_SLOT * 3)) {
          const slotIndex = Math.floor((elapsed - TIME_START) / TIME_SLOT);
          const timeOffset = (elapsed - TIME_START) % TIME_SLOT;

          [1,2,3].forEach(i => document.getElementById(`slot${i}`).classList.remove('active'));
          document.getElementById(`slot${slotIndex+1}`).classList.add('active');

          if (decodedValues.length === slotIndex && timeOffset > (TIME_SLOT * 0.4) && timeOffset < (TIME_SLOT * 0.6)) {
            let results = [];
            for(let i=0; i<31; i++) {
              results.push({ idx: i, mag: getMagnitude(FREQ_DATA[i], nyquist, bufferLength) });
            }
            results.sort((a, b) => b.mag - a.mag);

            const top1 = results[0];
            const top2 = results[1];

            if(top1.mag > THRESHOLD && top2.mag > -95) {
              const idxA = Math.min(top1.idx, top2.idx);
              const idxB = Math.max(top1.idx, top2.idx);

              let val = PAIRS.findIndex(p => p[0] === idxA && p[1] === idxB);
              if(val !== -1) {
                decodedValues.push(val);
                UI_SLOT(slotIndex + 1, val);
              }
            }
          }
        }
        else if (elapsed >= TIME_START + (TIME_SLOT * 3)) {
          [1,2,3].forEach(i => document.getElementById(`slot${i}`).classList.remove('active'));

          if (decodedValues.length === 3) {
            const v1 = decodedValues[0];
            const v2 = decodedValues[1];
            const v3 = decodedValues[2];
            const base1 = 465 * 465;
            const base2 = 465;
            const finalId = (v1 * base1) + (v2 * base2) + v3;

            executeCue(finalId.toString());
          }

          rxState = "IDLE";
          UI_STATE("LISTENING", "var(--accent)");
        }
      }
      requestAnimationFrame(rxLoop);
    }

    // =========================================================================
    // 5. ローカルレンダリング (Execution)
    // =========================================================================
    function executeCue(id) {
      const cue = CUE_DATA[id];
      const canvas = document.getElementById("rxCanvas");
      const title = document.getElementById("rxTitle");
      const sub = document.getElementById("rxSub");

      if(strobeInterval) { clearInterval(strobeInterval); strobeInterval = null; }

      if (!cue) {
        title.innerText = "UNKNOWN";
        sub.innerText = `ID: ${id}`;
        return;
      }

      title.innerText = cue.name;
      sub.innerText = `ID: ${id.replace(/\B(?=(\d{3})+(?!\d))/g, ",")}`;

      canvas.style.transition = `background-color ${cue.ms}ms ease`;
      canvas.style.backgroundColor = cue.color;

      if (cue.vibrate && navigator.vibrate) navigator.vibrate(cue.vibrate);

      if (cue.strobe) {
        let toggle = true;
        strobeInterval = setInterval(() => {
          canvas.style.transition = 'none';
          canvas.style.backgroundColor = toggle ? cue.color : "#000000";
          toggle = !toggle;
        }, 1000 / cue.strobe);
      }
    }
  </script>
