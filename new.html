<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>CUE-X | Character Protocol Engine (Optimized v2)</title>
  <style>
    :root {
      --bg: #050507;
      --panel: #121216;
      --panel-border: #23232b;
      --accent: #fd5;
      --accent-hover: rgb(246, 222, 125);
      --accent-glow: rgba(0, 240, 255, 0.25);
      --text-main: #f1f5f9;
      --text-sub: #94a3b8;
      --radius: 12px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body, html { height: 100%; font-family: 'Inter', system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text-main); overflow: hidden; }

    .app-container { display: flex; flex-direction: column; height: 100dvh; }

    header { background: rgba(5, 5, 7, 0.9); backdrop-filter: blur(16px); border-bottom: 1px solid var(--panel-border); padding: 14px 24px; display: flex; justify-content: space-between; align-items: center; z-index: 100; }
    .brand { font-size: 18px; font-weight: 800; letter-spacing: 2px; display: flex; align-items: center; gap: 8px; }
    .brand span { color: var(--accent); text-shadow: 0 0 12px var(--accent-glow); }
    .badge { background: rgba(0, 240, 255, 0.08); color: var(--accent); border: 1px solid rgba(0, 240, 255, 0.3); padding: 5px 10px; border-radius: 20px; font-size: 10px; font-weight: 700; letter-spacing: 1px; }

    .split-layout { display: flex; flex: 1; flex-direction: column; overflow: hidden; }
    @media (min-width: 900px) { .split-layout { flex-direction: row; } }

    .tx-area { flex: 1.3; padding: 20px; overflow-y: auto; border-right: 1px solid var(--panel-border); background: var(--panel); scrollbar-width: thin; scrollbar-color: var(--panel-border) transparent; display: flex; flex-direction: column; gap: 20px; }
    .tx-area h2 { font-size: 12px; color: var(--text-sub); text-transform: uppercase; letter-spacing: 2px; font-weight: 700; display: flex; justify-content: space-between; align-items: center; }

    .control-box { background: #1a1a22; border: 1px solid var(--panel-border); border-radius: var(--radius); padding: 16px; display: flex; flex-direction: column; gap: 12px; }
    .control-box h3 { font-size: 11px; color: var(--accent); letter-spacing: 1px; font-weight: 800; text-transform: uppercase; }
    .control-row { display: flex; gap: 10px; align-items: center; }

    input[type="color"] { -webkit-appearance: none; border: none; width: 44px; height: 44px; border-radius: 8px; cursor: pointer; background: none; }
    input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
    input[type="color"]::-webkit-color-swatch { border: 1px solid var(--panel-border); border-radius: 8px; }

    input[type="text"] { flex: 1; background: #0f0f13; border: 1px solid var(--panel-border); border-radius: 8px; padding: 10px 14px; color: #fff; font-size: 13px; font-family: inherit; outline: none; transition: 0.2s; }
    input[type="text"]:focus { border-color: var(--accent); box-shadow: 0 0 10px var(--accent-glow); }

    .action-btn { background: var(--accent); color: #000; border: none; font-weight: 800; padding: 10px 18px; border-radius: 8px; cursor: pointer; transition: 0.2s; font-size: 12px; box-shadow: 0 0 15px var(--accent-glow); white-space: nowrap; }
    .action-btn:hover { background: var(--accent-hover); box-shadow: 0 0 25px var(--accent-glow); }

    .preset-group { margin-bottom: 10px; }
    .preset-group-title { font-size: 11px; color: var(--accent); margin-bottom: 12px; font-weight: 800; letter-spacing: 1.5px; display: flex; align-items: center; gap: 8px; }
    .preset-group-title::after { content: ""; flex: 1; height: 1px; background: var(--panel-border); }
    .btn-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }

    .tx-btn { background: #1a1a22; border: 1px solid var(--panel-border); color: var(--text-main); padding: 14px 12px; border-radius: var(--radius); cursor: pointer; transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); display: flex; flex-direction: column; align-items: flex-start; text-align: left; position: relative; overflow: hidden; }
    .tx-btn:hover { border-color: var(--accent); background: #22222f; box-shadow: 0 4px 20px var(--accent-glow); transform: translateY(-2px); }
    .tx-btn:active { transform: translateY(0); filter: brightness(0.9); }
    .tx-btn .id-label { font-family: ui-monospace, monospace; font-size: 9px; color: var(--text-sub); margin-bottom: 6px; font-weight: 700; z-index: 2; background: rgba(0,0,0,0.4); padding: 2px 6px; border-radius: 4px; }
    .tx-btn .name-label { font-size: 13px; font-weight: 700; line-height: 1.35; z-index: 2; color: #ffffff; text-shadow: 0 1px 2px rgba(0,0,0,0.8); }

    .rx-area { flex: 1; display: flex; flex-direction: column; background: #000; position: relative; }
    .rx-hud { position: absolute; top: 0; left: 0; right: 0; padding: 16px; z-index: 10; display: flex; flex-direction: column; gap: 10px; pointer-events: none; }
    .rx-card { background: rgba(12, 12, 16, 0.88); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.12); border-radius: 16px; padding: 16px; pointer-events: auto; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5); }
    .rx-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; gap: 8px; flex-wrap: wrap; }
    .btn-group { display: flex; gap: 8px; }

    #rxStartBtn, #rxFullscreenBtn { padding: 10px 18px; border-radius: 24px; font-weight: 800; font-size: 11px; cursor: pointer; transition: all 0.2s; letter-spacing: 0.5px; border: none; }
    #rxStartBtn { background: var(--accent); color: #000; box-shadow: 0 0 15px var(--accent-glow); }
    #rxStartBtn:hover { background: var(--accent-hover); box-shadow: 0 0 25px var(--accent-glow); }
    #rxFullscreenBtn { background: #272730; color: #f1f5f9; border: 1px solid rgba(255, 255, 255, 0.1); }
    #rxFullscreenBtn:hover { background: #353542; color: #fff; border-color: rgba(255, 255, 255, 0.3); }

    .rx-status { font-family: ui-monospace, monospace; font-size: 11px; color: var(--text-sub); display: flex; flex-direction: column; gap: 4px; text-align: right;}
    .rx-status span { color: #fff; font-weight: bold; }
    .slot-monitor { display: flex; gap: 8px; margin-top: 10px; }
    .slot { flex: 1; background: rgba(255, 255, 255, 0.04); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 8px; padding: 8px 0; text-align: center; font-family: ui-monospace, monospace; font-size: 11px; font-weight: bold; color: var(--text-sub); transition: 0.2s; }
    .slot.active { background: rgba(0, 240, 255, 0.2); color: #fff; border-color: var(--accent); box-shadow: 0 0 10px var(--accent-glow); }

    #rxCanvas { flex: 1; display: flex; align-items: center; justify-content: center; flex-direction: column; transition: background-color 0.15s ease; position: relative; overflow: hidden; z-index: 1; }
    .target-title { font-size: clamp(24px, 5vw, 40px); font-weight: 900; color: #fff; text-shadow: 0 4px 24px rgba(0, 0, 0, 0.9); z-index: 2; text-align: center; line-height: 1.15; padding: 0 20px; transition: opacity 0.2s; }
    .target-id { font-family: ui-monospace, monospace; font-size: 13px; color: rgba(255, 255, 255, 0.8); margin-top: 10px; letter-spacing: 2px; z-index: 2; background: rgba(0, 0, 0, 0.5); padding: 4px 12px; border-radius: 20px; border: 1px solid rgba(255, 255, 255, 0.15); transition: opacity 0.2s; }

    .target-msg { font-size: clamp(20px, 4vw, 32px); color: #ddd; margin-top: 16px; font-weight: 800; z-index: 2; text-align: center; max-width: 90%; text-shadow: none; letter-spacing: 1px; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
    .target-msg.fired { font-size: clamp(36px, 8vw, 72px); text-shadow: 0 4px 20px rgba(0, 0, 0, 0.5); margin-top: 0; }

    #spectrumCanvas { position: absolute; bottom: 0; left: 0; width: 100%; height: 110px; z-index: 3; pointer-events: none; opacity: 0.85; }
    #txProgress { position: fixed; top: 0; left: 0; height: 3px; background: var(--accent); width: 0%; z-index: 1000; box-shadow: 0 0 10px var(--accent); transition: width 0.1s linear; }
  </style>
</head>

<body>
  <div id="txProgress"></div>
  <div class="app-container">
    <header>
      <div class="brand">CUE-X <span>PROTOCOL ENGINE</span></div>
      <div class="badge">CHAR & CUE SYNC</div>
    </header>

    <div class="split-layout">
      <div class="tx-area">
        <h2><span>Transmitter Console</span><span>Unicode Sequence Protocol</span></h2>

        <div class="control-box">
          <h3>カスタム文字列ビルダー & キャッシュ送信</h3>
          <div class="control-row">
            <input type="text" id="customInputText" placeholder="文字を入力" value="こんにちは ライブへようこそ！🎉">
            <button class="action-btn" id="sendCharCacheBtn">キャッシュ送信</button>
            <button class="action-btn" id="sendFireBtn" style="background:#ffb703; color:#000;">発火(FIRE)</button>
          </div>
        </div>

        <div class="control-box">
          <h3>RGBカラー直接送信 (ID被り回避済)</h3>
          <div class="control-row">
            <input type="color" id="colorPicker" value="#00d0ff">
            <button class="action-btn" id="sendColorBtn" style="flex:1;">カラー送信</button>
          </div>
        </div>

        <div id="txPresets"></div>
      </div>

      <div class="rx-area" id="rxAreaContainer">
        <div class="rx-hud">
          <div class="rx-card">
            <div class="rx-header">
              <div class="btn-group">
                <button id="rxStartBtn">マイク接続</button>
                <button id="rxFullscreenBtn">全画面</button>
              </div>
              <div class="rx-status">
                <div>状態: <span id="rxState" style="color: var(--text-sub);">待機中</span></div>
                <div>感度: <span id="rxPeak">--</span> dB</div>
              </div>
            </div>
            <div style="font-size: 10px; color: var(--text-sub); margin-bottom: 4px; font-weight: 700;">受信スロットモニター</div>
            <div class="slot-monitor">
              <div class="slot" id="slot1">S1: ---</div>
              <div class="slot" id="slot2">S2: ---</div>
              <div class="slot" id="slot3">S3: ---</div>
            </div>
          </div>
        </div>

        <div id="rxCanvas">
          <div class="target-title" id="rxTitle">スタンバイ</div>
          <div class="target-id" id="rxSub">信号を待っています...</div>
          <div class="target-msg" id="rxMsg"></div>
          <canvas id="spectrumCanvas"></canvas>
        </div>
      </div>
    </div>
  </div>

  <script>
    const FREQ_TRIGGER = 20500;
    const FREQ_DATA = [];
    for (let i = 0; i < 31; i++) {
      FREQ_DATA.push(17300 + (i * 100));
    }

    const PAIRS = [];
    for (let i = 0; i < 31; i++) {
      for (let j = i + 1; j < 31; j++) {
        PAIRS.push([i, j]);
      }
    }

    const TIME_START = 0.15;
    const TIME_SLOT = 0.12;
    const THRESHOLD = -90;

    // プロトコル定義 (ダイレクトUnicode通信化)
    const ID_CMD_CACHE_START = 100544501;
    const ID_CMD_CACHE_END = 100544502;
    const ID_CMD_FIRE = 100544503;
    const UNICODE_OFFSET = 1000000; // ID 100万〜をUnicodeに割り当て

    let rxTextCache = "";

    const CUE_DATA = {
      "0": { cat: "SOLID", name: "ブラックアウト", color: "#050505", ms: 0 },
      "3": { cat: "SOLID", name: "ピュアレッド", color: "#FF0033", ms: 0 },
      "5": { cat: "SOLID", name: "サンセットオレンジ", color: "#FF6600", ms: 0 },
      "7": { cat: "SOLID", name: "サンバースト黄", color: "#FFB703", ms: 0 },
      "10": { cat: "SOLID", name: "ライムグリーン", color: "#39FF14", ms: 0 },
      "15": { cat: "SOLID", name: "ネオンシアン", color: "#00f0ff", ms: 0 },
      "18": { cat: "SOLID", name: "エレクトリック青", color: "#0055FF", ms: 0 },
      "22": { cat: "SOLID", name: "マゼンタピンク", color: "#FF00FF", ms: 0 },
      "25": { cat: "SOLID", name: "プラチナホワイト", color: "#F8FAFC", ms: 0 },

      "1000": { cat: "FADE", name: "オレンジフェード (3秒)", color: "#FF5500", ms: 3000 },
      "1001": { cat: "FADE", name: "ディープオーシャン (5秒)", color: "#001144", ms: 5000 },
      "1002": { cat: "FADE", name: "オーロラ (4秒)", color: "#00FF66", ms: 4000 },
      "1006": { cat: "FADE", name: "パルススイープ (2秒)", color: "#FF00FF", ms: 2000 },

      "50000": { cat: "FLASH", name: "高速ストロボ (20Hz)", color: "#FFFFFF", ms: 0, strobe: 20 },
      "50001": { cat: "FLASH", name: "警告フラッシュ (赤)", color: "#FF0000", ms: 0, strobe: 8 },

      "70000": { cat: "LASER", name: "サイバービーム", color: "#00FFFF", ms: 100, strobe: 10 },

      "1000000": { cat: "HAPTIC", name: "ヘビードロップ", color: "#FFFFFF", ms: 50, vibrate: [300, 100, 300] },

      "100544576": { cat: "MESSAGE", name: "ウェルカム通知", color: "#000", msg: "ようこそ、ライブ会場へ！", ms: 300 },
      "100544577": { cat: "MESSAGE", name: "緊急避難アナウンス", color: "#000", msg: "⚠️ 緊急避難指示：係員の誘導に従ってください", ms: 200, strobe: 15 },
      "100544578": { cat: "MESSAGE", name: "サプライズ発表", color: "#000", msg: "🎉 スペシャルゲスト登場！", ms: 400, strobe: 10 },
      "100544579": { cat: "MESSAGE", name: "休憩アナウンス", color: "#000", msg: "☕ 15分間の休憩時間です", ms: 0 }
    };

    let txCtx = null;
    function initTx() { if (!txCtx) txCtx = new (window.AudioContext || window.webkitAudioContext)(); }

    function sendTrigger(idStr) {
      initTx();
      const now = txCtx.currentTime;
      const id = parseInt(idStr, 10);

      const base1 = 465 * 465;
      const base2 = 465;
      const val1 = Math.floor(id / base1);
      const rem1 = id % base1;
      const val2 = Math.floor(rem1 / base2);
      const val3 = rem1 % base2;

      const p1 = PAIRS[val1];
      const p2 = PAIRS[val2];
      const p3 = PAIRS[val3];

      const oscA = txCtx.createOscillator();
      const oscB = txCtx.createOscillator();
      const gainA = txCtx.createGain();
      const gainB = txCtx.createGain();
      oscA.connect(gainA).connect(txCtx.destination);
      oscB.connect(gainB).connect(txCtx.destination);

      const MAX_GAIN = 0.25;

      const scheduleSlot = (pair, startTime) => {
        if (!pair) return;
        oscA.frequency.setValueAtTime(FREQ_DATA[pair[0]], startTime);
        oscB.frequency.setValueAtTime(FREQ_DATA[pair[1]], startTime);
      };

      const applyEnvelope = (start, duration) => {
        gainA.gain.setValueAtTime(0, start);
        gainB.gain.setValueAtTime(0, start);
        gainA.gain.linearRampToValueAtTime(MAX_GAIN, start + 0.015);
        gainB.gain.linearRampToValueAtTime(MAX_GAIN, start + 0.015);
        gainA.gain.setValueAtTime(MAX_GAIN, start + duration - 0.015);
        gainB.gain.setValueAtTime(MAX_GAIN, start + duration - 0.015);
        gainA.gain.linearRampToValueAtTime(0, start + duration);
        gainB.gain.linearRampToValueAtTime(0, start + duration);
      };

      let t = now;
      oscA.frequency.setValueAtTime(FREQ_TRIGGER, t);
      gainA.gain.setValueAtTime(0, t);
      gainA.gain.linearRampToValueAtTime(MAX_GAIN, t + 0.02);
      gainA.gain.setValueAtTime(MAX_GAIN, t + TIME_START - 0.02);
      gainA.gain.linearRampToValueAtTime(0, t + TIME_START);
      gainB.gain.setValueAtTime(0, t);

      t += TIME_START;
      const slots = [p1, p2, p3];
      for (let i = 0; i < 3; i++) {
        scheduleSlot(slots[i], t);
        applyEnvelope(t, TIME_SLOT);
        t += TIME_SLOT;
      }

      oscA.start(now); oscA.stop(t + 0.1);
      oscB.start(now); oscB.stop(t + 0.1);

      const bar = document.getElementById("txProgress");
      bar.style.transition = "none"; bar.style.width = "0%";
      setTimeout(() => {
        bar.style.transition = `width ${(t - now)}s linear`;
        bar.style.width = "100%";
        setTimeout(() => { bar.style.opacity = 0; setTimeout(() => { bar.style.width = "0%"; bar.style.opacity = 1; }, 200); }, (t - now) * 1000);
      }, 10);

      return (t - now) * 1000 + 30; // 実行時間 + 安全マージン
    }

    // 文字列のシーケンシャル送信 (完全Unicode対応版)
    async function sendStringSequence(str) {
      // 絵文字等のサロゲートペア対応のため Array.from を使用
      const charArray = Array.from(str);

      let waitMs = sendTrigger(ID_CMD_CACHE_START.toString());
      // エコーを断ち切るために長めのマージンを取る
      await new Promise(r => setTimeout(r, waitMs + 80));

      for (const ch of charArray) {
        // UnicodeポイントをそのままID化 (漢字も絵文字も送れる)
        const charId = UNICODE_OFFSET + ch.codePointAt(0);
        waitMs = sendTrigger(charId.toString());
        await new Promise(r => setTimeout(r, waitMs + 80));
      }

      sendTrigger(ID_CMD_CACHE_END.toString());
    }

    const customInputText = document.getElementById("customInputText");

    document.getElementById("sendCharCacheBtn").onclick = () => {
      const text = customInputText.value;
      if (text) sendStringSequence(text);
    };

    document.getElementById("sendFireBtn").onclick = () => {
      sendTrigger(ID_CMD_FIRE.toString());
    };

    const colorPicker = document.getElementById("colorPicker");
    function hexToId(hex) { return parseInt(hex.replace("#", ""), 16); }

    document.getElementById("sendColorBtn").onclick = () => {
      const colorId = hexToId(colorPicker.value) + 20000000;
      sendTrigger(colorId.toString());
    };

    const txContainer = document.getElementById("txPresets");
    const categories = {};
    Object.keys(CUE_DATA).forEach(id => {
      const cat = CUE_DATA[id].cat;
      if (!categories[cat]) categories[cat] = [];
      categories[cat].push(id);
    });

    for (const cat in categories) {
      const grp = document.createElement('div');
      grp.className = "preset-group";
      grp.innerHTML = `<div class="preset-group-title">${cat}</div>`;
      const grid = document.createElement('div');
      grid.className = "btn-grid";

      categories[cat].forEach(id => {
        const cue = CUE_DATA[id];
        const btn = document.createElement("button");
        btn.className = "tx-btn";
        btn.style.background = `linear-gradient(135deg, ${cue.color}33 0%, #16161c 70%)`;
        btn.style.borderLeft = `3px solid ${cue.color}`;
        btn.innerHTML = `<div class="id-label">ID: ${parseInt(id).toLocaleString()}</div><div class="name-label">${cue.name}</div>`;
        btn.onclick = () => sendTrigger(id);
        grid.appendChild(btn);
      });
      grp.appendChild(grid);
      txContainer.appendChild(grp);
    }

    // 受信機ロジック
    let rxCtx, analyser, dataArray;
    let rxState = "IDLE";
    let rxStartTime = 0;
    let decodedValues = [];
    let strobeInterval = null;

    const spectrumCanvas = document.getElementById("spectrumCanvas");
    const specCtx = spectrumCanvas.getContext("2d");

    function getMagnitude(freq, nyquist, bufferLength) {
      const bin = Math.round((freq / nyquist) * bufferLength);
      return Math.max(dataArray[bin - 1] || -999, dataArray[bin], dataArray[bin + 1] || -999);
    }

    const UI_STATE = (msg, color) => {
      const el = document.getElementById("rxState");
      el.innerText = msg; el.style.color = color;
    };

    const UI_SLOT = (idx, val, active = false) => {
      const el = document.getElementById(`slot${idx}`);
      if (val !== null) el.innerText = `S${idx}: ${val.toString().padStart(3, '0')}`;
      if (active) el.classList.add('active'); else el.classList.remove('active');
    };

    document.getElementById("rxStartBtn").onclick = async () => {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false } });
        rxCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (rxCtx.state === "suspended") await rxCtx.resume();
        const source = rxCtx.createMediaStreamSource(stream);
        analyser = rxCtx.createAnalyser();

        // 🚀 FFTサイズを縮小し、スムージングを無効化 (残響混入バグの撃退)
        analyser.fftSize = 2048;
        analyser.smoothingTimeConstant = 0.0;

        source.connect(analyser);
        dataArray = new Float32Array(analyser.frequencyBinCount);

        UI_STATE("リスニング中", "var(--accent)");
        document.getElementById("rxStartBtn").style.display = "none";
        requestAnimationFrame(rxLoop);
      } catch (e) { alert("マイクアクセスが拒否されました。"); }
    };

    document.getElementById("rxFullscreenBtn").onclick = () => {
      const elem = document.getElementById("rxAreaContainer");
      if (!document.fullscreenElement) {
        if (elem.requestFullscreen) elem.requestFullscreen();
      } else {
        if (document.exitFullscreen) document.exitFullscreen();
      }
    };

    function drawSpectrum() {
      if (!analyser || !rxCtx) return;
      if (spectrumCanvas.width !== spectrumCanvas.clientWidth || spectrumCanvas.height !== spectrumCanvas.clientHeight) {
        spectrumCanvas.width = spectrumCanvas.clientWidth;
        spectrumCanvas.height = spectrumCanvas.clientHeight;
      }
      const width = spectrumCanvas.width;
      const height = spectrumCanvas.height;
      specCtx.clearRect(0, 0, width, height);

      const nyquist = rxCtx.sampleRate / 2;
      const bufferLength = analyser.frequencyBinCount;
      const minBin = Math.floor((17000 / nyquist) * bufferLength);
      const maxBin = Math.floor((20600 / nyquist) * bufferLength);
      const totalBins = maxBin - minBin;

      if (totalBins <= 0) return;
      const barWidth = width / totalBins;

      for (let i = 0; i < totalBins; i++) {
        const binIdx = minBin + i;
        const db = dataArray[binIdx];
        let normHeight = Math.max(0, Math.min(1, (db + 100) / 70));
        const barHeight = normHeight * height;
        let grad = specCtx.createLinearGradient(0, height, 0, 0);
        grad.addColorStop(0, "rgba(0, 240, 255, 0.1)");
        grad.addColorStop(1, "rgba(0, 240, 255, 0.8)");
        specCtx.fillStyle = grad;
        specCtx.fillRect(i * barWidth, height - barHeight, Math.max(1, barWidth - 0.5), barHeight);
      }
    }

    function rxLoop() {
      analyser.getFloatFrequencyData(dataArray);
      const nyquist = rxCtx.sampleRate / 2;
      const bufferLength = analyser.frequencyBinCount;
      const now = performance.now();

      const magTrigger = getMagnitude(FREQ_TRIGGER, nyquist, bufferLength);
      document.getElementById("rxPeak").innerText = magTrigger > -100 ? magTrigger.toFixed(0) : "--";
      drawSpectrum();

      if (rxState === "IDLE") {
        if (magTrigger > THRESHOLD) {
          rxState = "READING";
          rxStartTime = now;
          decodedValues = [];
          UI_STATE("デコード中...", "#ffeb3b");
          UI_SLOT(1, "---"); UI_SLOT(2, "---"); UI_SLOT(3, "---");
        }
      } else if (rxState === "READING") {
        const elapsed = (now - rxStartTime) / 1000;

        if (elapsed > TIME_START && elapsed < TIME_START + (TIME_SLOT * 3)) {
          const slotIndex = Math.floor((elapsed - TIME_START) / TIME_SLOT);
          const timeOffset = (elapsed - TIME_START) % TIME_SLOT;

          [1, 2, 3].forEach(i => document.getElementById(`slot${i}`).classList.remove('active'));
          document.getElementById(`slot${slotIndex + 1}`).classList.add('active');

          // 🚀 安定期判定をスロット後半（50%〜80%）にずらし、残響混入を防止
          if (decodedValues[slotIndex] === undefined && timeOffset > (TIME_SLOT * 0.5) && timeOffset < (TIME_SLOT * 0.8)) {
            let results = [];
            for (let i = 0; i < 31; i++) {
              results.push({ idx: i, mag: getMagnitude(FREQ_DATA[i], nyquist, bufferLength) });
            }
            results.sort((a, b) => b.mag - a.mag);

            const top1 = results[0];
            const top2 = results[1];

            if (top1.mag > THRESHOLD && top2.mag > -95) {
              const idxA = Math.min(top1.idx, top2.idx);
              const idxB = Math.max(top1.idx, top2.idx);
              let val = PAIRS.findIndex(p => p[0] === idxA && p[1] === idxB);
              if (val !== -1) {
                decodedValues[slotIndex] = val;
                UI_SLOT(slotIndex + 1, val);
              }
            }
          }
        } else if (elapsed >= TIME_START + (TIME_SLOT * 3)) {
          [1, 2, 3].forEach(i => document.getElementById(`slot${i}`).classList.remove('active'));

          if (decodedValues[0] !== undefined && decodedValues[1] !== undefined && decodedValues[2] !== undefined) {
            const finalId = (decodedValues[0] * 465 * 465) + (decodedValues[1] * 465) + decodedValues[2];
            executeCue(finalId.toString());
          }
          rxState = "IDLE";
          UI_STATE("リスニング中", "var(--accent)");
        }
      }
      requestAnimationFrame(rxLoop);
    }

    let isCaching = false;

    function executeCue(idStr) {
      const idNum = parseInt(idStr, 10);
      const canvas = document.getElementById("rxCanvas");
      const title = document.getElementById("rxTitle");
      const sub = document.getElementById("rxSub");
      const msgEl = document.getElementById("rxMsg");

      if (strobeInterval) { clearInterval(strobeInterval); strobeInterval = null; }

      // --- キャッシュ関連 ---
      if (idNum === ID_CMD_CACHE_START) {
        isCaching = true;
        rxTextCache = "";
        title.style.display = "block"; sub.style.display = "block"; msgEl.classList.remove("fired");
        title.innerText = "データ受信中...";
        sub.innerText = `ID: ${idNum} (キャッシュ開始)`;
        msgEl.innerText = "";
        return;
      }

      if (idNum === ID_CMD_CACHE_END) {
        isCaching = false;
        title.style.display = "block"; sub.style.display = "block"; msgEl.classList.remove("fired");
        title.innerText = "キャッシュ完了";
        sub.innerText = `ID: ${idNum} (待機状態)`;
        msgEl.innerText = `[準備OK] ${rxTextCache}`;
        msgEl.style.color = "#ddd";
        canvas.style.backgroundColor = "#000000";
        return;
      }

      // --- 💥 FIRE (発火) ---
      if (idNum === ID_CMD_FIRE) {
        title.style.display = "none";
        sub.style.display = "none";
        msgEl.innerText = rxTextCache;
        msgEl.style.color = "#ddd";
        msgEl.classList.add("fired");
        canvas.style.transition = `background-color 200ms ease-out`;
        canvas.style.backgroundColor = "#000000";
        return;
      }

      // --- Unicode文字のダイレクト受信 (絵文字・漢字対応) ---
      if (idNum >= UNICODE_OFFSET && idNum < UNICODE_OFFSET + 2000000) {
        let codePoint = idNum - UNICODE_OFFSET;
        let char = String.fromCodePoint(codePoint);

        if (isCaching) {
          rxTextCache += char;
          msgEl.innerText = rxTextCache;
          msgEl.style.color = "#ddd";
        }
        title.style.display = "block"; sub.style.display = "block"; msgEl.classList.remove("fired");
        title.innerText = "文字受信";
        sub.innerText = `ID: ${idNum} (${char})`;
        return;
      }

      // 毎回UIリセット
      title.style.display = "block";
      sub.style.display = "block";
      msgEl.classList.remove("fired");

      // --- プリセット処理 ---
      if (CUE_DATA[idStr]) {
        const cue = CUE_DATA[idStr];
        title.innerText = cue.name;
        sub.innerText = `ID: ${idNum.toLocaleString()}`;

        if (cue.msg) {
          msgEl.innerText = cue.msg;
          msgEl.style.color = "#ddd";
        } else {
          msgEl.innerText = "";
        }

        canvas.style.transition = `background-color ${cue.ms || 300}ms ease`;
        canvas.style.backgroundColor = cue.cat === "MESSAGE" ? "#000000" : cue.color;

        if (cue.vibrate && navigator.vibrate) navigator.vibrate(cue.vibrate);
        return;
      }

      // --- RGBカラー直接同期 ---
      if (idNum >= 20000000 && idNum <= 36777215) {
        const rgbNum = idNum - 20000000;
        const hexColor = "#" + rgbNum.toString(16).padStart(6, '0');

        title.innerText = "RGBカラー直接同期";
        sub.innerText = `ID: ${idNum.toLocaleString()} (${hexColor.toUpperCase()})`;
        msgEl.innerText = "";

        canvas.style.transition = `background-color 300ms ease`;
        canvas.style.backgroundColor = hexColor;
        return;
      }

      title.innerText = "UNKNOWN";
      sub.innerText = `ID: ${idNum}`;
    }
  </script>
