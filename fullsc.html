<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <title>Fullscreen Color Demo</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #ffdd55;
      overscroll-behavior: none;
    }

    #screen {
      position: fixed;
      inset: 0;

      width: 100%;
      height: 100dvh;

      background: #ffdd55;
      overflow: hidden;

      padding:
        env(safe-area-inset-top)
        env(safe-area-inset-right)
        env(safe-area-inset-bottom)
        env(safe-area-inset-left);

      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      touch-action: manipulation;

      display: grid;
      place-items: center;
    }

    #message {
      color: #999;
      font-family: sans-serif;
      font-size: 14px;
      pointer-events: none;
    }

    /*
     * 色選択UI
     */
    #colorPicker {
      position: fixed;
      z-index: 100;

      top: 16px;
      right: 16px;

      width: 48px;
      height: 48px;

      padding: 0;
      border: 0;
      border-radius: 50%;

      background: transparent;

      cursor: pointer;
    }
  </style>
</head>

<body>

  <main id="screen">
    <div id="message">画面をタップしてください</div>
  </main>

  <input
    id="colorPicker"
    type="color"
    value="#ffdd55"
    aria-label="背景色を選択"
  >

  <script>
    (() => {
      const screen = document.getElementById("screen");
      const colorPicker = document.getElementById("colorPicker");

      /*
       * 現在のFullscreen要素を取得
       */
      function getFullscreenElement() {
        return (
          document.fullscreenElement ??
          document.webkitFullscreenElement ??
          null
        );
      }

      /*
       * 背景色を変更
       *
       * screenだけでなくbodyも変更する。
       * SafariでブラウザUIの影響などにより
       * 周辺が見える場合でも同じ色にする。
       */
      function setColor(color) {
        screen.style.backgroundColor = color;
        document.body.style.backgroundColor = color;
      }

      /*
       * 本物のFullscreen
       */
      async function enterFullscreen() {
        try {
          if (screen.requestFullscreen) {
            await screen.requestFullscreen();
            return true;
          }

          /*
           * WebKit系
           */
          if (screen.webkitRequestFullscreen) {
            screen.webkitRequestFullscreen();
            return true;
          }
        } catch (error) {
          console.debug("Fullscreen failed:", error);
        }

        /*
         * iOS Safariなど。
         *
         * #screenは最初から
         * position: fixed + 100dvh
         * なので、疑似Fullscreenとして
         * そのまま画面いっぱいに表示する。
         */
        return false;
      }

      /*
       * Fullscreen解除
       */
      async function exitFullscreen() {
        try {
          if (document.exitFullscreen) {
            await document.exitFullscreen();
            return true;
          }

          if (document.webkitExitFullscreen) {
            document.webkitExitFullscreen();
            return true;
          }
        } catch (error) {
          console.debug("Exit fullscreen failed:", error);
        }

        return false;
      }

      /*
       * Fullscreen切り替え
       */
      async function toggleFullscreen() {
        if (getFullscreenElement()) {
          await exitFullscreen();
        } else {
          await enterFullscreen();
        }
      }

      /*
       * 画面クリックでFullscreen
       */
      screen.addEventListener("click", toggleFullscreen);

      /*
       * 色変更
       *
       * inputイベントなので、
       * カラーピッカーを操作している途中でも
       * リアルタイムに反映される。
       */
      colorPicker.addEventListener("input", (event) => {
        setColor(event.target.value);
      });

      /*
       * 初期色を適用
       */
      setColor(colorPicker.value);

    })();
  </script>

</body>
</html>
