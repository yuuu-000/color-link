<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <title>Fullscreen Demo</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #fd5;
      overscroll-behavior: none;
    }

    #screen {
      position: fixed;
      inset: 0;

      width: 100%;
      height: 100dvh;

      background: #fff;
      overflow: hidden;

      padding:
        env(safe-area-inset-top)
        env(safe-area-inset-right)
        env(safe-area-inset-bottom)
        env(safe-area-inset-left);

      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      touch-action: manipulation;

      display: grid;
      place-items: center;
    }

    #message {
      color: #999;
      font-family: sans-serif;
      font-size: 14px;
      pointer-events: none;
    }
  </style>
</head>

<body>

  <main id="screen">
    <div id="message">画面をタップしてください</div>
  </main>

  <script>
    (() => {
      const screen = document.getElementById("screen");

      function getFullscreenElement() {
        return (
          document.fullscreenElement ??
          document.webkitFullscreenElement ??
          null
        );
      }

      async function enterFullscreen() {
        try {
          if (screen.requestFullscreen) {
            await screen.requestFullscreen();
            return true;
          }

          if (screen.webkitRequestFullscreen) {
            screen.webkitRequestFullscreen();
            return true;
          }
        } catch (error) {
          console.debug("Fullscreen failed:", error);
        }

        // iOS Safariなど
        // #screenが既に疑似Fullscreenレイアウトなので何もしない
        return false;
      }

      async function exitFullscreen() {
        try {
          if (document.exitFullscreen) {
            await document.exitFullscreen();
            return true;
          }

          if (document.webkitExitFullscreen) {
            document.webkitExitFullscreen();
            return true;
          }
        } catch (error) {
          console.debug("Exit fullscreen failed:", error);
        }

        return false;
      }

      async function toggleFullscreen() {
        if (getFullscreenElement()) {
          await exitFullscreen();
        } else {
          await enterFullscreen();
        }
      }

      screen.addEventListener("click", toggleFullscreen);

    })();
  </script>

</body>
</html>
