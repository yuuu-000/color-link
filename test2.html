<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>超音波 FS データ送受信</title>
  <style>
    body { font-family: sans-serif; max-width: 600px; margin: 20px auto; padding: 0 15px; }
    .card { border: 1px solid #ccc; border-radius: 8px; padding: 15px; margin-bottom: 20px; }
    button { padding: 8px 16px; margin: 4px; cursor: pointer; }
    .checkbox-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin: 10px 0; }
    .status { font-weight: bold; margin-top: 10px; }
    .badge { display: inline-block; background: #e0e0e0; padding: 4px 8px; border-radius: 4px; margin-right: 5px; }
  </style>
</head>
<body>

  <!-- 送信部 -->
  <div class="card">
    <h2>送信側 (Transmitter)</h2>
    <p>送信するIDを3つ選択してください (17.5kHz + ID × 130Hz):</p>
    <div class="checkbox-grid" id="tx-checkboxes"></div>
    <button id="btn-tx-start">3音を同時に送信</button>
    <button id="btn-tx-stop">停止</button>
    <div class="status" id="tx-status">停止中</div>
  </div>

  <!-- 受信部 -->
  <div class="card">
    <h2>受信側 (Receiver)</h2>
    <button id="btn-rx-toggle">マイク受信を開始</button>
    <div class="status" id="rx-status">待機中</div>
    <h3>検出結果 (最も近いID上位3つ):</h3>
    <div id="rx-results">---</div>
  </div>

  <script>
    const BASE_FREQ = 17500;
    const STEP_FREQ = 130;
    const NUM_CHANNELS = 16;

    // 周波数配列 (ID 0〜15)
    const FREQS = Array.from({ length: NUM_CHANNELS }, (_, i) => BASE_FREQ + i * STEP_FREQ);

    // --- 送信側の初期化 ---
    const txContainer = document.getElementById('tx-checkboxes');
    FREQS.forEach((f, id) => {
      const label = document.createElement('label');
      label.innerHTML = `<input type="checkbox" name="tx-ch" value="${id}"> ID ${id} (${f}Hz)`;
      txContainer.appendChild(label);
    });

    let txAudioCtx = null;
    let activeOscillators = [];

    // チェックボックス制御 (最大3つ)
    txContainer.addEventListener('change', () => {
      const checked = txContainer.querySelectorAll('input[type="checkbox"]:checked');
      if (checked.length > 3) {
        event.target.checked = false;
        alert('選択できるのは3つまでです');
      }
    });

    document.getElementById('btn-tx-start').addEventListener('click', () => {
      const selected = Array.from(txContainer.querySelectorAll('input[type="checkbox"]:checked')).map(el => parseInt(el.value));
      if (selected.length !== 3) {
        alert('IDを3つ選択してください');
        return;
      }

      stopTransmission();

      txAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const gainNode = txAudioCtx.createGain();
      gainNode.gain.value = 0.2; // 音割れ・過負荷防止
      gainNode.connect(txAudioCtx.destination);

      selected.forEach(id => {
        const osc = txAudioCtx.createOscillator();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(FREQS[id], txAudioCtx.currentTime);
        osc.connect(gainNode);
        osc.start();
        activeOscillators.push(osc);
      });

      document.getElementById('tx-status').innerText = `送信中: ID [${selected.join(', ')}] (${selected.map(id => FREQS[id] + 'Hz').join(', ')})`;
    });

    document.getElementById('btn-tx-stop').addEventListener('click', stopTransmission);

    function stopTransmission() {
      activeOscillators.forEach(osc => {
        try { osc.stop(); osc.disconnect(); } catch(e) {}
      });
      activeOscillators = [];
      if (txAudioCtx) {
        txAudioCtx.close();
        txAudioCtx = null;
      }
      document.getElementById('tx-status').innerText = '停止中';
    }

    // --- 受信側の初期化 ---
    let rxAudioCtx = null;
    let analyser = null;
    let rxStream = null;
    let isListening = false;
    let animFrameId = null;

    const btnRxToggle = document.getElementById('btn-rx-toggle');
    const rxStatus = document.getElementById('rx-status');
    const rxResults = document.getElementById('rx-results');

    btnRxToggle.addEventListener('click', async () => {
      if (isListening) {
        stopListening();
      } else {
        await startListening();
      }
    });

    async function startListening() {
      try {
        rxStream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false } });
        rxAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        // 周波数分解能を高めるためFFTサイズを大きめに設定 (44.1kHzで約5.4Hz/bin)
        analyser = rxAudioCtx.createAnalyser();
        analyser.fftSize = 8192;
        analyser.smoothingTimeConstant = 0.5;

        const source = rxAudioCtx.createMediaStreamSource(rxStream);
        source.connect(analyser);

        isListening = true;
        btnRxToggle.innerText = 'マイク受信を停止';
        rxStatus.innerText = '解析中...';
        detectFrequencies();
      } catch (err) {
        alert('マイクへのアクセスに失敗しました: ' + err.message);
      }
    }

    function stopListening() {
      isListening = false;
      cancelAnimationFrame(animFrameId);
      if (rxStream) rxStream.getTracks().forEach(t => t.stop());
      if (rxAudioCtx) rxAudioCtx.close();
      btnRxToggle.innerText = 'マイク受信を開始';
      rxStatus.innerText = '停止中';
      rxResults.innerText = '---';
    }

    function detectFrequencies() {
      if (!isListening) return;

      const bufferLength = analyser.frequencyBinCount;
      const dataArray = new Float32Array(bufferLength);
      analyser.getFloatFrequencyData(dataArray);

      const sampleRate = rxAudioCtx.sampleRate;
      const binWidth = sampleRate / analyser.fftSize;

      // 対象帯域（17.3kHz〜19.6kHz）のみ走査して極大値（ピーク）を抽出
      const minBin = Math.floor(17300 / binWidth);
      const maxBin = Math.floor(19600 / binWidth);
      const peaks = [];

      for (let i = minBin; i <= maxBin; i++) {
        const val = dataArray[i];
        // 簡易しきい値(-80dB以上) かつ ローカルピーク
        if (val > -80 && val > dataArray[i - 1] && val > dataArray[i + 1]) {
          peaks.push({ freq: i * binWidth, power: val });
        }
      }

      // パワー順にソートし、近接重複（65Hz以内）を間引いて上位3つを抽出
      peaks.sort((a, b) => b.power - a.power);
      const filteredPeaks = [];
      for (const p of peaks) {
        const tooClose = filteredPeaks.some(fp => Math.abs(fp.freq - p.freq) < STEP_FREQ / 2);
        if (!tooClose) {
          filteredPeaks.push(p);
          if (filteredPeaks.length === 3) break;
        }
      }

      // 最も近いIDにマッピング
      if (filteredPeaks.length > 0) {
        rxResults.innerHTML = filteredPeaks.map(p => {
          // 最も差分が小さいIDを探索
          let closestId = 0;
          let minDiff = Infinity;
          FREQS.forEach((targetFreq, id) => {
            const diff = Math.abs(p.freq - targetFreq);
            if (diff < minDiff) {
              minDiff = diff;
              closestId = id;
            }
          });

          return `<span class="badge">推定: <b>ID ${closestId}</b> (${Math.round(p.freq)}Hz / ズレ: ${Math.round(p.freq - FREQS[closestId])}Hz)</span>`;
        }).join(' ');
      } else {
        rxResults.innerText = '信号なし';
      }

      animFrameId = requestAnimationFrame(detectFrequencies);
    }
  </script>
</body>
</html>
