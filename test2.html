<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>超音波 FS データ送受信</title>
  <style>
    body { font-family: sans-serif; max-width: 650px; margin: 20px auto; padding: 0 15px; line-height: 1.5; }
    .card { border: 1px solid #ccc; border-radius: 8px; padding: 15px; margin-bottom: 20px; }
    button { padding: 8px 16px; margin: 4px 0; cursor: pointer; }
    .checkbox-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin: 10px 0; }
    .status { font-weight: bold; margin-top: 10px; color: #333; }
    .badge {
      display: inline-block;
      background: #eef2f7;
      border: 1px solid #ccd5e0;
      padding: 6px 10px;
      border-radius: 6px;
      margin: 4px 6px 4px 0;
      font-size: 0.9em;
    }
  </style>
</head>
<body>

  <!-- 送信部 -->
  <div class="card">
    <h2>送信側 (Transmitter)</h2>
    <p>3つ選択してください（チェックを変更すると即座に送信されます）:</p>
    <div class="checkbox-grid" id="tx-checkboxes"></div>
    <button id="btn-tx-stop">全解除・停止</button>
    <div class="status" id="tx-status">停止中 (3つ選択されていません)</div>
  </div>

  <!-- 受信部 -->
  <div class="card">
    <h2>受信側 (Receiver)</h2>
    <button id="btn-rx-toggle">マイク受信を開始</button>
    <div class="status" id="rx-status">待機中</div>
    <h3>検出結果 (上位3つ / 下限 -100 dB):</h3>
    <div id="rx-results">---</div>
  </div>

  <script>
    const BASE_FREQ = 17500;
    const STEP_FREQ = 130;
    const NUM_CHANNELS = 16;
    const FREQS = Array.from({ length: NUM_CHANNELS }, (_, i) => BASE_FREQ + i * STEP_FREQ);

    // --- 送信側の実装 ---
    const txContainer = document.getElementById('tx-checkboxes');
    FREQS.forEach((f, id) => {
      const label = document.createElement('label');
      label.innerHTML = `<input type="checkbox" name="tx-ch" value="${id}"> ID ${id} <small>(${f}Hz)</small>`;
      txContainer.appendChild(label);
    });

    let txAudioCtx = null;
    let activeOscillators = [];

    // チェックボックス変更時に即時送信処理を更新
    txContainer.addEventListener('change', (e) => {
      const checkedBoxes = Array.from(txContainer.querySelectorAll('input[type="checkbox"]:checked'));
      
      // 4つ目以降は選択させない
      if (checkedBoxes.length > 3) {
        e.target.checked = false;
        return;
      }

      // 3つ揃った段階で即時再生、それ以外は停止
      if (checkedBoxes.length === 3) {
        const selectedIds = checkedBoxes.map(el => parseInt(el.value));
        startTransmission(selectedIds);
      } else {
        stopOscillatorsOnly();
        document.getElementById('tx-status').innerText = `選択中: ${checkedBoxes.length}/3個 (3つ選択すると自動送信されます)`;
      }
    });

    document.getElementById('btn-tx-stop').addEventListener('click', () => {
      txContainer.querySelectorAll('input[type="checkbox"]').forEach(el => el.checked = false);
      stopTransmission();
    });

    function startTransmission(ids) {
      stopOscillatorsOnly();

      if (!txAudioCtx) {
        txAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (txAudioCtx.state === 'suspended') {
        txAudioCtx.resume();
      }

      const gainNode = txAudioCtx.createGain();
      gainNode.gain.value = 0.15; // 音割れ防止
      gainNode.connect(txAudioCtx.destination);

      ids.forEach(id => {
        const osc = txAudioCtx.createOscillator();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(FREQS[id], txAudioCtx.currentTime);
        osc.connect(gainNode);
        osc.start();
        activeOscillators.push(osc);
      });

      document.getElementById('tx-status').innerText = 
        `送信中: ID [${ids.join(', ')}] (${ids.map(id => FREQS[id] + 'Hz').join(', ')})`;
    }

    function stopOscillatorsOnly() {
      activeOscillators.forEach(osc => {
        try { osc.stop(); osc.disconnect(); } catch(e) {}
      });
      activeOscillators = [];
    }

    function stopTransmission() {
      stopOscillatorsOnly();
      if (txAudioCtx) {
        txAudioCtx.close();
        txAudioCtx = null;
      }
      document.getElementById('tx-status').innerText = '停止中';
    }

    // --- 受信側の実装 ---
    let rxAudioCtx = null;
    let analyser = null;
    let rxStream = null;
    let isListening = false;
    let animFrameId = null;

    const btnRxToggle = document.getElementById('btn-rx-toggle');
    const rxStatus = document.getElementById('rx-status');
    const rxResults = document.getElementById('rx-results');

    btnRxToggle.addEventListener('click', async () => {
      if (isListening) {
        stopListening();
      } else {
        await startListening();
      }
    });

    async function startListening() {
      try {
        rxStream = await navigator.mediaDevices.getUserMedia({
          audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false }
        });
        rxAudioCtx = new (window.AudioContext || window.webkitAudioContext)();

        analyser = rxAudioCtx.createAnalyser();
        analyser.fftSize = 8192; // 48kHz時 約5.8Hz/bin
        analyser.smoothingTimeConstant = 0.4;

        const source = rxAudioCtx.createMediaStreamSource(rxStream);
        source.connect(analyser);

        isListening = true;
        btnRxToggle.innerText = 'マイク受信を停止';
        rxStatus.innerText = '解析中...';
        detectFrequencies();
      } catch (err) {
        alert('マイク起動に失敗しました: ' + err.message);
      }
    }

    function stopListening() {
      isListening = false;
      cancelAnimationFrame(animFrameId);
      if (rxStream) rxStream.getTracks().forEach(t => t.stop());
      if (rxAudioCtx) rxAudioCtx.close();
      btnRxToggle.innerText = 'マイク受信を開始';
      rxStatus.innerText = '停止中';
      rxResults.innerText = '---';
    }

    function detectFrequencies() {
      if (!isListening) return;

      const bufferLength = analyser.frequencyBinCount;
      const dataArray = new Float32Array(bufferLength);
      analyser.getFloatFrequencyData(dataArray);

      const binWidth = rxAudioCtx.sampleRate / analyser.fftSize;

      // 17.3kHz〜19.6kHz のビン範囲
      const minBin = Math.floor(17300 / binWidth);
      const maxBin = Math.floor(19600 / binWidth);
      const peaks = [];

      // ローカルピーク検出 (下限 -100 dB)
      for (let i = minBin; i <= maxBin; i++) {
        const val = dataArray[i];
        if (val > -100 && val > dataArray[i - 1] && val > dataArray[i + 1]) {
          peaks.push({ freq: i * binWidth, power: val });
        }
      }

      // パワー順にソートして、近接周波数（65Hz未満の山）を除去しつつ上位3つを抽出
      peaks.sort((a, b) => b.power - a.power);
      const filteredPeaks = [];
      for (const p of peaks) {
        const isDuplicate = filteredPeaks.some(fp => Math.abs(fp.freq - p.freq) < STEP_FREQ / 2);
        if (!isDuplicate) {
          filteredPeaks.push(p);
          if (filteredPeaks.length === 3) break;
        }
      }

      // 表示処理
      if (filteredPeaks.length > 0) {
        rxResults.innerHTML = filteredPeaks.map(p => {
          // 最も近いIDの算出
          let closestId = 0;
          let minDiff = Infinity;
          FREQS.forEach((f, id) => {
            const diff = Math.abs(p.freq - f);
            if (diff < minDiff) {
              minDiff = diff;
              closestId = id;
            }
          });

          const diffHz = Math.round(p.freq - FREQS[closestId]);
          const sign = diffHz >= 0 ? '+' : '';

          return `<div class="badge">
            <b>ID ${closestId}</b> (${FREQS[closestId]}Hz)<br>
            受信: ${Math.round(p.freq)}Hz (${sign}${diffHz}Hz)<br>
            強度: <b>${p.power.toFixed(1)} dB</b>
          </div>`;
        }).join('');
      } else {
        rxResults.innerText = '信号なし (-100 dB 未満)';
      }

      animFrameId = requestAnimationFrame(detectFrequencies);
    }
  </script>
</body>
</html>
