<!doctype html>
<html lang="ja">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Real-time Frequency Generator & Analyzer</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0b0d12;
      color: #fff;
    }

    body {
      display: flex;
      justify-content: center;
    }

    .wrap {
      width: min(900px, 100%);
      padding: 20px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 24px;
    }

    .sub {
      color: #aeb6c6;
      margin: 0 0 18px;
      line-height: 1.5;
    }

    .mode {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }

    button {
      border: 0;
      border-radius: 10px;
      padding: 11px 15px;
      background: #252b38;
      color: #fff;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
    }

    button:hover {
      background: #303848;
    }

    button.active {
      background: #fff;
      color: #111;
    }

    button:disabled {
      opacity: .45;
      cursor: not-allowed;
    }

    .panel {
      background: #151923;
      border: 1px solid #2a3040;
      border-radius: 16px;
      padding: 18px;
      margin-bottom: 14px;
    }

    label {
      display: block;
      color: #aeb6c6;
      font-size: 13px;
      margin-bottom: 7px;
    }

    input[type=number],
    input[type=text] {
      width: 100%;
      background: #0d1017;
      border: 1px solid #2a3040;
      color: #fff;
      padding: 10px;
      border-radius: 8px;
      font-size: 14px;
      font-family: ui-monospace, monospace;
    }

    input[type=range] {
      width: 100%;
      accent-color: #77e3a2;
      cursor: pointer;
      margin: 8px 0;
    }

    .row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
      margin-bottom: 12px;
    }

    .status {
      font: 600 13px ui-monospace, monospace;
      padding: 7px 9px;
      border-radius: 8px;
      background: #0d1017;
      color: #c9d1e0;
    }

    .status.good {
      color: #77e3a2;
    }

    .status.bad {
      color: #ff7b72;
    }

    .peaks-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 8px;
      margin: 10px 0;
    }

    .peak-card {
      background: #0d1017;
      border: 1px solid #252b36;
      border-radius: 8px;
      padding: 10px;
      font-family: ui-monospace, monospace;
    }

    .peak-card-title {
      font-size: 11px;
      color: #aeb6c6;
      margin-bottom: 4px;
    }

    .peak-card-val {
      font-size: 18px;
      font-weight: 700;
      color: #77e3a2;
    }

    canvas {
      width: 100%;
      height: 360px;
      background: #090c11;
      border-radius: 10px;
      border: 1px solid #252b36;
      margin-top: 10px;
      display: block;
    }

    .config-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 12px;
    }

    .debug-box {
      background: #080a0f;
      border: 1px solid #1e2533;
      border-radius: 8px;
      padding: 10px;
      font: 12px ui-monospace, monospace;
      color: #79c0ff;
      max-height: 140px;
      overflow-y: auto;
      margin-top: 10px;
      white-space: pre-wrap;
    }

    .flex-between {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .meter {
      margin-top: 12px;
    }

    .meter-bg {
      width: 100%;
      height: 12px;
      border-radius: 99px;
      background: #090c11;
      border: 1px solid #252b36;
      overflow: hidden;
    }

    .meter-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #00b7ff, #77e3a2, #ffcc66, #ff5555);
      transition: width .05s linear;
    }

    .freq-readout {
      margin-top: 8px;
      font: 600 13px ui-monospace, monospace;
      color: #aeb6c6;
    }

    .small {
      font-size: 11px;
      color: #7f899b;
      line-height: 1.5;
    }
  </style>
</head>

<body>

  <div class="wrap">

    <h1>Real-time Frequency Generator & Analyzer</h1>

    <p class="sub">
      リアルタイム送信とマイク入力の音域テスト。
      0Hz〜22kHzの全域スペクトラムを確認できます。
    </p>

    <div class="mode">
      <button id="txMode" class="active">リアルタイム送信</button>
      <button id="rxMode">音域テスト・受信解析</button>
    </div>


    <!-- TX PANEL -->
    <section id="txPanel" class="panel">

      <div class="config-group">

        <div>
          <div class="flex-between">
            <label>送信周波数 (Hz)</label>
            <span id="freqValText" style="font:13px ui-monospace; color:#77e3a2;">
              18000 Hz
            </span>
          </div>

          <input type="range" id="txFreqRange" value="18000" min="100" max="22000" step="1">

          <input type="number" id="txFreqNum" value="18000" min="100" max="24000" style="margin-top:8px;">
        </div>


        <div>
          <label>ゲイン (0.0 - 0.5)</label>
          <input type="text" id="txGainVal" value="0.05">
        </div>

      </div>


      <div class="row">
        <button id="txStart">トーン送信開始</button>
        <button id="txStop" disabled>停止</button>
        <span id="txStatus" class="status">停止中</span>
      </div>


      <div id="txLog" class="debug-box">
        Ready.
      </div>

    </section>



    <!-- RX PANEL -->
    <section id="rxPanel" class="panel" style="display:none">

      <label>検出ピーク</label>

      <div class="peaks-container">

        <div class="peak-card">
          <div class="peak-card-title">1st Peak</div>
          <div class="peak-card-val" id="peak1">---- Hz (---- dB)</div>
        </div>

        <div class="peak-card">
          <div class="peak-card-title">2nd Peak</div>
          <div class="peak-card-val" id="peak2" style="color:#7fc8ff">---- Hz (---- dB)</div>
        </div>

        <div class="peak-card">
          <div class="peak-card-title">3rd Peak</div>
          <div class="peak-card-val" id="peak3" style="color:#ffae7f">---- Hz (---- dB)</div>
        </div>

      </div>


      <div class="row">
        <button id="rxStart">マイク音域テスト開始</button>
        <button id="rxStop" disabled>停止</button>
        <span id="rxStatus" class="status">停止中</span>
      </div>


      <div class="meter">
        <label>入力レベル</label>
        <div class="meter-bg">
          <div id="levelMeter" class="meter-fill"></div>
        </div>
        <div id="levelText" class="freq-readout">---- dB</div>
      </div>


      <canvas id="spectrum" width="1000" height="360"></canvas>


      <div class="small">
        上段：マイク波形 
        下段：0kHz〜22kHzスペクトラム 
        48kHzサンプリング時のナイキスト周波数は24kHzです。
      </div>


      <div id="rxLog" class="debug-box">
        Microphone inactive.
      </div>

    </section>

  </div>



  <script>
    (() => {
      "use strict";

      // CONFIG
      const FFT_SIZE = 2048;
      const DISPLAY_MIN_HZ = 0;
      const DISPLAY_MAX_HZ = 22000;

      // TX State
      let tx = {
        ctx: null,
        osc: null,
        gain: null,
        running: false
      };

      const $ = id => document.getElementById(id);

      // MODE SWITCHING
      $("txMode").onclick = () => {
        $("txMode").classList.add("active");
        $("rxMode").classList.remove("active");
        $("txPanel").style.display = "";
        $("rxPanel").style.display = "none";
      };

      $("rxMode").onclick = () => {
        $("rxMode").classList.add("active");
        $("txMode").classList.remove("active");
        $("rxPanel").style.display = "";
        $("txPanel").style.display = "none";
      };

      // TX FREQUENCY
      const freqRange = $("txFreqRange");
      const freqNum = $("txFreqNum");
      const freqValText = $("freqValText");

      function updateFrequency(val, smooth = false) {
        const f = Math.max(100, Math.min(24000, parseFloat(val) || 1000));

        freqRange.value = f;
        freqNum.value = f;
        freqValText.textContent = `${f} Hz`;

        if (tx.running && tx.osc && tx.ctx) {
          if (smooth) {
            tx.osc.frequency.setTargetAtTime(f, tx.ctx.currentTime, 0.02);
          } else {
            tx.osc.frequency.setValueAtTime(f, tx.ctx.currentTime);
          }
          $("txStatus").textContent = `送信中: ${f}Hz`;
        }
      }

      freqRange.oninput = e => updateFrequency(e.target.value, true);
      freqNum.oninput = e => updateFrequency(e.target.value, false);

      // TX START
      $("txStart").onclick = async () => {
        if (tx.running) return;

        try {
          tx.ctx = new (window.AudioContext || window.webkitAudioContext)();

          if (tx.ctx.state === "suspended") {
            await tx.ctx.resume();
          }

          const freq = parseFloat(freqNum.value) || 18000;
          const gainVal = Math.max(0, Math.min(0.5, parseFloat($("txGainVal").value) || 0.05));

          tx.osc = tx.ctx.createOscillator();
          tx.gain = tx.ctx.createGain();

          tx.osc.type = "sine";
          tx.osc.frequency.setValueAtTime(freq, tx.ctx.currentTime);
          tx.gain.gain.setValueAtTime(gainVal, tx.ctx.currentTime);

          tx.osc.connect(tx.gain).connect(tx.ctx.destination);
          tx.osc.start();

          tx.running = true;

          $("txStart").disabled = true;
          $("txStop").disabled = false;
          $("txStatus").textContent = `送信中: ${freq}Hz`;
          $("txStatus").className = "status good";

          $("txLog").textContent =
            `[Info] Tone active at ${freq} Hz.\n` +
            `[Info] AudioContext: ${tx.ctx.state}\n` +
            `[Info] SampleRate: ${tx.ctx.sampleRate} Hz`;
        } catch (e) {
          $("txLog").textContent = `[Error] ${e.message}`;
        }
      };

      // TX STOP
      $("txStop").onclick = async () => {
        if (!tx.running) return;

        try {
          tx.osc?.stop();
          await tx.ctx?.close();
        } catch {}

        tx.running = false;

        $("txStart").disabled = false;
        $("txStop").disabled = true;
        $("txStatus").textContent = "停止中";
        $("txStatus").className = "status";
        $("txLog").textContent = "Transmitter stopped.";
      };

      // RX State
      let rx = {
        ctx: null,
        stream: null,
        source: null,
        analyser: null,
        bins: null,
        timeBins: null,
        raf: null,
        running: false,
        monitorGain: null
      };

      const canvas = $("spectrum");
      const g = canvas.getContext("2d");

      // RX START
      $("rxStart").onclick = async () => {
        if (rx.running) return;

        try {
          $("rxLog").textContent = "Requesting microphone...";

          rx.stream = await navigator.mediaDevices.getUserMedia({
            audio: {
              echoCancellation: false,
              noiseSuppression: false,
              autoGainControl: false,
              channelCount: 1
            },
            video: false
          });

          rx.ctx = new (window.AudioContext || window.webkitAudioContext)();

          if (rx.ctx.state === "suspended") {
            await rx.ctx.resume();
          }

          rx.source = rx.ctx.createMediaStreamSource(rx.stream);
          rx.analyser = rx.ctx.createAnalyser();

          rx.analyser.fftSize = FFT_SIZE;
          rx.analyser.smoothingTimeConstant = 0.0;

          rx.source.connect(rx.analyser);

          rx.monitorGain = rx.ctx.createGain();
          rx.monitorGain.gain.value = 0;

          rx.analyser.connect(rx.monitorGain);
          rx.monitorGain.connect(rx.ctx.destination);

          rx.bins = new Float32Array(rx.analyser.frequencyBinCount);
          rx.timeBins = new Uint8Array(rx.analyser.fftSize);

          rx.running = true;

          $("rxStart").disabled = true;
          $("rxStop").disabled = false;
          $("rxStatus").textContent = `受信中 (${rx.ctx.sampleRate}Hz)`;
          $("rxStatus").className = "status good";

          $("rxLog").textContent =
            `[Info] Microphone active.\n` +
            `[Info] AudioContext: ${rx.ctx.state}\n` +
            `[Info] SampleRate: ${rx.ctx.sampleRate} Hz\n` +
            `[Info] FFT: ${FFT_SIZE}\n` +
            `[Info] Smoothing: 0`;

          rx.raf = requestAnimationFrame(rxLoop);
        } catch (e) {
          $("rxStatus").textContent = "マイクエラー";
          $("rxStatus").className = "status bad";
          $("rxLog").textContent = `[Error] ${e.name}\n${e.message}`;
          rx.running = false;
        }
      };

      // RX STOP
      $("rxStop").onclick = async () => {
        rx.running = false;

        if (rx.raf) {
          cancelAnimationFrame(rx.raf);
        }

        try {
          rx.source?.disconnect();
          rx.analyser?.disconnect();
          rx.monitorGain?.disconnect();

          rx.stream?.getTracks().forEach(track => track.stop());
          await rx.ctx?.close();
        } catch {}

        rx.ctx = null;
        rx.stream = null;
        rx.source = null;
        rx.analyser = null;
        rx.monitorGain = null;

        $("rxStart").disabled = false;
        $("rxStop").disabled = true;
        $("rxStatus").textContent = "停止中";
        $("rxStatus").className = "status";

        $("peak1").textContent = "---- Hz (---- dB)";
        $("peak2").textContent = "---- Hz (---- dB)";
        $("peak3").textContent = "---- Hz (---- dB)";

        $("levelMeter").style.width = "0%";
        $("levelText").textContent = "---- dB";

        $("rxLog").textContent = "Receiver stopped.";
      };

      // SPECTRUM DRAW
      function drawSpectrum() {
        if (!rx.analyser || !rx.ctx || !rx.bins) return;

        if (canvas.width !== canvas.clientWidth || canvas.height !== canvas.clientHeight) {
          canvas.width = canvas.clientWidth;
          canvas.height = canvas.clientHeight;
        }

        const width = canvas.width;
        const height = canvas.height;
        const halfH = height / 2;
        const nyquist = rx.ctx.sampleRate / 2;
        const bufferLength = rx.analyser.frequencyBinCount;

        g.clearRect(0, 0, width, height);
        g.fillStyle = "#090c11";
        g.fillRect(0, 0, width, height);

        // OSCILLOSCOPE
        g.beginPath();
        for (let i = 0; i < rx.timeBins.length; i++) {
          const x = (i / (rx.timeBins.length - 1)) * width;
          const v = rx.timeBins[i] / 128;
          const y = halfH / 2 + (v - 1) * (halfH * 0.42);

          if (i === 0) {
            g.moveTo(x, y);
          } else {
            g.lineTo(x, y);
          }
        }

        g.strokeStyle = "#77e3a2";
        g.lineWidth = 1.5;
        g.stroke();

        // SEPARATOR
        g.strokeStyle = "#252b36";
        g.lineWidth = 1;
        g.beginPath();
        g.moveTo(0, halfH);
        g.lineTo(width, halfH);
        g.stroke();

        // FULL RANGE SPECTRUM (0 - 22kHz)
        const minBin = Math.max(0, Math.floor((DISPLAY_MIN_HZ / nyquist) * bufferLength));
        const maxBin = Math.min(bufferLength - 1, Math.ceil((DISPLAY_MAX_HZ / nyquist) * bufferLength));
        const totalBins = maxBin - minBin + 1;

        if (totalBins <= 0) return;

        const barWidth = width / totalBins;

        for (let i = 0; i < totalBins; i++) {
          const binIdx = minBin + i;
          const db = rx.bins[binIdx];

          const norm = Math.max(0, Math.min(1, (db + 110) / 80));
          const barHeight = norm * (halfH - 25);

          const grad = g.createLinearGradient(0, height, 0, halfH);
          grad.addColorStop(0, "rgba(0,240,255,0.10)");
          grad.addColorStop(1, "rgba(0,240,255,0.85)");

          g.fillStyle = grad;
          g.fillRect(i * barWidth, height - barHeight, Math.max(1, barWidth - 0.5), barHeight);
        }

        // GRID
        g.font = "11px ui-monospace, monospace";
        g.fillStyle = "#8b949e";

        for (let hz = 0; hz <= DISPLAY_MAX_HZ; hz += 4000) {
          const x = ((hz - DISPLAY_MIN_HZ) / (DISPLAY_MAX_HZ - DISPLAY_MIN_HZ)) * width;

          g.strokeStyle = "rgba(255,255,255,0.08)";
          g.beginPath();
          g.moveTo(x, halfH);
          g.lineTo(x, height);
          g.stroke();

          g.fillText(`${hz / 1000}kHz`, x + 3, halfH + 16);
        }

        g.fillStyle = "#6e7681";
        g.fillText(`SampleRate: ${rx.ctx.sampleRate} Hz / Nyquist: ${nyquist} Hz`, 8, height - 8);
      }

      // RX LOOP
      function rxLoop() {
        if (!rx.running || !rx.analyser || !rx.ctx) return;

        if (rx.ctx.state !== "running") {
          rx.ctx.resume().catch(() => {});
        }

        rx.analyser.getFloatFrequencyData(rx.bins);
        rx.analyser.getByteTimeDomainData(rx.timeBins);

        const nyquist = rx.ctx.sampleRate / 2;
        const bufferLength = rx.analyser.frequencyBinCount;

        // INPUT LEVEL
        let maxDb = -Infinity;
        for (let i = 0; i < rx.bins.length; i++) {
          if (rx.bins[i] > maxDb) {
            maxDb = rx.bins[i];
          }
        }

        if (!Number.isFinite(maxDb)) {
          maxDb = -100;
        }

        const levelPercent = Math.max(0, Math.min(100, ((maxDb + 100) / 70) * 100));

        $("levelMeter").style.width = `${levelPercent}%`;
        $("levelText").textContent = `${maxDb.toFixed(1)} dB`;

        // PEAKS
        let candidates = [];
        for (let i = 1; i < rx.bins.length - 1; i++) {
          const hz = i * nyquist / bufferLength;

          if (hz < DISPLAY_MIN_HZ || hz > DISPLAY_MAX_HZ) {
            continue;
          }

          const db = rx.bins[i];

          if (db > rx.bins[i - 1] && db >= rx.bins[i + 1]) {
            candidates.push({ bin: i, hz: hz, db: db });
          }
        }

        candidates.sort((a, b) => b.db - a.db);

        const peaks = [];
        for (const candidate of candidates) {
          if (candidate.db < -90) {
            continue;
          }

          const tooClose = peaks.some(p => Math.abs(p.hz - candidate.hz) < 100);
          if (tooClose) {
            continue;
          }

          peaks.push(candidate);
          if (peaks.length >= 3) {
            break;
          }
        }

        const peakText = p => p ? `${p.hz.toFixed(1)} Hz (${p.db.toFixed(1)} dB)` : "---- Hz (---- dB)";

        $("peak1").textContent = peakText(peaks[0]);
        $("peak2").textContent = peakText(peaks[1]);
        $("peak3").textContent = peakText(peaks[2]);

        $("rxLog").textContent =
          `[RX] AudioContext: ${rx.ctx.state}\n` +
          `[RX] SampleRate: ${rx.ctx.sampleRate} Hz\n` +
          `[RX] Nyquist: ${nyquist.toFixed(0)} Hz\n` +
          `[RX] FFT Size: ${rx.analyser.fftSize}\n` +
          `[RX] FFT Bins: ${bufferLength}\n` +
          `[RX] Max Input: ${maxDb.toFixed(1)} dB\n` +
          `[RX] 0-22kHz Peaks: ${peaks.length}`;

        drawSpectrum();

        rx.raf = requestAnimationFrame(rxLoop);
      }

      // CLEANUP
      window.addEventListener("beforeunload", () => {
        try {
          if (tx.running) {
            tx.osc?.stop();
            tx.ctx?.close();
          }

          if (rx.running) {
            rx.stream?.getTracks().forEach(t => t.stop());
            rx.ctx?.close();
          }
        } catch {}
      });
    })();
  </script>

</body>

</html>
