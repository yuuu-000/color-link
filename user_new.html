<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>CUE-X Receiver</title>
  <style>
    :root {
      --bg: #050507;
      --accent: #00f0ff;
      --accent-glow: rgba(0, 240, 255, 0.35);
      --text: #f8fafc;
      --text-sub: #64748b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      height: 100dvh;
      background-color: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      overflow: hidden;
      position: fixed;
    }

    /* 演出メインステージ（全画面発光） */
    #rxStage {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      background-color: #050507;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 24px;
      text-align: center;
      transition: background-color 0.2s ease;
      z-index: 1;
    }

    #rxTitle {
      font-size: clamp(1.8rem, 6vw, 3.2rem);
      font-weight: 900;
      letter-spacing: 0.05em;
      margin-bottom: 8px;
      text-shadow: 0 4px 24px rgba(0, 0, 0, 0.9);
      transition: opacity 0.2s;
    }

    #rxSub {
      font-size: clamp(0.9rem, 2.5vw, 1.1rem);
      color: var(--text-sub);
      font-family: ui-monospace, monospace;
      margin-bottom: 16px;
      letter-spacing: 0.08em;
      transition: opacity 0.2s;
    }

    #rxMsg {
      font-size: clamp(1.3rem, 4vw, 2.4rem);
      font-weight: 700;
      line-height: 1.5;
      word-break: break-all;
      text-shadow: 0 2px 12px rgba(0, 0, 0, 0.9);
    }

    #rxMsg.fired {
      font-size: clamp(2.2rem, 8vw, 4.5rem);
      font-weight: 900;
      color: #fff;
      animation: pulse-glow 2s infinite alternate;
    }

    @keyframes pulse-glow {
      0% { text-shadow: 0 0 10px rgba(255, 255, 255, 0.6); }
      100% { text-shadow: 0 0 30px var(--accent), 0 0 60px var(--accent-glow); }
    }

    /* 開始オーバーレイ（1タップで全権限を取得） */
    #startOverlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      height: 100dvh;
      background: rgba(5, 5, 7, 0.96);
      backdrop-filter: blur(20px);
      z-index: 100;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 24px;
      text-align: center;
    }

    #startOverlay h1 {
      font-size: 2rem;
      font-weight: 900;
      letter-spacing: 0.05em;
      margin-bottom: 12px;
      color: #fff;
    }

    #startOverlay p {
      color: #94a3b8;
      font-size: 0.95rem;
      max-width: 360px;
      line-height: 1.6;
      margin-bottom: 32px;
    }

    .btn-start {
      background: linear-gradient(135deg, var(--accent) 0%, #0088ff 100%);
      color: #000;
      border: none;
      padding: 16px 36px;
      border-radius: 30px;
      font-weight: 800;
      font-size: 1.05rem;
      cursor: pointer;
      box-shadow: 0 4px 25px var(--accent-glow);
      transition: transform 0.1s ease, box-shadow 0.2s;
    }

    .btn-start:active {
      transform: scale(0.96);
    }
  </style>
</head>

      try {
        const t0 = Date.now();
        const urls = [
          "https://3fe5a5f690efc790d4764f1c528a4ebb89fa4168.nict.go.jp/cgi-bin/json?" + (t0 / 1000),
          "https://67495dde3b39c2991829589f0101ab7a035eecf5.nict.go.jp/cgi-bin/json?" + (t0 / 1000),
          "https://08a08e3a6edef4ba7a0c055a42d8e1ba2597f2b5.nict.go.jp/cgi-bin/json?" + (t0 / 1000)
        ];

        const responses = await Promise.all(urls.map(u => fetch(u).then(r => r.json())));
        const t1 = Date.now();

        const timeOffset1 = (responses[0].st - responses[0].it) * 1000;
        const timeOffset2 = (responses[1].st - responses[1].it) * 1000;
        const timeOffset3 = (responses[2].st - responses[2].it) * 1000;

        const latency = (t1 - (((responses[0].it + responses[1].it + responses[2].it) * 1000) / 3));
        const latencOneWay = latency / 2;

        averageOffset = Math.round(((timeOffset1 + timeOffset2 + timeOffset3) / 3) - latencOneWay);
      } catch (e) {
        console.warn(e);
      }
    }
    fetchTime();
    setInterval(fetchTime, 600000);

          { timeMs: 54500, action: { color: "#000000", ms: 0 } }
        ]
      },

      "1000000": { cat: "HAPTIC", name: "ヘビードロップ", color: "#FFFFFF", ms: 50, vibrate: [300, 100, 300] },

      "100544576": { cat: "MESSAGE", name: "ウェルカム通知", color: "#000", msg: "ようこそ、ライブ会場へ！", ms: 300 },
      "100544577": { cat: "MESSAGE", name: "緊急避難アナウンス", color: "#000", msg: "緊急避難指示：係員の誘導に従ってください", ms: 200, strobe: 15 },
      "100544578": { cat: "MESSAGE", name: "サプライズ発表", color: "#000", msg: "ゲスト登場！", ms: 400, strobe: 10 },
      "100544579": { cat: "MESSAGE", name: "休憩アナウンス", color: "#000", msg: "15分間の休憩時間です", ms: 0 }
    };

    // =========================================================================
    // 4. 受信機エンジン & 画面制御（初心者向け完全自動化）
    // =========================================================================
    let rxCtx, analyser, dataArray;
    let rxState = "IDLE";
    let rxStartTime = 0;
    let potentialStartTime = 0;
    let decodedValues = [];

    let triggerNoiseFloor = null;
    let triggerConfirmCount = 0;
    let effectInterval = null;
    let effectTimeout = null;
    let timelineAnimFrame = null;
    let timelineScheduledTimeout = null;

    let wakeLock = null;

    async function requestWakeLock() {
      if ('wakeLock' in navigator) {
        try {
          wakeLock = await navigator.wakeLock.request('screen');
          wakeLock.addEventListener('release', () => { wakeLock = null; });
        } catch (err) {
          console.warn(err);
        }
      }
    }

    // 画面タップでマイク・全画面・画面スリープ防止を一括起動
    document.getElementById("startBtn").onclick = async () => {
      try {
        await requestWakeLock();

        // フルスクリーン化の試行
        const elem = document.documentElement;
        if (elem.requestFullscreen) {
          elem.requestFullscreen().catch(() => {});
        } else if (elem.webkitRequestFullscreen) {
          elem.webkitRequestFullscreen();
        }

        // マイクストリーム取得
        const stream = await navigator.mediaDevices.getUserMedia({
          audio: {
            echoCancellation: false,
            noiseSuppression: false,
            autoGainControl: false
          }
        });

        rxCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (rxCtx.state === "suspended") await rxCtx.resume();
        const source = rxCtx.createMediaStreamSource(stream);
        analyser = rxCtx.createAnalyser();

        analyser.fftSize = 2048;
        analyser.smoothingTimeConstant = 0.0;

        source.connect(analyser);
        dataArray = new Float32Array(analyser.frequencyBinCount);

        triggerNoiseFloor = null;
        triggerConfirmCount = 0;

        document.getElementById("startOverlay").style.display = "none";
        requestAnimationFrame(rxLoop);
      } catch (e) {
        alert("マイクの使用が許可されませんでした。ブラウザの設定をご確認ください。");
      }
    };

    // バックグラウンド復帰時にスリープ防止を再バインド
    document.addEventListener('visibilitychange', async () => {
      if (document.visibilityState === 'visible') {
        await requestWakeLock();
      }
    });

    function getMagnitude(freq, nyquist, bufferLength) {
      const bin = Math.round((freq / nyquist) * bufferLength);
      return Math.max(dataArray[bin - 1] || -999, dataArray[bin], dataArray[bin + 1] || -999);
    }

    function rxLoop() {
      analyser.getFloatFrequencyData(dataArray);
      const nyquist = rxCtx.sampleRate / 2;
      const bufferLength = analyser.frequencyBinCount;
      const now = performance.now();

      const magTrigger = getMagnitude(FREQ_TRIGGER, nyquist, bufferLength);
      const guardMag = getMagnitude(GUARD_FREQ, nyquist, bufferLength);

      if (rxState === "IDLE") {
        if (triggerNoiseFloor === null) {
          triggerNoiseFloor = magTrigger;
        } else {
          triggerNoiseFloor = triggerNoiseFloor * 0.985 + magTrigger * 0.015;
        }
        const dynThreshold = Math.max(TRIGGER_ABS_FLOOR, triggerNoiseFloor + TRIGGER_MARGIN_DB);
        const isPeakSharp = (magTrigger - guardMag) > TRIGGER_PROMINENCE_DB;

        if (magTrigger > dynThreshold && isPeakSharp) {
          if (triggerConfirmCount === 0) {
            potentialStartTime = now;
          }
          triggerConfirmCount++;
        } else {
          triggerConfirmCount = 0;
        }

        if (triggerConfirmCount >= TRIGGER_CONFIRM_FRAMES) {
          triggerConfirmCount = 0;
          rxState = "READING";
          rxStartTime = potentialStartTime;
          decodedValues = [];
        }
      } else if (rxState === "READING") {
        const elapsed = (now - rxStartTime) / 1000;
        const windowEnd = TIME_START + (TIME_SLOT * SLOT_COUNT);

        if (elapsed > TIME_START && elapsed < windowEnd) {
          const slotIndex = Math.floor((elapsed - TIME_START) / TIME_SLOT);
          const timeOffset = (elapsed - TIME_START) % TIME_SLOT;

          if (slotIndex >= 0 && slotIndex < SLOT_COUNT && decodedValues[slotIndex] === undefined && timeOffset > (TIME_SLOT * 0.25) && timeOffset < (TIME_SLOT * 0.75)) {
            let results = [];
            for (let i = 0; i < 31; i++) {
              results.push({ idx: i, hz: FREQ_DATA[i], mag: getMagnitude(FREQ_DATA[i], nyquist, bufferLength) });
            }
            results.sort((a, b) => b.mag - a.mag);

            const top1 = results[0];
            const top2 = results[1];
            const top3 = results[2];

            const isClearPair = top1.mag > THRESHOLD
              && top2.mag > TOP2_FLOOR
              && (top1.mag - top3.mag) > PAIR_PEAK_MARGIN;

            if (isClearPair) {
              const idxA = Math.min(top1.idx, top2.idx);
              const idxB = Math.max(top1.idx, top2.idx);
              let val = PAIRS.findIndex(p => p[0] === idxA && p[1] === idxB);

              if (val !== -1) {
                decodedValues[slotIndex] = val;
              }
            }
          }
        } else if (elapsed >= windowEnd) {
          const allDecoded = decodedValues.length === SLOT_COUNT && decodedValues.every(v => v !== undefined);

          if (allDecoded) {
            const [v0, v1, v2, v3] = decodedValues;
            const expectedChecksum = (v0 + v1 + v2) % PAIR_COUNT;

            if (v3 === expectedChecksum) {
              const finalId = (v0 * PAIR_COUNT * PAIR_COUNT) + (v1 * PAIR_COUNT) + v2;
              executeCue(finalId.toString());
              rxState = "IDLE";
            } else {
              rxState = "IDLE";
            }
          } else {
            rxState = "IDLE";
          }
        }
      }
      requestAnimationFrame(rxLoop);
    }

    let isCaching = false;

    // =========================================================================
    // 5. 演出実行エンジン (グリッド同期・タイムライン・メッセージ対応)
    // =========================================================================
    function clearEffects() {
      if (effectInterval) { clearInterval(effectInterval); effectInterval = null; }
      if (effectTimeout) { clearTimeout(effectTimeout); effectTimeout = null; }
      if (timelineAnimFrame) { cancelAnimationFrame(timelineAnimFrame); timelineAnimFrame = null; }
      if (timelineScheduledTimeout) { clearTimeout(timelineScheduledTimeout); timelineScheduledTimeout = null; }
    }

    function startMusicTimeline(cue, startSeekMs = 0) {
      const stage = document.getElementById("rxStage");
      const title = document.getElementById("rxTitle");
      const sub = document.getElementById("rxSub");
      const timeline = cue.timeline;
      if (!timeline || timeline.length === 0) return;

      title.innerText = cue.name;
      const originPerf = performance.now() - startSeekMs;
      let actionIndex = 0;

      while (actionIndex < timeline.length && startSeekMs > timeline[actionIndex].timeMs) {
        actionIndex++;
      }

      function step() {
        const currentElapsed = performance.now() - originPerf;
        sub.innerText = `タイムライン同期中: ${(currentElapsed / 1000).toFixed(1)}s`;

        while (actionIndex < timeline.length && currentElapsed >= timeline[actionIndex].timeMs) {
          const item = timeline[actionIndex];
          const act = item.action;

          if (act.strobe) {
            clearEffects();
            let on = false;
            effectInterval = setInterval(() => {
              on = !on;
              stage.style.transition = "none";
              stage.style.backgroundColor = on ? act.color : "#050507";
            }, 1000 / (act.strobe * 2));
          } else {
            clearEffects();
            stage.style.transition = `background-color ${act.ms || 100}ms ease`;
            stage.style.backgroundColor = act.color;
          }

          if (act.vibrate && navigator.vibrate) {
            navigator.vibrate(act.vibrate);
          }
          actionIndex++;
        }

        if (actionIndex < timeline.length) {
          timelineAnimFrame = requestAnimationFrame(step);
        } else {
          sub.innerText = "音響シグナルを待機しています";
          clearEffects();
          stage.style.transition = "background-color 500ms ease";
          stage.style.backgroundColor = "#050507";
        }
      }

      timelineAnimFrame = requestAnimationFrame(step);
    }

    function scheduleMusicTimeline(cue) {
      const gridSeconds = cue.start || 5;
      const gridMs = gridSeconds * 1000;
      const nowSynced = getSyncedNow();

      let targetUnix = Math.ceil(nowSynced / gridMs) * gridMs;

      // 判定完了からターゲットまで1秒未満の場合は次周へ
      if ((targetUnix - nowSynced) < 1000) {
        targetUnix += gridMs;
      }

      const delay = targetUnix - nowSynced;
      const sub = document.getElementById("rxSub");
      sub.innerText = `準備中: あと ${(delay / 1000).toFixed(1)}秒でスタート`;

      if (delay > 0) {
        timelineScheduledTimeout = setTimeout(() => {
          startMusicTimeline(cue, 0);
        }, delay);
      } else {
        const seek = Math.abs(delay);
        startMusicTimeline(cue, seek);
      }
    }

    function runEffect(cue) {
      clearEffects();
      const stage = document.getElementById("rxStage");
      const duration = cue.ms || 0;

      if (cue.type === "rainbow") {
        let hue = 0;
        stage.style.transition = "none";
        effectInterval = setInterval(() => {
          hue = (hue + 8) % 360;
          stage.style.backgroundColor = `hsl(${hue},100%,50%)`;
        }, 40);
      } else if (cue.type === "party") {
        const colors = cue.colors || ["#FF0033", "#00F0FF", "#FFB703", "#39FF14", "#FF00FF", "#0055FF"];
        stage.style.transition = "none";
        effectInterval = setInterval(() => {
          stage.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
        }, 90);
      } else if (cue.type === "heartbeat") {
        let beat = 0;
        stage.style.transition = "background-color 90ms ease";
        effectInterval = setInterval(() => {
          const phase = beat % 4;
          stage.style.backgroundColor = (phase === 0 || phase === 1) ? cue.color : "#050507";
          beat++;
        }, 160);
      } else if (cue.type === "sequence") {
        const seq = cue.colors || [cue.color];
        let i = 0;
        stage.style.transition = "background-color 120ms linear";
        effectInterval = setInterval(() => {
          stage.style.backgroundColor = seq[i % seq.length];
          i++;
        }, cue.stepMs || 200);
      } else if (cue.strobe) {
        let on = false;
        const hz = cue.strobe;
        stage.style.transition = "none";
        effectInterval = setInterval(() => {
          on = !on;
          stage.style.backgroundColor = on ? cue.color : "#000";
        }, 1000 / (hz * 2));
      } else {
        stage.style.transition = `background-color ${duration || 300}ms ease`;
        stage.style.backgroundColor = cue.color;
      }

      if (duration > 0) {
        effectTimeout = setTimeout(() => {
          clearEffects();
          stage.style.transition = "background-color 400ms ease";
          stage.style.backgroundColor = "#050507";
        }, duration);
      }
    }

    function executeCue(idStr) {
      const idNum = parseInt(idStr, 10);
      const stage = document.getElementById("rxStage");
      const title = document.getElementById("rxTitle");
      const sub = document.getElementById("rxSub");
      const msgEl = document.getElementById("rxMsg");

      if (idNum === ID_CMD_CACHE_START) {
        clearEffects();
        isCaching = true;
        rxTextCache = "";
        title.style.display = "block";
        sub.style.display = "block";
        msgEl.classList.remove("fired");
        title.innerText = "メッセージ受信中...";
        sub.innerText = "しばらくお待ちください";
        msgEl.innerText = "";
        return;
      }

      if (idNum === ID_CMD_CACHE_END) {
        isCaching = false;
        clearEffects();
        title.style.display = "block";
        sub.style.display = "block";
        msgEl.classList.remove("fired");
        title.innerText = "受信完了";
        sub.innerText = "発火を待機しています";
        msgEl.innerText = "";
        stage.style.transition = "background-color 300ms ease";
        stage.style.backgroundColor = "#050507";
        return;
      }

      if (idNum === ID_CMD_FIRE) {
        clearEffects();
        title.style.display = "none";
        sub.style.display = "none";
        msgEl.innerText = rxTextCache;
        msgEl.style.color = "#ddd";
        msgEl.classList.add("fired");
        stage.style.transition = "background-color 200ms ease-out";
        stage.style.backgroundColor = "#000000";
        return;
      }

      if (idNum >= UNICODE_OFFSET && idNum < UNICODE_OFFSET + 2000000) {
        clearEffects();
        let codePoint = idNum - UNICODE_OFFSET;
        let char = String.fromCodePoint(codePoint);

        if (isCaching) {
          rxTextCache += char;
        }
        title.style.display = "block";
        sub.style.display = "block";
        msgEl.classList.remove("fired");
        title.innerText = "メッセージ受信中...";
        sub.innerText = "しばらくお待ちください";
        return;
      }

      title.style.display = "block";
      sub.style.display = "block";
      msgEl.classList.remove("fired");

      if (CUE_DATA[idStr]) {
        const cue = CUE_DATA[idStr];
        title.innerText = cue.name;

        if (cue.type === "timeline") {
          msgEl.innerText = "";
          scheduleMusicTimeline(cue);
          return;
        }

        sub.innerText = "演出再生中";
        if (cue.msg) {
          msgEl.innerText = cue.msg;
          msgEl.style.color = "#ddd";
          clearEffects();
          stage.style.transition = `background-color ${cue.ms || 300}ms ease`;
          stage.style.backgroundColor = "#000000";
        } else {
          msgEl.innerText = "";
          runEffect(cue);
        }

        if (cue.vibrate && navigator.vibrate) navigator.vibrate(cue.vibrate);
        return;
      }

      if (idNum >= 20000000 && idNum <= 36777215) {
        clearEffects();
        const rgbNum = idNum - 20000000;
        const hexColor = "#" + rgbNum.toString(16).padStart(6, '0');

        title.innerText = "COLOR SYNC";
        sub.innerText = "カラー同期中";
        msgEl.innerText = "";

        stage.style.transition = "background-color 300ms ease";
        stage.style.backgroundColor = hexColor;
        return;
      }
    }
  </script>
</body>
