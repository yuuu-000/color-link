<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>アコースティック・レシーバー</title>
  <style>
    :root {
      --bg: #090a0f;
      --card-bg: #141721;
      --accent: #00f0ff;
      --accent-glow: rgba(0, 240, 255, 0.3);
      --text: #f8fafc;
      --text-sub: #94a3b8;
      --danger: #ff3366;
      --success: #39ff14;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* 受信エリア（フルスクリーン対応コンテナ） */
    #rxAreaContainer {
      position: relative;
      flex: 1;
      width: 100%;
      background-color: #000000;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    #rxCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #050505;
      z-index: 1;
      transition: background-color 0.3s ease;
    }

    /* 受信時のUIオーバーレイ */
    .rx-overlay {
      position: relative;
      z-index: 2;
      text-align: center;
      padding: 24px;
      pointer-events: none;
      width: 100%;
      max-width: 600px;
    }

    #rxTitle {
      font-size: clamp(1.8rem, 5vw, 3rem);
      font-weight: 800;
      letter-spacing: 0.05em;
      margin-bottom: 8px;
      text-shadow: 0 4px 20px rgba(0,0,0,0.8);
    }

    #rxSub {
      font-size: clamp(0.9rem, 2vw, 1.1rem);
      color: var(--text-sub);
      font-family: monospace;
      margin-bottom: 16px;
    }

    #rxMsg {
      font-size: clamp(1.2rem, 3.5vw, 2rem);
      font-weight: 600;
      line-height: 1.5;
      word-break: break-all;
      text-shadow: 0 2px 10px rgba(0,0,0,0.8);
    }

    /* 発火時のモーダルメッセージ演出 */
    #rxMsg.fired {
      font-size: clamp(2rem, 7vw, 4.5rem);
      font-weight: 900;
      color: #fff;
      animation: pulse-glow 2s infinite alternate;
    }

    @keyframes pulse-glow {
      0% { text-shadow: 0 0 10px rgba(255,255,255,0.5); }
      100% { text-shadow: 0 0 30px var(--accent), 0 0 60px var(--accent-glow); }
    }

    /* コントロールパネル（下部ダッシュボード） */
    .control-panel {
      background: var(--card-bg);
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      padding: 16px 20px calc(16px + env(safe-area-inset-bottom)) 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      z-index: 10;
      box-shadow: 0 -10px 30px rgba(0,0,0,0.5);
    }

    .panel-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .status-group {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 0.85rem;
    }

    .status-badge {
      padding: 4px 10px;
      border-radius: 20px;
      font-weight: 700;
      background: rgba(0, 240, 255, 0.1);
      color: var(--accent);
      border: 1px solid rgba(0, 240, 255, 0.3);
      letter-spacing: 0.03em;
    }

    .metrics {
      font-family: monospace;
      color: var(--text-sub);
      font-size: 0.8rem;
    }

    /* スロットインジケーター */
    .slots-container {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
    }

    .slot-box {
      background: rgba(0,0,0,0.3);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 6px;
      padding: 6px 4px;
      text-align: center;
      font-family: monospace;
      font-size: 0.75rem;
      color: var(--text-sub);
      transition: all 0.15s ease;
    }

    .slot-box.active {
      border-color: var(--accent);
      background: var(--accent-glow);
      color: #fff;
      box-shadow: 0 0 10px var(--accent-glow);
    }

    /* ボタン・キャンバス類 */
    .btn-action {
      background: linear-gradient(135deg, var(--accent) 0%, #0088ff 100%);
      color: #000;
      border: none;
      padding: 12px 20px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 15px var(--accent-glow);
      transition: transform 0.1s ease, opacity 0.2s;
      width: 100%;
    }

    .btn-action:active {
      transform: scale(0.97);
    }

    .btn-sub {
      background: rgba(255,255,255,0.08);
      color: var(--text);
      border: 1px solid rgba(255,255,255,0.15);
      padding: 10px 16px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-sub:hover {
      background: rgba(255,255,255,0.15);
    }

    #spectrumCanvas {
      width: 100%;
      height: 35px;
      background: rgba(0,0,0,0.2);
      border-radius: 4px;
    }

    /* 初期スタート画面オーバーレイ */
    #startOverlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: var(--bg);
      z-index: 100;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }

    #startOverlay h1 {
      font-size: 1.8rem;
      margin-bottom: 12px;
      color: #fff;
    }

    #startOverlay p {
      color: var(--text-sub);
      font-size: 0.95rem;
      max-width: 400px;
      line-height: 1.6;
      margin-bottom: 24px;
    }
  </style>
</head>
<body>

  <div id="startOverlay">
    <h1>Acoustic Receiver</h1>
    <p>ライブやイベントの音響同期を受信するため、マイクへのアクセスと画面のフルスクリーン化を許可してください。</p>
    <button class="btn-action" id="rxStartBtn" style="max-width: 280px;">受信を開始する</button>
  </div>

  <div id="rxAreaContainer">
    <div id="rxCanvas"></div>
    <div class="rx-overlay">
      <div id="rxTitle">スタンバイ中</div>
      <div id="rxSub">音響同期を待っています...</div>
      <div id="rxMsg"></div>
    </div>
  </div>

  <div class="control-panel">
    <div class="panel-row">
      <div class="status-group">
        <div class="status-badge" id="rxState">初期化待ち</div>
        <div class="metrics">Peak: <span id="rxPeak">--</span>dB / Thresh: <span id="rxThresh">--</span>dB</div>
      </div>
      <button class="btn-sub" id="rxFullscreenBtn">⛶ フルスクリーン</button>
    </div>

    <div class="slots-container">
      <div class="slot-box" id="slot1">S1: ---</div>
      <div class="slot-box" id="slot2">S2: ---</div>
      <div class="slot-box" id="slot3">S3: ---</div>
      <div class="slot-box" id="slot4">CS: ---</div>
    </div>

    <canvas id="spectrumCanvas"></canvas>
  </div>

  <script>
    const FREQ_TRIGGER = 20500;
    const GUARD_FREQ = 19000; // トリガー音の「鋭さ」判定用の参照周波数（広帯域ノイズ検出）
    const FREQ_DATA = [];
    for (let i = 0; i < 31; i++) {
      FREQ_DATA.push(17300 + (i * 100));
    }

    const PAIRS = [];
    for (let i = 0; i < 31; i++) {
      for (let j = i + 1; j < 31; j++) {
        PAIRS.push([i, j]);
      }
    }
    const PAIR_COUNT = PAIRS.length; // 465

    const TIME_START = 0.15;
    const TIME_SLOT = 0.12;
    const SLOT_COUNT = 4; // データ3 + チェックサム1（IDの取りうる数=465^3はそのまま。検証専用の追加トーン）
    const THRESHOLD = -90;             // スロット内ピア判定の絶対フロア（保険）
    const PAIR_PEAK_MARGIN = 7;         // 1位候補と3位候補のdB差。小さいと「不確実」として棄却
    const TRIGGER_MARGIN_DB = 18;        // 適応ノイズフロアからのマージン
    const TRIGGER_PROMINENCE_DB = 10;    // トリガー周波数とガード周波数のdB差（純音らしさ）
    const TRIGGER_CONFIRM_FRAMES = 3;    // 連続何フレーム条件を満たしたらトリガー確定とするか
    const TRIGGER_ABS_FLOOR = -85;       // ノイズフロアが異常に低い場合の絶対下限

    // プロトコル定義 (ダイレクトUnicode通信化)
    const ID_CMD_CACHE_START = 100544501;
    const ID_CMD_CACHE_END = 100544502;
    const ID_CMD_FIRE = 100544503;
    const UNICODE_OFFSET = 1000000; // ID 100万〜をUnicodeに割り当て

    let rxTextCache = "";

    const CUE_DATA = {
      "0": { cat: "SOLID", name: "ブラックアウト", color: "#050505", ms: 0 },
      "3": { cat: "SOLID", name: "ピュアレッド", color: "#FF0033", ms: 0 },
      "5": { cat: "SOLID", name: "サンセットオレンジ", color: "#FF6600", ms: 0 },
      "7": { cat: "SOLID", name: "サンバースト黄", color: "#FFB703", ms: 0 },
      "10": { cat: "SOLID", name: "ライムグリーン", color: "#39FF14", ms: 0 },
      "15": { cat: "SOLID", name: "ネオンシアン", color: "#00f0ff", ms: 0 },
      "18": { cat: "SOLID", name: "エレクトリック青", color: "#0055FF", ms: 0 },
      "22": { cat: "SOLID", name: "マゼンタピンク", color: "#FF00FF", ms: 0 },
      "25": { cat: "SOLID", name: "プラチナホワイト", color: "#F8FAFC", ms: 0 },

      "1000": { cat: "FADE", name: "オレンジフェード (3秒)", color: "#FF5500", ms: 3000 },
      "1001": { cat: "FADE", name: "ディープオーシャン (5秒)", color: "#001144", ms: 5000 },
      "1002": { cat: "FADE", name: "オーロラ (4秒)", color: "#00FF66", ms: 4000 },
      "1006": { cat: "FADE", name: "パルススイープ (2秒)", color: "#FF00FF", ms: 2000 },

      // 自動展開により1Hz〜30Hzを完全に網羅（15Hzも完全対応）
      ...(() => {
        const obj = {};
        for (let i = 0; i < 30; i++) {
          obj[(50000 + i).toString()] = { cat: "FLASH", name: `白黒${i + 1}Hz`, color: "#FFFFFF", ms: 0, strobe: i + 1 };
        }
        return obj;
      })(),

      "50100": { cat: "FLASH", name: "警告フラッシュ (赤)", color: "#FF0000", ms: 0, strobe: 6 },

      "70000": { cat: "LASER", name: "サイバービーム", color: "#00FFFF", ms: 3000, strobe: 10 },

      // --- 🎉 新規追加：楽しいエフェクト系プリセット ---
      "80000": { cat: "EFFECT", name: "レインボーサイクル", type: "rainbow", ms: 6000 },
      "80001": { cat: "EFFECT", name: "パーティーモード", type: "party", ms: 5000 },
      "80002": { cat: "EFFECT", name: "ハートビート", type: "heartbeat", color: "#FF0033", ms: 4800 },
      "80003": { cat: "EFFECT", name: "カラーチェイス", type: "sequence", colors: ["#FF0033", "#FFB703", "#39FF14", "#00f0ff", "#FF00FF"], stepMs: 180, ms: 4500 },
      "80004": { cat: "EFFECT", name: "スパークル", type: "party", colors: ["#FFFFFF", "#F8FAFC", "#00f0ff"], ms: 3000 },
      "80005": { cat: "EFFECT", name: "カウントダウン導光", type: "sequence", colors: ["#0055FF", "#39FF14", "#FFB703", "#FF0033", "#FFFFFF"], stepMs: 700, ms: 3500 },

      "1000000": { cat: "HAPTIC", name: "ヘビードロップ", color: "#FFFFFF", ms: 50, vibrate: [300, 100, 300] },

      "100544576": { cat: "MESSAGE", name: "ウェルカム通知", color: "#000", msg: "ようこそ、ライブ会場へ！", ms: 300 },
      "100544577": { cat: "MESSAGE", name: "緊急避難アナウンス", color: "#000", msg: "緊急避難指示：係員の誘導に従ってください", ms: 200, strobe: 15 },
      "100544578": { cat: "MESSAGE", name: "サプライズ発表", color: "#000", msg: "ゲスト登場！", ms: 400, strobe: 10 },
      "100544579": { cat: "MESSAGE", name: "休憩アナウンス", color: "#000", msg: "15分間の休憩時間です", ms: 0 }
    };

    let txCtx = null;
    function initTx() { if (!txCtx) txCtx = new (window.AudioContext || window.webkitAudioContext)(); }

    // idから3つのペアインデックス(0-464)を導出し、検証用チェックサムペアも計算する
    function decomposeId(id) {
      const base1 = PAIR_COUNT * PAIR_COUNT;
      const base2 = PAIR_COUNT;
      const val1 = Math.floor(id / base1);
      const rem1 = id % base1;
      const val2 = Math.floor(rem1 / base2);
      const val3 = rem1 % base2;
      const checksumVal = (val1 + val2 + val3) % PAIR_COUNT;
      return [val1, val2, val3, checksumVal];
    }

    function sendTrigger(idStr) {
      initTx();
      const now = txCtx.currentTime;
      const id = parseInt(idStr, 10);

      const [val1, val2, val3, checksumVal] = decomposeId(id);
      const slots = [PAIRS[val1], PAIRS[val2], PAIRS[val3], PAIRS[checksumVal]];

      const oscA = txCtx.createOscillator();
      const oscB = txCtx.createOscillator();
      const gainA = txCtx.createGain();
      const gainB = txCtx.createGain();
      oscA.connect(gainA).connect(txCtx.destination);
      oscB.connect(gainB).connect(txCtx.destination);

      const MAX_GAIN = 0.25;

      const scheduleSlot = (pair, startTime) => {
        if (!pair) return;
        oscA.frequency.setValueAtTime(FREQ_DATA[pair[0]], startTime);
        oscB.frequency.setValueAtTime(FREQ_DATA[pair[1]], startTime);
      };

      const applyEnvelope = (start, duration) => {
        gainA.gain.setValueAtTime(0, start);
        gainB.gain.setValueAtTime(0, start);
        gainA.gain.linearRampToValueAtTime(MAX_GAIN, start + 0.015);
        gainB.gain.linearRampToValueAtTime(MAX_GAIN, start + 0.015);
        gainA.gain.setValueAtTime(MAX_GAIN, start + duration - 0.015);
        gainB.gain.setValueAtTime(MAX_GAIN, start + duration - 0.015);
        gainA.gain.linearRampToValueAtTime(0, start + duration);
        gainB.gain.linearRampToValueAtTime(0, start + duration);
      };

      let t = now;
      oscA.frequency.setValueAtTime(FREQ_TRIGGER, t);
      gainA.gain.setValueAtTime(0, t);
      gainA.gain.linearRampToValueAtTime(MAX_GAIN, t + 0.02);
      gainA.gain.setValueAtTime(MAX_GAIN, t + TIME_START - 0.02);
      gainA.gain.linearRampToValueAtTime(0, t + TIME_START);
      gainB.gain.setValueAtTime(0, t);

      t += TIME_START;
      for (let i = 0; i < SLOT_COUNT; i++) {
        scheduleSlot(slots[i], t);
        applyEnvelope(t, TIME_SLOT);
        t += TIME_SLOT;
      }

      oscA.start(now); oscA.stop(t + 0.1);
      oscB.start(now); oscB.stop(t + 0.1);

      return (t - now) * 1000 + 30; // 実行時間 + 安全マージン
    }

    // 受信機ロジック
    let rxCtx, analyser, dataArray;
    let rxState = "IDLE";
    let rxStartTime = 0;
    let decodedValues = [];

    // --- ノイズ耐性用の状態 ---
    let triggerNoiseFloor = null;    // 適応型ノイズフロア（EMA）
    let triggerConfirmCount = 0;     // 連続フレームでの確認カウンタ

    // --- 表示エフェクト管理 ---
    let effectInterval = null;
    let effectTimeout = null;

    const spectrumCanvas = document.getElementById("spectrumCanvas");
    const specCtx = spectrumCanvas.getContext("2d");

    function getMagnitude(freq, nyquist, bufferLength) {
      const bin = Math.round((freq / nyquist) * bufferLength);
      return Math.max(dataArray[bin - 1] || -999, dataArray[bin], dataArray[bin + 1] || -999);
    }

    const UI_STATE = (msg, color) => {
      const el = document.getElementById("rxState");
      el.innerText = msg; el.style.color = color;
    };

    const UI_SLOT = (idx, val, active = false) => {
      const el = document.getElementById(`slot${idx}`);
      const prefix = idx === 4 ? "CS" : `S${idx}`;
      if (val !== null) el.innerText = `${prefix}: ${typeof val === 'number' ? val.toString().padStart(3, '0') : val}`;
      if (active) el.classList.add('active'); else el.classList.remove('active');
    };

    function resetSlotUI() {
      UI_SLOT(1, "---"); UI_SLOT(2, "---"); UI_SLOT(3, "---"); UI_SLOT(4, "---");
    }

    // --- Screen Wake Lock API (画面消灯防止) ---
    let wakeLock = null;
    async function requestWakeLock() {
      if ('wakeLock' in navigator) {
        try {
          wakeLock = await navigator.wakeLock.request('screen');
          wakeLock.addEventListener('release', () => { wakeLock = null; });
        } catch (err) { console.error(err); }
      }
    }
    document.addEventListener('visibilitychange', async () => {
      if (wakeLock !== null && document.visibilityState === 'visible') {
        await requestWakeLock();
      }
    });

    document.getElementById("rxStartBtn").onclick = async () => {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false } });
        rxCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (rxCtx.state === "suspended") await rxCtx.resume();
        const source = rxCtx.createMediaStreamSource(stream);
        analyser = rxCtx.createAnalyser();

        // FFTサイズを縮小し、スムージングを無効化 (残響混入バグの撃退)
        analyser.fftSize = 2048;
        analyser.smoothingTimeConstant = 0.0;

        source.connect(analyser);
        dataArray = new Float32Array(analyser.frequencyBinCount);

        triggerNoiseFloor = null;
        triggerConfirmCount = 0;

        document.getElementById("startOverlay").style.display = "none";
        const elem = document.getElementById("rxAreaContainer");
        if (elem.requestFullscreen) elem.requestFullscreen().catch(() => {});

        await requestWakeLock();

        UI_STATE("キャリブレーション中...", "#ffb703");
        requestAnimationFrame(rxLoop);
      } catch (e) { alert("マイクアクセスが拒否されました。"); }
    };

    document.getElementById("rxFullscreenBtn").onclick = () => {
      const elem = document.getElementById("rxAreaContainer");
      if (!document.fullscreenElement) {
        if (elem.requestFullscreen) elem.requestFullscreen();
      } else {
        if (document.exitFullscreen) document.exitFullscreen();
      }
    };

    function drawSpectrum() {
      if (!analyser || !rxCtx) return;
      if (spectrumCanvas.width !== spectrumCanvas.clientWidth || spectrumCanvas.height !== spectrumCanvas.clientHeight) {
        spectrumCanvas.width = spectrumCanvas.clientWidth;
        spectrumCanvas.height = spectrumCanvas.clientHeight;
      }
      const width = spectrumCanvas.width;
      const height = spectrumCanvas.height;
      specCtx.clearRect(0, 0, width, height);

      const nyquist = rxCtx.sampleRate / 2;
      const bufferLength = analyser.frequencyBinCount;
      const minBin = Math.floor((17000 / nyquist) * bufferLength);
      const maxBin = Math.floor((20600 / nyquist) * bufferLength);
      const totalBins = maxBin - minBin;

      if (totalBins <= 0) return;
      const barWidth = width / totalBins;

      for (let i = 0; i < totalBins; i++) {
        const binIdx = minBin + i;
        const db = dataArray[binIdx];
        let normHeight = Math.max(0, Math.min(1, (db + 100) / 70));
        let barHeight = normHeight * height;
        let grad = specCtx.createLinearGradient(0, height, 0, 0);
        grad.addColorStop(0, "rgba(0, 240, 255, 0.1)");
        grad.addColorStop(1, "rgba(0, 240, 255, 0.8)");
        specCtx.fillStyle = grad;
        specCtx.fillRect(i * barWidth, height - barHeight, Math.max(1, barWidth - 0.5), barHeight);
      }
    }

    function rxLoop() {
      analyser.getFloatFrequencyData(dataArray);
      const nyquist = rxCtx.sampleRate / 2;
      const bufferLength = analyser.frequencyBinCount;
      const now = performance.now();

      const magTrigger = getMagnitude(FREQ_TRIGGER, nyquist, bufferLength);
      const guardMag = getMagnitude(GUARD_FREQ, nyquist, bufferLength);
      document.getElementById("rxPeak").innerText = magTrigger > -100 ? magTrigger.toFixed(0) : "--";
      drawSpectrum();

      if (rxState === "IDLE") {
        // --- 適応型ノイズフロア（待機中のみ、ゆっくり環境音レベルに追従） ---
        if (triggerNoiseFloor === null) {
          triggerNoiseFloor = magTrigger;
        } else {
          triggerNoiseFloor = triggerNoiseFloor * 0.985 + magTrigger * 0.015;
        }
        const dynThreshold = Math.max(TRIGGER_ABS_FLOOR, triggerNoiseFloor + TRIGGER_MARGIN_DB);
        document.getElementById("rxThresh").innerText = dynThreshold.toFixed(0);

        // --- ピークの鋭さ判定（純音か、広帯域の生活音かを判別） ---
        const isPeakSharp = (magTrigger - guardMag) > TRIGGER_PROMINENCE_DB;

        if (magTrigger > dynThreshold && isPeakSharp) {
          triggerConfirmCount++;
        } else {
          triggerConfirmCount = 0;
        }

        // --- 連続フレームで確認できて初めてトリガー確定（単発ノイズスパイクを無視） ---
        if (triggerConfirmCount >= TRIGGER_CONFIRM_FRAMES) {
          triggerConfirmCount = 0;
          rxState = "READING";
          rxStartTime = now;
          decodedValues = [];
          UI_STATE("デコード中...", "#ffeb3b");
          resetSlotUI();
        } else if (UI_STATE) {
          // キャリブレーション完了後の通常表示
          const stateEl = document.getElementById("rxState");
          if (stateEl.innerText !== "リスニング中" && stateEl.innerText !== "デコード中...") {
            UI_STATE("リスニング中", "var(--accent)");
          }
        }
      } else if (rxState === "READING") {
        const elapsed = (now - rxStartTime) / 1000;
        const windowEnd = TIME_START + (TIME_SLOT * SLOT_COUNT);

        if (elapsed > TIME_START && elapsed < windowEnd) {
          const slotIndex = Math.floor((elapsed - TIME_START) / TIME_SLOT);
          const timeOffset = (elapsed - TIME_START) % TIME_SLOT;

          for (let i = 1; i <= SLOT_COUNT; i++) document.getElementById(`slot${i}`).classList.remove('active');
          document.getElementById(`slot${slotIndex + 1}`).classList.add('active');

          // 安定期判定をスロット後半（50%〜80%）にずらし、残響混入を防止
          if (decodedValues[slotIndex] === undefined && timeOffset > (TIME_SLOT * 0.5) && timeOffset < (TIME_SLOT * 0.8)) {
            let results = [];
            for (let i = 0; i < 31; i++) {
              results.push({ idx: i, mag: getMagnitude(FREQ_DATA[i], nyquist, bufferLength) });
            }
            results.sort((a, b) => b.mag - a.mag);

            const top1 = results[0];
            const top2 = results[1];
            const top3 = results[2];

            // 1位・2位が十分明瞭で、かつ3位候補と明確な差(PAIR_PEAK_MARGIN)がある場合のみ採用。
            const isClearPair = top1.mag > THRESHOLD
              && top2.mag > -95
              && (top1.mag - top3.mag) > PAIR_PEAK_MARGIN;

            if (isClearPair) {
              const idxA = Math.min(top1.idx, top2.idx);
              const idxB = Math.max(top1.idx, top2.idx);
              let val = PAIRS.findIndex(p => p[0] === idxA && p[1] === idxB);
              if (val !== -1) {
                decodedValues[slotIndex] = val;
                UI_SLOT(slotIndex + 1, val, true);
              }
            }
          }
        } else if (elapsed >= windowEnd) {
          for (let i = 1; i <= SLOT_COUNT; i++) document.getElementById(`slot${i}`).classList.remove('active');

          const allDecoded = decodedValues.length === SLOT_COUNT && decodedValues.every(v => v !== undefined);

          if (allDecoded) {
            const [v0, v1, v2, v3] = decodedValues;
            const expectedChecksum = (v0 + v1 + v2) % PAIR_COUNT;

            if (v3 === expectedChecksum) {
              // ✅ チェックサム一致。信頼できるパケットとして実行。
              const finalId = (v0 * PAIR_COUNT * PAIR_COUNT) + (v1 * PAIR_COUNT) + v2;
              executeCue(finalId.toString());
              rxState = "IDLE";
              UI_STATE("リスニング中", "var(--accent)");
            } else {
              rejectPacket("チェックサム不一致(破棄)");
            }
          } else {
            rejectPacket("デコード不完全(破棄)");
          }
        }
      }
      requestAnimationFrame(rxLoop);
    }

    function rejectPacket(reason) {
      rxState = "IDLE";
      UI_STATE(reason, "var(--danger)");
      setTimeout(() => {
        if (rxState === "IDLE") UI_STATE("リスニング中", "var(--accent)");
      }, 900);
    }

    let isCaching = false;

    // --- 表示エフェクトの統一ハンドラ ---
    function clearEffects() {
      if (effectInterval) { clearInterval(effectInterval); effectInterval = null; }
      if (effectTimeout) { clearTimeout(effectTimeout); effectTimeout = null; }
    }

    function runEffect(cue, canvas) {
      clearEffects();
      const duration = cue.ms || 0;

      if (cue.type === "rainbow") {
        let hue = 0;
        canvas.style.transition = "none";
        effectInterval = setInterval(() => {
          hue = (hue + 8) % 360;
          canvas.style.backgroundColor = `hsl(${hue},100%,50%)`;
        }, 40);
      } else if (cue.type === "party") {
        const colors = cue.colors || ["#FF0033", "#00F0FF", "#FFB703", "#39FF14", "#FF00FF", "#0055FF"];
        canvas.style.transition = "none";
        effectInterval = setInterval(() => {
          canvas.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
        }, 90);
      } else if (cue.type === "heartbeat") {
        let beat = 0;
        canvas.style.transition = "background-color 90ms ease";
        effectInterval = setInterval(() => {
          const phase = beat % 4;
          canvas.style.backgroundColor = (phase === 0 || phase === 1) ? cue.color : "#050505";
          beat++;
        }, 160);
      } else if (cue.type === "sequence") {
        const seq = cue.colors || [cue.color];
        let i = 0;
        canvas.style.transition = "background-color 120ms linear";
        effectInterval = setInterval(() => {
          canvas.style.backgroundColor = seq[i % seq.length];
          i++;
        }, cue.stepMs || 200);
      } else if (cue.strobe) {
        let on = false;
        const hz = cue.strobe;
        canvas.style.transition = "none";
        effectInterval = setInterval(() => {
          on = !on;
          canvas.style.backgroundColor = on ? cue.color : "#000";
        }, 1000 / (hz * 2));
      } else {
        // 通常のソリッド/フェード
        canvas.style.transition = `background-color ${duration || 300}ms ease`;
        canvas.style.backgroundColor = cue.color;
      }

      if (duration > 0) {
        effectTimeout = setTimeout(() => {
          clearEffects();
          canvas.style.transition = "background-color 400ms ease";
          canvas.style.backgroundColor = "#050505";
        }, duration);
      }
    }

    function executeCue(idStr) {
      const idNum = parseInt(idStr, 10);
      const canvas = document.getElementById("rxCanvas");
      const title = document.getElementById("rxTitle");
      const sub = document.getElementById("rxSub");
      const msgEl = document.getElementById("rxMsg");

      // --- キャッシュ関連 ---
      if (idNum === ID_CMD_CACHE_START) {
        clearEffects();
        isCaching = true;
        rxTextCache = "";
        title.style.display = "block"; sub.style.display = "block"; msgEl.classList.remove("fired");
        title.innerText = "データ受信中...";
        sub.innerText = `ID: ${idNum} (キャッシュ開始)`;
        msgEl.innerText = "";
        return;
      }

      if (idNum === ID_CMD_CACHE_END) {
        isCaching = false;
        clearEffects();
        title.style.display = "block"; sub.style.display = "block"; msgEl.classList.remove("fired");
        title.innerText = "キャッシュ完了";
        sub.innerText = `ID: ${idNum} (待機状態)`;
        msgEl.innerText = `[準備OK] ${rxTextCache}`;
        msgEl.style.color = "#ddd";
        canvas.style.transition = "background-color 300ms ease";
        canvas.style.backgroundColor = "#000000";
        return;
      }

      // --- 💥 FIRE (発火) ---
      if (idNum === ID_CMD_FIRE) {
        clearEffects();
        title.style.display = "none";
        sub.style.display = "none";
        msgEl.innerText = rxTextCache;
        msgEl.style.color = "#ddd";
        msgEl.classList.add("fired");
        canvas.style.transition = `background-color 200ms ease-out`;
        canvas.style.backgroundColor = "#000000";
        return;
      }

      // --- Unicode文字のダイレクト受信 (絵文字・漢字対応) ---
      if (idNum >= UNICODE_OFFSET && idNum < UNICODE_OFFSET + 2000000) {
        clearEffects();
        let codePoint = idNum - UNICODE_OFFSET;
        let char = String.fromCodePoint(codePoint);

        if (isCaching) {
          rxTextCache += char;
          msgEl.innerText = rxTextCache;
          msgEl.style.color = "#ddd";
        }
        title.style.display = "block"; sub.style.display = "block"; msgEl.classList.remove("fired");
        title.innerText = "文字受信";
        sub.innerText = `ID: ${idNum} (${char})`;
        return;
      }

      // 毎回UIリセット
      title.style.display = "block";
      sub.style.display = "block";
      msgEl.classList.remove("fired");

      // --- プリセット処理（ソリッド/フェード/ストロボ/レインボー等すべて runEffect に集約） ---
      if (CUE_DATA[idStr]) {
        const cue = CUE_DATA[idStr];
        title.innerText = cue.name;
        sub.innerText = `ID: ${idNum.toLocaleString()}`;

        if (cue.msg) {
          msgEl.innerText = cue.msg;
          msgEl.style.color = "#ddd";
          clearEffects();
          canvas.style.transition = `background-color ${cue.ms || 300}ms ease`;
          canvas.style.backgroundColor = "#000000";
        } else {
          msgEl.innerText = "";
          runEffect(cue, canvas);
        }

        if (cue.vibrate && navigator.vibrate) navigator.vibrate(cue.vibrate);
        return;
      }

      // --- RGBカラー直接同期 ---
      if (idNum >= 20000000 && idNum <= 36777215) {
        clearEffects();
        const rgbNum = idNum - 20000000;
        const hexColor = "#" + rgbNum.toString(16).padStart(6, '0');

        title.innerText = "RGBカラー直接同期";
        sub.innerText = `ID: ${idNum.toLocaleString()} (${hexColor.toUpperCase()})`;
        msgEl.innerText = "";

        canvas.style.transition = `background-color 300ms ease`;
        canvas.style.backgroundColor = hexColor;
        return;
      }

      title.innerText = "UNKNOWN";
      sub.innerText = `ID: ${idNum}`;
    }
  </script>
</body>
