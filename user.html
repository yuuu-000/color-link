<!doctype html>
<html lang="ja">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Color Receiver</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #1f2533;
      color: #fff;
      overflow: hidden;
      overscroll-behavior: none;
      transition: background 0.1s ease;
    }

    .fullscreen-bg {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: max(30px, env(safe-area-inset-top)) max(30px, env(safe-area-inset-right)) max(30px, env(safe-area-inset-bottom)) max(30px, env(safe-area-inset-left));
      z-index: 10;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      touch-action: manipulation;
    }

    .top-bar {
      width: 100%;
      display: flex;
      justify-content: flex-end;
    }

    .icon-btn {
      background: rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 12px;
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      touch-action: manipulation;
      transition: background 0.2s;
    }

    .icon-btn:hover {
      background: rgba(0, 0, 0, 0.6);
    }

    .center-status {
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(10px);
      padding: 12px 24px;
      border-radius: 30px;
      font: 600 15px ui-monospace, monospace;
      letter-spacing: 0.05em;
      border: 1px solid rgba(255, 255, 255, 0.15);
      pointer-events: none;
    }

    .setup-screen,
    .settings-modal,
    .message-modal {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: max(24px, env(safe-area-inset-top)) max(24px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(24px, env(safe-area-inset-left));
      background: #000;
      z-index: 20;
      overflow-y: auto;
      overscroll-behavior: none;
    }

    .settings-modal,
    .message-modal {
      display: none;
      z-index: 30;
      cursor: pointer;
    }

    .settings-modal.active,
    .message-modal.active {
      display: flex;
    }

    /* 一律でボーダーなし、黒背景(#000)、テキスト(#ddd) */
    .message-modal,
    .settings-modal,
    .setup-screen {
      background: #000;
      color: #ddd;
    }

    .panel {
      width: min(440px, 100%);
      background: #000;
      border: none;
      border-radius: 24px;
      padding: 32px;
      text-align: center;
      cursor: default;
      color: #ddd;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 24px;
      letter-spacing: -0.01em;
      color: #ddd;
    }

    .guide-text {
      color: #aaa;
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 24px;
      text-align: left;
    }

    .guide-text strong {
      color: #ddd;
    }

    button.primary-btn {
      width: 100%;
      border: none;
      border-radius: 14px;
      padding: 16px;
      background: #222;
      color: #ddd;
      cursor: pointer;
      font-size: 16px;
      font-weight: 700;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      touch-action: manipulation;
      transition: background 0.2s, transform 0.1s;
    }

    button.primary-btn:hover {
      background: #333;
    }

    button.danger-btn {
      width: 100%;
      border: none;
      border-radius: 14px;
      padding: 16px;
      background: #311;
      color: #ff8080;
      cursor: pointer;
      font-size: 16px;
      font-weight: 700;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      touch-action: manipulation;
      transition: background 0.2s, transform 0.1s;
      margin-top: 12px;
    }

    button.danger-btn:hover {
      background: #411;
    }

    button.primary-btn:active,
    button.danger-btn:active {
      transform: scale(0.98);
    }
  </style>
</head>

<body>

  <div id="setupScreen" class="setup-screen">
    <div class="panel">
      <h1>カラーレシーバー</h1>
      <div class="guide-text">
        周囲の音（超音波）をリアルタイムに感知し、画面全体をそのカラーに染め上げます。<br><br>
        <strong>ご利用方法:</strong><br>
        1. 下部のボタンを押してマイクを許可します。<br>
        2. 画面が自動で全画面になり、受信が始まります。<br>
        3. 受信画面をタップすると設定（マイク停止など）が開きます。
      </div>
      <button id="rxStart" class="primary-btn">受信を開始する</button>
    </div>
  </div>

  <div id="settingsModal" class="settings-modal">
    <div class="panel">
      <h1>設定</h1>
      <div class="guide-text" style="text-align: center; margin-bottom: 20px;">
        マイクの接続を解除し、初期画面に戻ります。
      </div>
      <button id="micStopBtn" class="danger-btn" style="margin-top: 0;">マイクをオフにする</button>
    </div>
  </div>

  <div id="messageModal" class="message-modal">
    <div class="panel">
      <h1 id="modalTitle">通知</h1>
      <div id="modalText" class="guide-text" style="text-align: center; margin-bottom: 24px;">
        -
      </div>
      <div id="modalButtons">
        <button id="closeMsgBtn" class="primary-btn">閉じる</button>
      </div>
    </div>
  </div>

  <div id="fullscreenBg" class="fullscreen-bg">
    <div class="top-bar">
      <button id="fullscreenBtn" class="icon-btn" title="フルスクリーン切替">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
      </button>
    </div>

    <div class="center-status" id="centerStatus">
      待機中...
    </div>

    <div style="height: 44px;"></div>
  </div>

  <script>
    (() => {
      "use strict";

      const MIN_FREQ = 18000;
      const MAX_FREQ = 21000;
      const TX_GRAY_END = 18500;
      const TX_COLOR_START = 18600;
      const RX_WHITE_BOUNDARY = 18550;

      const FFT_SIZE = 4096;
      const RX_THRESHOLD_DB = -110;

      let rx = {
        ctx: null,
        stream: null,
        source: null,
        analyser: null,
        bins: null,
        raf: null,
        running: false,
        lastColor: "#1f2533",
        lastFrequency: null,
        wakeLock: null,
        isStable: false,
        activeModalType: null
      };

      const $ = id => document.getElementById(id);

      function rgbToHex(r, g, b) {
        return "#" + [r, g, b].map(v =>
          Math.round(Math.max(0, Math.min(255, v)))
            .toString(16)
            .padStart(2, "0")
        ).join("").toUpperCase();
      }

      function hslToHex(h, s, l) {
        s /= 100; l /= 100;
        const c = (1 - Math.abs(2 * l - 1)) * s;
        const x = c * (1 - Math.abs((h / 60) % 2 - 1));
        const m = l - c / 2;
        let r = 0, g = 0, b = 0;
        if (h < 60) { r = c; g = x; }
        else if (h < 120) { r = x; g = c; }
        else if (h < 180) { g = c; b = x; }
        else if (h < 240) { g = x; b = c; }
        else if (h < 300) { r = x; b = c; }
        else { r = c; b = x; }
        return rgbToHex((r + m) * 255, (g + m) * 255, (b + m) * 255);
      }

      function frequencyToColor(freq) {
        const f = Math.max(MIN_FREQ, Math.min(MAX_FREQ, freq));
        if (f <= RX_WHITE_BOUNDARY) {
          if (f <= TX_GRAY_END) {
            const t = (f - MIN_FREQ) / (TX_GRAY_END - MIN_FREQ);
            const v = Math.round(t * 255);
            return rgbToHex(v, v, v);
          }
          return "#FFFFFF";
        }
        const t = (f - TX_COLOR_START) / (MAX_FREQ - TX_COLOR_START);
        const clampedT = Math.max(0, Math.min(1, t));
        return hslToHex(clampedT * 360, 100, 50);
      }

      function findUltrasonicPeak() {
        const sr = rx.ctx.sampleRate;
        const nyquist = sr / 2;
        const minBin = Math.max(0, Math.floor(MIN_FREQ / nyquist * rx.bins.length));
        const maxBin = Math.min(rx.bins.length - 1, Math.ceil(MAX_FREQ / nyquist * rx.bins.length));

        let maxDb = -Infinity;
        let maxBinIndex = minBin;

        for (let i = minBin; i <= maxBin; i++) {
          const db = rx.bins[i];
          if (db > maxDb) {
            maxDb = db;
            maxBinIndex = i;
          }
        }
        const peakHz = maxBinIndex * nyquist / rx.bins.length;
        return { peakHz, maxDb };
      }

      async function requestWakeLock() {
        if ('wakeLock' in navigator) {
          try {
            rx.wakeLock = await navigator.wakeLock.request('screen');
          } catch (err) {}
        }
      }

      async function releaseWakeLock() {
        if (rx.wakeLock) {
          try {
            await rx.wakeLock.release();
          } catch (err) {}
          rx.wakeLock = null;
        }
      }

      function getFullscreenElement() {
        return document.fullscreenElement ?? document.webkitFullscreenElement ?? null;
      }

      async function enterFullscreen() {
        try {
          if (document.documentElement.requestFullscreen) {
            await document.documentElement.requestFullscreen();
            return true;
          }
          if (document.documentElement.webkitRequestFullscreen) {
            document.documentElement.webkitRequestFullscreen();
            return true;
          }
        } catch (error) {}
        return false;
      }

      async function exitFullscreen() {
        try {
          if (document.exitFullscreen) {
            await document.exitFullscreen();
            return true;
          }
          if (document.webkitExitFullscreen) {
            document.webkitExitFullscreen();
            return true;
          }
        } catch (error) {}
        return false;
      }

      async function toggleFullscreen() {
        if (getFullscreenElement()) {
          await exitFullscreen();
        } else {
          await enterFullscreen();
        }
      }

      function applyBackgroundColor(color) {
        document.documentElement.style.background = color;
        document.body.style.background = color;
        $("fullscreenBg").style.background = color;
      }

      $("fullscreenBtn").addEventListener("pointerup", (e) => {
        e.stopPropagation();
        toggleFullscreen();
      });

      $("fullscreenBg").addEventListener("pointerup", (e) => {
        if (e.target.closest("#fullscreenBtn")) return;
        if ($("messageModal").classList.contains("active")) return;
        $("settingsModal").classList.add("active");
      });

      $("settingsModal").addEventListener("pointerup", (e) => {
        if (e.target === $("settingsModal")) {
          $("settingsModal").classList.remove("active");
        }
      });

      function closeModal() {
        $("messageModal").classList.remove("active");
        rx.activeModalType = null;
      }

      $("closeMsgBtn")?.addEventListener("pointerup", closeModal);
      $("messageModal").addEventListener("pointerup", (e) => {
        if (e.target === $("messageModal")) {
          closeModal();
        }
      });

      async function stopMic() {
        rx.running = false;
        if (rx.raf) cancelAnimationFrame(rx.raf);

        if (rx.stream) {
          rx.stream.getTracks().forEach(track => track.stop());
          rx.stream = null;
        }

        if (rx.ctx && rx.ctx.state !== "closed") {
          await rx.ctx.close();
          rx.ctx = null;
        }

        await releaseWakeLock();

        if (getFullscreenElement()) {
          await exitFullscreen();
        }

        $("settingsModal").classList.remove("active");
        closeModal();
        $("setupScreen").style.display = "flex";
        $("centerStatus").textContent = "待機中...";
        rx.lastColor = "#1f2533";
        rx.lastFrequency = null;
        rx.isStable = false;
        applyBackgroundColor(rx.lastColor);
      }

      $("micStopBtn").addEventListener("pointerup", stopMic);

      $("rxStart").addEventListener("pointerup", async () => {
        if (rx.running) return;
        try {
          rx.stream = await navigator.mediaDevices.getUserMedia({
            audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false, channelCount: 1 },
            video: false
          });
          rx.ctx = new (window.AudioContext || window.webkitAudioContext)();
          if (rx.ctx.state === "suspended") await rx.ctx.resume();

          rx.source = rx.ctx.createMediaStreamSource(rx.stream);
          rx.analyser = rx.ctx.createAnalyser();
          rx.analyser.fftSize = FFT_SIZE;
          rx.analyser.smoothingTimeConstant = 0.03;
          rx.source.connect(rx.analyser);
          rx.bins = new Float32Array(rx.analyser.frequencyBinCount);
          rx.running = true;
          rx.isStable = false;
          rx.activeModalType = null;

          await requestWakeLock();
          await enterFullscreen();

          $("setupScreen").style.display = "none";

          setTimeout(() => {
            if (rx.running) {
              rx.isStable = true;
            }
          }, 1000);

          const loop = () => {
            if (!rx.running) return;

            rx.analyser.getFloatFrequencyData(rx.bins);
            const d = findUltrasonicPeak();
            const confirmed = d.maxDb >= RX_THRESHOLD_DB;

            if (!rx.isStable) {
              applyBackgroundColor("#1f2533");
              $("centerStatus").textContent = "準備中...";
              rx.raf = requestAnimationFrame(loop);
              return;
            }

            if (confirmed) {
              let targetModalType = null;
              if (d.peakHz >= 20966) {
                targetModalType = 3;
              } else if (d.peakHz >= 20933) {
                targetModalType = 2;
              } else if (d.peakHz >= 20900) {
                targetModalType = 1;
              }

              if (targetModalType === null) {
                if (rx.activeModalType !== null) {
                  closeModal();
                }
              } else {
                if (rx.activeModalType !== targetModalType) {
                  $("settingsModal").classList.remove("active");
                  rx.activeModalType = targetModalType;

                  const modalEl = $("messageModal");
                  const titleEl = $("modalTitle");
                  const textEl = $("modalText");
                  const buttonsEl = $("modalButtons");

                  modalEl.classList.add("active");

                  if (targetModalType === 1) {
                    titleEl.textContent = "通知";
                    textEl.innerHTML = "これは予約メッセージです。<br><strong>今後ここにメッセージ</strong>";
                    buttonsEl.innerHTML = `
                      <button id="closeMsgBtn" class="primary-btn">閉じる</button>
                      <button id="modalMicStop" class="danger-btn">マイクをオフにする</button>
                    `;
                    $("closeMsgBtn").addEventListener("pointerup", closeModal);
                    $("modalMicStop").addEventListener("pointerup", stopMic);
                  } else if (targetModalType === 2) {
                    titleEl.textContent = "情報 B";
                    textEl.innerHTML = "指定帯域 2 (20933Hz〜)";
                    buttonsEl.innerHTML = `<button id="closeMsgBtn" class="primary-btn">閉じる</button>`;
                    $("closeMsgBtn").addEventListener("pointerup", closeModal);
                  } else if (targetModalType === 3) {
                    titleEl.textContent = "情報 C";
                    textEl.innerHTML = "指定帯域 3 (20966Hz〜)";
                    buttonsEl.innerHTML = `<button id="closeMsgBtn" class="primary-btn">閉じる</button>`;
                    $("closeMsgBtn").addEventListener("pointerup", closeModal);
                  }
                }
              }

              const color = frequencyToColor(d.peakHz);
              rx.lastColor = color;
              rx.lastFrequency = d.peakHz;

              applyBackgroundColor(color);
              $("centerStatus").textContent = color;
            } else {
              if (rx.activeModalType !== null) {
                closeModal();
              }
              applyBackgroundColor(rx.lastColor);
              $("centerStatus").textContent = rx.lastFrequency !== null ? rx.lastColor : "信号待機中...";
            }

            rx.raf = requestAnimationFrame(loop);
          };
          rx.raf = requestAnimationFrame(loop);
        } catch (e) {
          alert("マイクの許可が必要です。");
        }
      });
    })();
  </script>
</body>
</html>
